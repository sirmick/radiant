    diffusion: { median_years_to_S: 12, spread: 8 }
    saturates: null
    retired: null
    mass: 0.9
    mass_source: "estimate: attritable by design — the 2022–24 war consumed uncrewed aircraft at 5-6 figures a month and the binding constraint was cell, motor and airframe output, not design. The high-mass pole opposite stealth."
    sovereign_by: { USA: 2001, ISR: 2004, CHN: 2011, TUR: 2014, PAK: 2015, IRN: 2016, RUS: 2021, UKR: 2023 }
