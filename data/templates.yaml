# Hazard templates — generic sub-models, instantiated per actor (or dyad) at build time. No country names here.
# Each template: the event it predicts (kind in data/events.json), the unit (actor-year | dyad-year), the panel covariates
# it reads (data/panel.json vars, transformed), a literature prior for the coefficients, and where the fitted values go.
# scripts/fit-hazards.mjs fits a logistic model per template on the panel and writes data/fits.json with coefficients,
# era-holdout scores and calibration. The engine reads fits.json; the literature prior is used when the fit is absent or n is tiny.
# Covariate transforms: z (standardise on the fitting sample), log, lag1 (previous year), cat (one-hot), win5 (any in last 5 years).
# Sources per template are the papers the covariate set comes from; coefficients are priors, not results.

templates:
  - id: leader_exit
    label: Leader loses office (any exit)
    unit: actor-year
    event: leader_exit
    window: [1950, 2021]           # REIGN coverage
    covariates:
      - { var: regime, transform: cat, lag: 1, prior: { 0: 0, 1: 0.3, 2: 0.9, 3: 1.1 } }     # elections make exits routine
      - { var: leader_tenure, transform: log, lag: 1, prior: -0.2 }
      - { var: leader_age, transform: z, lag: 1, prior: 0.3 }
      - { var: at_war, transform: lag1, prior: 0.3 }
      - { var: gdp_growth, transform: z, lag: 1, prior: -0.2 }
      - { var: coup_attempt, transform: win5, prior: 0.4 }
    outcomes: { regular: null, irregular: null }   # split fitted from events.irregular
    sources: [Archigos/Goemans-Gleditsch-Chiozza 2009, "REIGN (Bell 2016)", "Svolik 2012"]

  - id: irregular_exit
    label: Irregular leader exit (coup, revolt, assassination, foreign removal)
    unit: actor-year
    event: leader_exit
    event_filter: { irregular: 1 }
    window: [1950, 2021]
    covariates:
      - { var: regime, transform: cat, lag: 1, prior: { 0: 0, 1: 0.2, 2: -0.8, 3: -1.8 } }
      - { var: leader_tenure, transform: log, lag: 1, prior: -0.3 }
      - { var: leader_age, transform: z, lag: 1, prior: 0.1 }
      - { var: at_war, transform: lag1, prior: 0.6 }
      - { var: gdp_growth, transform: z, lag: 1, prior: -0.3 }
      - { var: log_gdp_pc, transform: z, prior: -0.4 }
      - { var: coup_attempt, transform: win5, prior: 0.8 }
      - { var: leader_irregular_entry, transform: none, lag: 1, prior: 0.5 }
      - { var: great_game, transform: none, prior: 0.3, lifecycle: { phase: active, promoted: 2026-09-07, reason: "era-1945-1991-r2/statistics-4, engine-2: this template had no era mechanism at all and over-predicted 2.5x out of sample while coup_attempt — its own subset — carried two and predicted 1.0x. Ablation at holdout >= 1986 against base 0.770 / 0.0098 / 2.52 (AUC / Brier / exp-obs): great_game alone 0.780 / 0.0096 / 2.15, a gain on all three; jointly with info_access 0.775 / 0.0095 / 1.51, coef +0.57 — the best Brier and the best calibration of any combination tested, and the only mechanism that survives the all-candidates joint fit (+0.41 there while info_access and anticoup_norm collapse to +0.04 and -0.07). Same derived-bipolarity construction as the coup_attempt promotion" } }
      - { var: info_access, transform: z, prior: -0.5, lifecycle: { phase: active, promoted: 2026-09-07, reason: "era-1945-1991-r2/statistics-4: alone 0.773 / 0.0096 / 1.65 against base 0.770 / 0.0098 / 2.52 — a gain on all three, and the largest single calibration gain of any mechanism; jointly with great_game 0.775 / 0.0095 / 1.51, coef -0.40 per sd. Costs 342 rows and 18 events to nulls in the info_access column, the same price coup_attempt already pays for it. Hypothesis is the coup_attempt one: seizing the broadcaster stops working once information is distributed" } }
    sources: ["Goldstone et al. 2010 (PITF)", "Powell 2012", "Svolik 2012"]
    candidates:                                                    # era-1945-1991-r2/statistics-4, engine-2: this template had no candidates: block at all, so the era mechanisms that fixed coup_attempt's post-1990 over-prediction were never tested on the template that shares its events. Measured 2026-09-07 at --split 1986 and --split 1990, AFTER the regime/gdp_growth lag fix (statistics-2) and the leader_irregular_entry rebuild (data-2), so these numbers supersede the adversary's, which were taken on the leaky fit
      - { id: anticoup_norm, var: anticoup_norm, transform: none, prior: -0.5, holdout_split: 1986, hypothesis: "a democratic majority of live states raises the cost of an irregular seizure (derived, not a typed year)", evidence: "RETRACTED 2026-09-07 (era-1991-2026-r2/statistics-1). The recorded numbers — 'alone 0.774 / 0.0096 / 1.99 against base 0.770 / 0.0098 / 2.52, a gain on all three' — were produced by an ablation that computed `degenerate` over the FULL sample instead of over the training half, and by a coefficient printed from a fit on all rows including the holdout. The derived anticoup_norm is 1 only from 1999, so at this candidate's own holdout_split of 1986 it is a CONSTANT 0 in training: its coefficient cannot leave the hand-typed prior of -0.5, and the whole recorded 'gain' was that prior applied to the post-2001 test rows. Proof: with the prior set to 0 the variant scored identically to base to four decimals (0.749 / 0.0099 / 1.43 both), while the printed coefficient moved -0.36 -> -0.29 because it came from the leaky full-sample fit. scripts/lib/fit.mjs now refuses to score a variant with a term constant in its own training half and reports `unidentified at this split` instead, which is what this candidate reports today. It cannot be evaluated at any split before 1999, and a split after 1999 leaves too few test-half events; re-propose as the continuous dem_share margin (era-1991-2026-r2/statistics-5), which varies throughout the training half" }
      - { id: milper_share, var: milper_share, transform: z, prior: 0.2, holdout_split: 1986, hypothesis: "the coup family's one military-capacity term, carried on coup_attempt", evidence: "0.777 / 0.0097 / 2.63 against base 0.770 / 0.0098 / 2.52: +0.007 of AUC bought with WORSE calibration on a template whose defect is over-prediction. Not promoted" }
      - { id: year_trend, var: year, transform: z, prior: 0, hypothesis: "null: an unexplained secular decline. The benchmark the mechanisms have to beat, never a promotion", evidence: "0.776 / 0.0095 / 1.93. The promoted pair beats it on calibration (1.51) — which is the test a mechanism has to pass against a bare trend" }
    rejected:
      - { id: presence_any, evidence: "era-1945-1991-r2/statistics-4, measured 2026-09-07 at holdout >= 1986: 0.779 / 0.0099 / 2.60 against base 0.770 / 0.0098 / 2.52 — AUC up, Brier AND calibration down, on a template whose defect is over-prediction. Same verdict the coup_attempt candidates block records for it" }
      - { id: presence_change, evidence: "0.772 / 0.0098 / 2.52 against base 0.770 / 0.0098 / 2.52 — nothing moves. The flag is on 4.5% of the sample and the irregular exits inside it are not concentrated. Re-propose against a leader dataset that reaches before 1950, where the colonial withdrawals are (same note as coup_attempt)" }
    notes: "This is the generic form of russia_transition / iran_consolidation / china_transition. Outcome mix (managed / hardliner / fragmentation) is a per-actor parameter in actors.yaml, not fitted."

  - id: coup_attempt
    label: Coup attempt
    unit: actor-year
    event: coup
    window: [1950, 2025]               # era-modern-2000-2025/data-3: was [1950, 2021], REIGN's own end. data/history/events.yaml now carries the complete 2022-2025 Powell-Thyne-definition attempt list (12 attempts, 6 successful) and scripts/build-panel.mjs merges it onto the REIGN columns, so the window, the panel's FLAGS fill and scripts/backtest.mjs's COVERAGE.coup all move together
    covariates:
      - { var: regime, transform: cat, lag: 1, prior: { 0: 0.2, 1: 0.4, 2: 0, 3: -1.5 } }
      - { var: milper_share, transform: z, prior: 0.2 }          # milper / population
      - { var: log_gdp_pc, transform: z, prior: -0.5 }
      - { var: gdp_growth, transform: z, lag: 1, prior: -0.2 }
      - { var: coup_attempt, transform: win5, prior: 1.0 }        # coup trap
      - { var: leader_military, transform: none, lag: 1, prior: 0.3 }
      - { var: intrastate, transform: lag1, prior: 0.3 }
      - { var: info_access, transform: z, prior: -0.5, lifecycle: { phase: active, promoted: 2026-09-06, reason: "ablation: holdout exp/obs 1.70→1.42, coef −0.73, survives joint fit; user hypothesis 'seize the TV station no longer works'" } }
      - { var: great_game, transform: none, prior: 0.3, lifecycle: { phase: active, promoted: 2026-09-06, reason: "ablation: superpower client × bipolar era, coef +0.37, best holdout AUC among mechanisms, survives joint fit while bare client status does not; user hypothesis 'both USA and USSR ran great games'" }, note: "2026-09-07 (operator/derived-polarity): the bipolar half is now derived world state, not the typed years 1947-1991 — derived bipolar 1950-1994 and 2015-, coef +0.67 -> +0.60" }
    sources: ["Powell 2012", "Powell & Thyne 2011", "Gassebner, Gutmann & Voigt 2016"]
    notes: "Powell: military characteristics beat economic ones; wealth and growth 'perform poorly'. Priors reflect that."
    candidates:                                                    # rival explanations for the post-1990 decline; fit-hazards scores each on the holdout
      # operator/presence: a great-power garrison changes what a coup costs. Sign unknown by construction (protection
      # vs provocation), so the priors are 0; the withdrawal term is the package's directional claim. holdout >= 1986.
      # presence_USA / presence_RUS are country-named panel columns and the package names them explicitly. They stay
      # CANDIDATES, never covariates: agent/implementer.md forbids a country name in a fitted template, and the
      # measurement below is the reason there is no reason to break that (the best of the four is +0.004 of AUC).
      # The precedent for the columns existing at all is pact_usa / pact_rus, which are superpower-tie columns too.
      - { id: presence_any, var: presence_any, transform: z, prior: 0, holdout_split: 1986, hypothesis: "max great-power presence level on the actor's territory (data/presence.yaml via src/engine/presence.js); protection or provocation", evidence: "measured 2026-09-07 (operator/presence), NOT promoted. Ablation at the package's split (>= 1986; holdout AUC / Brier / exp-obs, base 0.833 / 0.0202 / 1.01): presence_any 0.827 / 0.0205 / 1.04, fitted -0.09 per sd. A loss on all three." }
      - { id: presence_change, var: presence_change, transform: none, prior: 0.3, holdout_split: 1986, hypothesis: "a withdrawal in the last 3 years: the patron's tripwire is gone and the veto with it", evidence: "measured 2026-09-07 (operator/presence), NOT promoted. presence_change 0.833 / 0.0203 / 1.01 against base 0.833 / 0.0202 / 1.01, fitted +0.26 — the sign the package predicted and no discrimination: the flag is on 4.5% of the coup sample and the coups inside it are not concentrated enough to move a rank statistic. Re-propose against a coup dataset that reaches before 1950, where the colonial withdrawals are." }
      - { id: presence_USA, var: presence_USA, transform: z, prior: 0, holdout_split: 1986, hypothesis: "per-power form of presence_any, as the package names it", evidence: "measured 2026-09-07 (operator/presence), NOT promoted. 0.831 / 0.0203 / 1.02 against base 0.833 / 0.0202 / 1.01, fitted -0.04 per sd." }
      - { id: presence_RUS, var: presence_RUS, transform: z, prior: 0, holdout_split: 1986, hypothesis: "per-power form of presence_any, as the package names it", evidence: "measured 2026-09-07 (operator/presence), NOT promoted. 0.837 / 0.0202 / 1.00 against base 0.833 / 0.0202 / 1.01, fitted -0.40 per sd — the only presence term on this template that gains anything, +0.004 of AUC on 339 events with the Brier unmoved, which is one event changing places. It is also a country-named column and would be the first in a fitted covariate list (agent/implementer.md rule 1 allows it only in data/history/events.yaml); a promotion this thin is not worth that. Re-propose as the generic pair patron-presence / rival-presence if the layer ever gets enough non-superpower stations to identify them." }
      - { id: cold_war, var: cold_war, transform: none, prior: 0, hypothesis: "superpower patronage made coups cheap; the flag is now the derived bipolarity of the world rather than the typed year <= 1991 (era dummy — not identifiable on a temporal holdout)", evidence: "unidentified at this template's split (era-1991-2026-r2/statistics-1): the derived cold_war is 1 for every year 1950-1989, i.e. constant over the whole training half at split 1986, so the ablation cannot estimate it. Until 2026-09-07 the ablation reported it as scoring 0.798 / 0.0205 / 1.19 — identical to base to four decimals — beside a coefficient of +0.30 taken from a full-sample fit; scripts/lib/fit.mjs now reports it as unidentified instead" }
      - { id: sp_client_one, var: sp_client_one, transform: none, prior: 0, hypothesis: "clients of exactly one superpower are the contested ones (retained as a monitored rival; ≈0 in the joint fit)" }
      - { id: anticoup_norm, var: anticoup_norm, transform: none, prior: 0, hypothesis: "regional anti-coup sanctions raise the cost; the flag is now derived (a democratic majority of live states — 1999 and 2001-2023 — rather than the typed year >= 2000, so it can switch off again and does in 2024)", evidence: "unidentified at this template's split of 1986 (era-1991-2026-r2/statistics-1): the flag is 0 for every training row, so its coefficient stays at its prior and any holdout movement is the prior, not an estimate. Its prior here is 0, so unlike the irregular_exit entry nothing was ever bought from it. It is also the term the 2024 switch-off makes unreliable — see era-1991-2026-r2/statistics-5 and the dem_share source line in data/panel.json" }
      - { id: year_trend, var: year, transform: z, prior: 0, hypothesis: "null: an unexplained secular trend" }
      - { id: urban_share, var: urban_share, transform: z, prior: 0, hypothesis: "urban mass publics make seizures contestable" }
      - { id: median_age, var: median_age, transform: z, prior: -0.3, hypothesis: "Urdal 2006 / Goldstone et al. 2010: the youth-bulge half of the PITF model, entered as UN WPP median age (its inverse), so the prior is negative. Reachable only since era-1991-2026-r2/statistics-6 opened the modern fold's window from 2000 back to 1950", evidence: "measured 2026-09-07 (era-1991-2026-r2/statistics-6 (b)), NOT promoted, and closer than on intrastate_onset. Ablation at holdout >= 1986, base 0.798 / 0.0205 / 1.19: median_age 0.801 / 0.0205 / 1.21, fitted -0.19 per sd, on the SAME sample (no rows lost — WPP covers 1950 and this template's window opens there). Right sign, +0.003 of AUC, Brier flat to four decimals and calibration 0.02 worse. That is not enough to promote and it is the first age-structure measurement this template has ever had, so it is recorded rather than repeated" }

  - id: democratize_step
    lead: 1                            # label = event in year+1; hazard from this year's state applies to the coming year
    label: Regime category moves up (V-Dem RoW), autocracies at risk
    unit: actor-year
    event: regime_change
    event_filter: { direction: democratize, cause: null }   # cause is stamped by scripts/build-events.mjs from the occupation spans in data/history/events.yaml; a step taken under or immediately after foreign occupation is not a domestic transition. NOT filtered on `durable` — the numbers are in the rejected: block below
    window: [1816, 2024]                # era-1870-1914-r2/data-3: was [1900, 2024]. The label source (regime_change, V-Dem RoW via OWID) runs from 1789 and events.json holds 179 pre-1900 regime changes; the window was throwing them away. At labels <= 1870 the sample is 774 rows / 7 events, <= 1890 1239 / 20, <= 1900 1499 / 29 — every one of them past the fitter's n>=50, events>=5 gate
    holdout_split: 2005                # training must include 1992–2004 so conditionality is identified
    sample: { regime_max: 1, exclude_flag: occupied }   # era-1914-1945-r2/statistics-3: a state under foreign occupation is not at risk of a DOMESTIC transition and its label is already forced to 0 by event_filter — censor the row out of the denominator instead of scoring it as an observed non-event
    covariates:
      - { var: regime, transform: cat, prior: { 0: 0, 1: 0.5 } }
      - { var: log_gdp_pc, transform: z, prior: 0.3 }
      - { var: gdp_growth, transform: z, prior: -0.3 }
      - { var: at_war, transform: lag1, prior: 0.2 }
      - { var: leader_exit_recent, transform: win5, prior: 0.5, default_outside: { window: [1946, 2021], value: 0, source: "leader exits are derived from REIGN (1950+); events.json has none before 1946, so this covariate is an imputed 0 for every pre-1950 actor-year. Imputation, not an observation" } }
      - { var: aid_conditionality, transform: none, prior: 0.5, lifecycle: { phase: active, promoted: 2026-09-06, reason: "user hypothesis (external influence > neighbours): ODA/GNI × 1992–2016 promotion era; holdout≥2005 AUC 0.578→0.641, coef +0.53; largest single gain on any regime template" }, note: "2026-09-07 (operator/derived-polarity): the promotion era is now derived (unipolar under a democratic hegemon — 1946-1948 and 1995-2014), not the typed 1992-2016; coef +0.83 -> +0.68, holdout AUC 0.604 -> 0.593" }
      - { var: pact_usa, transform: none, prior: 0.5, lifecycle: { phase: active, promoted: 2026-09-06, reason: "US clients step up more (+0.59), identified on Cold War variation" } }
      - { var: pact_rus, transform: none, prior: -0.5, lifecycle: { phase: active, promoted: 2026-09-06, reason: "Soviet clients held autocratic (−0.50)" } }
    candidates:
      - { id: patron_regime, var: patron_regime, transform: none, prior: 0, hypothesis: "clients drift toward the patron's regime type (+0.49 alone, ≈0 once pact_* are in)" }
      - { id: hegemon_x_client, var: hegemon_x_client, transform: none, prior: 0, hypothesis: "user: hegemon's clients track the hegemon's regime score — collinear with pact_usa until the US series varies (first variation: 2025 = 2)" }
    rejected:                                                     # tested 2026-09-06 (neighbourhood diffusion); kept so the loop doesn't re-propose them
      - { id: durable_label_filter, evidence: "era-1991-2026-r2/statistics-2, tested 2026-09-07 on all four regime templates and NOT adopted. The defect is real and measured: scripts/build-events.mjs stamps a regime_change on ANY one-year change in the V-Dem RoW ordinal, and 321 of the 1,130 events (28%) are reversed within three years — CAN 2020/2021/2022, LVA 2013/2014/2016, SVN 2021/2022/2023, SVK 2019/2020/2023, TKM 2022/2024. So the build now stamps `durable` (consecutive observed years the new category held, capped at 3, credited in full where the run reaches the end of the actor's series) and `flap: 1` on every event, and data/events.json carries both — nothing is deleted and the next turn can use the field. What was NOT adopted is FILTERING on it. Measured with `event_filter: { durable: 3 }` on all four templates against the identical build without it, rolling-origin 1870-2010, 100 runs, universe all (pooled skill / AUC / exp-obs): democratize_step -0.226 / 0.544 / 0.69 against -0.194 / 0.545 / 0.80; democratic_deepening -1.270 / 0.768 / 4.48 against -0.739 / 0.693 / 2.94; autocratic_closure -0.115 / 0.575 / 0.72 against -0.125 / 0.604 / 0.77. That is worse on the loop's own statistic for two of the three and a wash on the third (autocratic_closure buys 0.010 of skill for 0.029 of AUC). k=2 was measured on the fit holdout first and is no better: democratize_step 0.518, democratic_deepening 0.870, autocratic_closure 0.518 against the unfiltered 0.591 / 0.848 / 0.556. Diagnosis: removing the flaps removes the events the surviving covariates predict best (a flap happens to an actor sitting on a category boundary, which regime= and log_gdp_pc identify), so the filter takes more signal than noise out of a sample that is already thin. Re-propose with the flap modelled rather than deleted — a `boundary` covariate marking an actor whose category changed in either direction inside the last k years — which keeps the rows and prices the measurement noise." }
      - { id: nbr_democracy_share, evidence: "democratize_step holdout≥1990: coef −0.25 (wrong sign), Brier worse; autocratize_step: coef +0.36, AUC 0.74→0.61. Selection effect: surviving autocracies in democratic neighbourhoods are the resilient ones; 2010s backsliding happened inside democratic Europe." }
      - { id: nbr_regime_up_recent, evidence: "≈0 on all targets" }
      - { id: nbr_regime_down_recent, evidence: "+0.14–0.35 in-sample, no holdout gain" }
      - { id: bad_neighbourhood, evidence: "+0.28 on intrastate, +0.35 on autocratization in-sample; holdout AUC unchanged or lower" }
      - { id: nbr_conflict_count, evidence: "≈0" }
    sources: ["Gleditsch & Ward 2006", "V-Dem RoW via OWID"]
    lifecycle: { phase: active, promoted: 2026-09-06, reason: "category-step target beats ERT episodes on holdout: AUC 0.47→0.77; engine uses this for regime dynamics" }

  - id: democratic_deepening
    lead: 1
    label: Electoral democracy deepens to liberal democracy (2→3)
    unit: actor-year
    event: regime_change
    event_filter: { direction: democratize, from: 2, cause: null }   # NOT filtered on `durable`: see the rejected: block on democratize_step (era-1991-2026-r2/statistics-2)
    window: [1900, 2024]                # NOT extended to 1816 (era-1870-1914-r2/data-3): the sample exists back to 1816 but carries 0 deepening events before 1900 (n=26, events=0 at labels <= 1900), so the extension would add non-events only and bias the base rate down. Re-open it when a pre-1900 label source exists
    holdout_split: 2005
    sample: { regime_min: 2, regime_max: 2, exclude_flag: occupied }   # era-1914-1945-r2/statistics-3: a state under foreign occupation is not at risk of a DOMESTIC transition and its label is already forced to 0 by event_filter — censor the row out of the denominator instead of scoring it as an observed non-event
    covariates:
      - { var: log_gdp_pc, transform: z, prior: 0.5 }
      - { var: gdp_growth, transform: z, prior: 0.2 }
      - { var: at_war, transform: lag1, prior: -0.3 }
      - { var: intrastate, transform: lag1, prior: -0.3, default_outside: { window: [1946, 2024], value: 0, source: "UCDP/PRIO ACD covers 1946-2024; outside it internal conflict is unobserved and imputed 0 so the template is estimable back to its window start. Imputation, not an observation — see docs/refine-log.md" } }
    candidates:                        # era-modern-2000-2025/statistics-2 (b): both DEMOTED from covariates 2026-09-08, with the numbers
      - { id: aid_conditionality, var: aid_conditionality, transform: none, prior: 0.3, hypothesis: "conditionality deepens a democracy, as it does on democratize_step", evidence: "measured 2026-09-08 and NOT re-promoted. Both terms were promoted on democratize_step (2->3 is a different step from 0/1->higher) and on THIS template both fit with the OPPOSITE sign to their prior: aid_conditionality -0.16 against +0.3 and pact_usa -0.69 against +0.3, on n=2,415 / 43 events with no holdout that could have caught it. Ablation at the template's own split (holdout >= 2005, AUC / Brier / exp-obs): base without both 0.859 / 0.0154 / 1.96, with aid_conditionality 0.862 / 0.0154 / 1.94, with pact_usa 0.845 / 0.0158 / 1.87, with both 0.848 / 0.0158 / 1.86 — the pair costs 0.011 of holdout AUC and buys 0.10 of exp/obs on a template that over-predicts 2-4x either way. The over-prediction itself is not these terms: it is z(log_gdp_pc) = +1.31 against a +0.5 prior on a variable whose live-actor mean rises 0.94 pooled sd over the sample, i.e. the calendar-trend defect docs/escalations.md era-modern-2000-2025/statistics-1 asks for a within-year standardisation to fix" }
      - { id: pact_usa, var: pact_usa, transform: none, prior: 0.3, hypothesis: "US clients deepen more", evidence: "measured 2026-09-08, NOT re-promoted — the numbers are on the aid_conditionality entry above (one ablation covers both)." }
    sources: ["Przeworski et al. 2000 (income and democratic survival/consolidation)"]
    lifecycle: { phase: active, promoted: 2026-09-06, reason: "closes the regime ladder: without it nothing moves an electoral democracy up" }

  - id: autocratic_closure
    lead: 1
    label: Electoral regime closes (2→1, 2→0, 1→0)
    unit: actor-year
    event: regime_change
    event_filter: { direction: autocratize, cause: null }   # 8 of the 18 closures scored at as-of 1930 were German occupation or Soviet imposition, not domestic closure. NOT filtered on `durable`: see the rejected: block on democratize_step
    window: [1816, 2024]                # era-1870-1914-r2/data-3: was [1900, 2024], same reason. At labels <= 1870 the sample is 235 rows / 5 events, <= 1890 470 / 16, <= 1900 608 / 21
    holdout_split: 2005
    sample: { regime_min: 1, regime_max: 3, exclude_flag: occupied }   # era-1914-1945-r2/statistics-3: a state under foreign occupation is not at risk of a DOMESTIC transition and its label is already forced to 0 by event_filter — censor the row out of the denominator instead of scoring it as an observed non-event. era-modern-2000-2025/statistics-2, engine-1: regime_max was 2, which put the 3->2 step on liberal_erosion alone — a template the fitter's events>=5 gate refuses at every one of the 15 backtested origins (2 labels at 2010, 29 of its 31 events fall after 2009). So in every backtested world regime 3 was ABSORBING: the only fitted hazard on the top rung pushed states up, and the engine's simulated liberal-democracy count rose 45 -> 69 over the as-of-2010 horizon while the observed count fell 44 -> 31. The 3->2 steps are now labels on this template, where they are estimable at every as-of year, with the level carried by the regime cat term below
    covariates:
      - { var: regime, transform: cat, prior: { 1: 0, 2: 0.3, 3: -0.5 } }   # the 3 level (era-modern-2000-2025/statistics-2): a liberal democracy closes less often than an electoral one, so the prior is below the 1 baseline; the data estimates how much
      - { var: log_gdp_pc, transform: z, prior: -0.5 }
      - { var: gdp_growth, transform: z, prior: -0.3 }
      - { var: at_war, transform: lag1, prior: 0.3 }
      - { var: intrastate, transform: lag1, prior: 0.4, default_outside: { window: [1946, 2024], value: 0, source: "UCDP/PRIO ACD covers 1946-2024; outside it internal conflict is unobserved and imputed 0 so the template is estimable back to its window start. Imputation, not an observation — see docs/refine-log.md" } }
