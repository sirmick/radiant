# Hazard templates — generic sub-models, instantiated per actor (or dyad) at build time. No country names here.
# Each template: the event it predicts (kind in data/events.json), the unit (actor-year | dyad-year), the panel covariates
# it reads (data/panel.json vars, transformed), a literature prior for the coefficients, and where the fitted values go.
# scripts/fit-hazards.mjs fits a logistic model per template on the panel and writes data/fits.json with coefficients,
# era-holdout scores and calibration. The engine reads fits.json; the literature prior is used when the fit is absent or n is tiny.
# Covariate transforms: z (standardise on the fitting sample), log, lag1 (previous year), cat (one-hot), win5 (any in last 5 years).
# Sources per template are the papers the covariate set comes from; coefficients are priors, not results.

templates:
  - id: leader_exit
    label: Leader loses office (any exit)
    unit: actor-year
    event: leader_exit
    window: [1950, 2021]           # REIGN coverage
    covariates:
      - { var: regime, transform: cat, prior: { 0: 0, 1: 0.3, 2: 0.9, 3: 1.1 } }     # elections make exits routine
      - { var: leader_tenure, transform: log, lag: 1, prior: -0.2 }
      - { var: leader_age, transform: z, lag: 1, prior: 0.3 }
      - { var: at_war, transform: lag1, prior: 0.3 }
      - { var: gdp_growth, transform: z, prior: -0.2 }
      - { var: coup_attempt, transform: win5, prior: 0.4 }
    outcomes: { regular: null, irregular: null }   # split fitted from events.irregular
    sources: [Archigos/Goemans-Gleditsch-Chiozza 2009, "REIGN (Bell 2016)", "Svolik 2012"]

  - id: irregular_exit
    label: Irregular leader exit (coup, revolt, assassination, foreign removal)
    unit: actor-year
    event: leader_exit
    event_filter: { irregular: 1 }
    window: [1950, 2021]
    covariates:
      - { var: regime, transform: cat, prior: { 0: 0, 1: 0.2, 2: -0.8, 3: -1.8 } }
      - { var: leader_tenure, transform: log, lag: 1, prior: -0.3 }
      - { var: leader_age, transform: z, lag: 1, prior: 0.1 }
      - { var: at_war, transform: lag1, prior: 0.6 }
      - { var: gdp_growth, transform: z, prior: -0.3 }
      - { var: log_gdp_pc, transform: z, prior: -0.4 }
      - { var: coup_attempt, transform: win5, prior: 0.8 }
      - { var: leader_irregular_entry, transform: none, lag: 1, prior: 0.5 }
    sources: ["Goldstone et al. 2010 (PITF)", "Powell 2012", "Svolik 2012"]
    notes: "This is the generic form of russia_transition / iran_consolidation / china_transition. Outcome mix (managed / hardliner / fragmentation) is a per-actor parameter in actors.yaml, not fitted."

  - id: coup_attempt
    label: Coup attempt
    unit: actor-year
    event: coup
    window: [1950, 2021]
    covariates:
      - { var: regime, transform: cat, prior: { 0: 0.2, 1: 0.4, 2: 0, 3: -1.5 } }
      - { var: milper_share, transform: z, prior: 0.2 }          # milper / population
      - { var: log_gdp_pc, transform: z, prior: -0.5 }
      - { var: gdp_growth, transform: z, prior: -0.2 }
      - { var: coup_attempt, transform: win5, prior: 1.0 }        # coup trap
      - { var: leader_military, transform: none, lag: 1, prior: 0.3 }
      - { var: intrastate, transform: lag1, prior: 0.3 }
      - { var: info_access, transform: z, prior: -0.5, lifecycle: { phase: active, promoted: 2026-09-06, reason: "ablation: holdout exp/obs 1.70→1.42, coef −0.73, survives joint fit; user hypothesis 'seize the TV station no longer works'" } }
      - { var: great_game, transform: none, prior: 0.3, lifecycle: { phase: active, promoted: 2026-09-06, reason: "ablation: superpower client × bipolar era, coef +0.37, best holdout AUC among mechanisms, survives joint fit while bare client status does not; user hypothesis 'both USA and USSR ran great games'" }, note: "2026-09-07 (operator/derived-polarity): the bipolar half is now derived world state, not the typed years 1947-1991 — derived bipolar 1950-1994 and 2015-, coef +0.67 -> +0.60" }
    sources: ["Powell 2012", "Powell & Thyne 2011", "Gassebner, Gutmann & Voigt 2016"]
    notes: "Powell: military characteristics beat economic ones; wealth and growth 'perform poorly'. Priors reflect that."
    candidates:                                                    # rival explanations for the post-1990 decline; fit-hazards scores each on the holdout
      # operator/presence: a great-power garrison changes what a coup costs. Sign unknown by construction (protection
      # vs provocation), so the priors are 0; the withdrawal term is the package's directional claim. holdout >= 1986.
      # presence_USA / presence_RUS are country-named panel columns and the package names them explicitly. They stay
      # CANDIDATES, never covariates: agent/implementer.md forbids a country name in a fitted template, and the
      # measurement below is the reason there is no reason to break that (the best of the four is +0.004 of AUC).
      # The precedent for the columns existing at all is pact_usa / pact_rus, which are superpower-tie columns too.
      - { id: presence_any, var: presence_any, transform: z, prior: 0, holdout_split: 1986, hypothesis: "max great-power presence level on the actor's territory (data/presence.yaml via src/engine/presence.js); protection or provocation", evidence: "measured 2026-09-07 (operator/presence), NOT promoted. Ablation at the package's split (>= 1986; holdout AUC / Brier / exp-obs, base 0.833 / 0.0202 / 1.01): presence_any 0.827 / 0.0205 / 1.04, fitted -0.09 per sd. A loss on all three." }
      - { id: presence_change, var: presence_change, transform: none, prior: 0.3, holdout_split: 1986, hypothesis: "a withdrawal in the last 3 years: the patron's tripwire is gone and the veto with it", evidence: "measured 2026-09-07 (operator/presence), NOT promoted. presence_change 0.833 / 0.0203 / 1.01 against base 0.833 / 0.0202 / 1.01, fitted +0.26 — the sign the package predicted and no discrimination: the flag is on 4.5% of the coup sample and the coups inside it are not concentrated enough to move a rank statistic. Re-propose against a coup dataset that reaches before 1950, where the colonial withdrawals are." }
      - { id: presence_USA, var: presence_USA, transform: z, prior: 0, holdout_split: 1986, hypothesis: "per-power form of presence_any, as the package names it", evidence: "measured 2026-09-07 (operator/presence), NOT promoted. 0.831 / 0.0203 / 1.02 against base 0.833 / 0.0202 / 1.01, fitted -0.04 per sd." }
      - { id: presence_RUS, var: presence_RUS, transform: z, prior: 0, holdout_split: 1986, hypothesis: "per-power form of presence_any, as the package names it", evidence: "measured 2026-09-07 (operator/presence), NOT promoted. 0.837 / 0.0202 / 1.00 against base 0.833 / 0.0202 / 1.01, fitted -0.40 per sd — the only presence term on this template that gains anything, +0.004 of AUC on 339 events with the Brier unmoved, which is one event changing places. It is also a country-named column and would be the first in a fitted covariate list (agent/implementer.md rule 1 allows it only in data/history/events.yaml); a promotion this thin is not worth that. Re-propose as the generic pair patron-presence / rival-presence if the layer ever gets enough non-superpower stations to identify them." }
      - { id: cold_war, var: cold_war, transform: none, prior: 0, hypothesis: "superpower patronage made coups cheap; the flag is now the derived bipolarity of the world rather than the typed year <= 1991 (era dummy — not identifiable on a temporal holdout)" }
      - { id: sp_client_one, var: sp_client_one, transform: none, prior: 0, hypothesis: "clients of exactly one superpower are the contested ones (retained as a monitored rival; ≈0 in the joint fit)" }
      - { id: anticoup_norm, var: anticoup_norm, transform: none, prior: 0, hypothesis: "regional anti-coup sanctions raise the cost; the flag is now derived (a democratic majority of live states — 2001-2023 — rather than the typed year >= 2000, so it can switch off again and does in 2024)" }
      - { id: year_trend, var: year, transform: z, prior: 0, hypothesis: "null: an unexplained secular trend" }
      - { id: urban_share, var: urban_share, transform: z, prior: 0, hypothesis: "urban mass publics make seizures contestable" }

  - id: democratize_step
    lead: 1                            # label = event in year+1; hazard from this year's state applies to the coming year
    label: Regime category moves up (V-Dem RoW), autocracies at risk
    unit: actor-year
    event: regime_change
    event_filter: { direction: democratize, cause: null }   # cause is stamped by scripts/build-events.mjs from the occupation spans in data/history/events.yaml; a step taken under or immediately after foreign occupation is not a domestic transition
    window: [1900, 2024]
    holdout_split: 2005                # training must include 1992–2004 so conditionality is identified
    sample: { regime_max: 1 }
    covariates:
      - { var: regime, transform: cat, prior: { 0: 0, 1: 0.5 } }
      - { var: log_gdp_pc, transform: z, prior: 0.3 }
      - { var: gdp_growth, transform: z, prior: -0.3 }
      - { var: at_war, transform: lag1, prior: 0.2 }
      - { var: leader_exit_recent, transform: win5, prior: 0.5, default_outside: { window: [1946, 2021], value: 0, source: "leader exits are derived from REIGN (1950+); events.json has none before 1946, so this covariate is an imputed 0 for every pre-1950 actor-year. Imputation, not an observation" } }
      - { var: aid_conditionality, transform: none, prior: 0.5, lifecycle: { phase: active, promoted: 2026-09-06, reason: "user hypothesis (external influence > neighbours): ODA/GNI × 1992–2016 promotion era; holdout≥2005 AUC 0.578→0.641, coef +0.53; largest single gain on any regime template" }, note: "2026-09-07 (operator/derived-polarity): the promotion era is now derived (unipolar under a democratic hegemon — 1946-1948 and 1995-2014), not the typed 1992-2016; coef +0.83 -> +0.68, holdout AUC 0.604 -> 0.593" }
      - { var: pact_usa, transform: none, prior: 0.5, lifecycle: { phase: active, promoted: 2026-09-06, reason: "US clients step up more (+0.59), identified on Cold War variation" } }
      - { var: pact_rus, transform: none, prior: -0.5, lifecycle: { phase: active, promoted: 2026-09-06, reason: "Soviet clients held autocratic (−0.50)" } }
    candidates:
      - { id: patron_regime, var: patron_regime, transform: none, prior: 0, hypothesis: "clients drift toward the patron's regime type (+0.49 alone, ≈0 once pact_* are in)" }
      - { id: hegemon_x_client, var: hegemon_x_client, transform: none, prior: 0, hypothesis: "user: hegemon's clients track the hegemon's regime score — collinear with pact_usa until the US series varies (first variation: 2025 = 2)" }
    rejected:                                                     # tested 2026-09-06 (neighbourhood diffusion); kept so the loop doesn't re-propose them
      - { id: nbr_democracy_share, evidence: "democratize_step holdout≥1990: coef −0.25 (wrong sign), Brier worse; autocratize_step: coef +0.36, AUC 0.74→0.61. Selection effect: surviving autocracies in democratic neighbourhoods are the resilient ones; 2010s backsliding happened inside democratic Europe." }
      - { id: nbr_regime_up_recent, evidence: "≈0 on all targets" }
      - { id: nbr_regime_down_recent, evidence: "+0.14–0.35 in-sample, no holdout gain" }
      - { id: bad_neighbourhood, evidence: "+0.28 on intrastate, +0.35 on autocratization in-sample; holdout AUC unchanged or lower" }
      - { id: nbr_conflict_count, evidence: "≈0" }
    sources: ["Gleditsch & Ward 2006", "V-Dem RoW via OWID"]
    lifecycle: { phase: active, promoted: 2026-09-06, reason: "category-step target beats ERT episodes on holdout: AUC 0.47→0.77; engine uses this for regime dynamics" }

  - id: democratic_deepening
    lead: 1
    label: Electoral democracy deepens to liberal democracy (2→3)
    unit: actor-year
    event: regime_change
    event_filter: { direction: democratize, from: 2, cause: null }
    window: [1900, 2024]
    holdout_split: 2005
    sample: { regime_min: 2, regime_max: 2 }
    covariates:
      - { var: log_gdp_pc, transform: z, prior: 0.5 }
      - { var: gdp_growth, transform: z, prior: 0.2 }
      - { var: at_war, transform: lag1, prior: -0.3 }
      - { var: intrastate, transform: lag1, prior: -0.3, default_outside: { window: [1946, 2024], value: 0, source: "UCDP/PRIO ACD covers 1946-2024; outside it internal conflict is unobserved and imputed 0 so the template is estimable back to its window start. Imputation, not an observation — see docs/refine-log.md" } }
      - { var: aid_conditionality, transform: none, prior: 0.3 }
      - { var: pact_usa, transform: none, prior: 0.3 }
    sources: ["Przeworski et al. 2000 (income and democratic survival/consolidation)"]
    lifecycle: { phase: active, promoted: 2026-09-06, reason: "closes the regime ladder: without it nothing moves an electoral democracy up" }

  - id: liberal_erosion
    lead: 1
    label: Liberal democracy erodes to electoral democracy (3→2)
    unit: actor-year
    event: regime_change
    event_filter: { direction: autocratize, from: 3, cause: null }
    window: [1900, 2024]
    holdout_split: 1990
    sample: { regime_min: 3 }
    covariates:
      - { var: log_gdp_pc, transform: z, prior: -0.3 }
      - { var: gdp_growth, transform: z, prior: -0.3 }
      - { var: at_war, transform: lag1, prior: 0.3 }
      - { var: leader_exit_recent, transform: win5, prior: 0.3, default_outside: { window: [1946, 2021], value: 0, source: "REIGN leader exits start 1950; pre-1946 this is an imputed 0, not an observation" } }
    candidates:
      - { id: info_access, var: info_access, transform: z, prior: 0, hypothesis: "information access raises erosion risk in rich democracies (polarisation channel) — the inverse of its coup effect" }
      - { id: hegemon_x_client, var: hegemon_x_client, transform: none, prior: 0, hypothesis: "user: the hegemon's clients track the hegemon's regime score (cross-sectional form)" }
      - { id: pact_usa, var: pact_usa, transform: none, prior: 0, hypothesis: "US allies track the US" }
      - { id: urban_share, var: urban_share, transform: z, prior: 0, hypothesis: "control" }
    sources: ["Maerz et al. 2024 (ERT)", "V-Dem Democracy Report 2025"]
    lifecycle: { phase: active, promoted: 2026-09-06, reason: "bucket C: 3→2 steps are a European/Anglosphere erosion process distinct from coups" }

  - id: autocratic_closure
    lead: 1
    label: Electoral regime closes (2→1, 2→0, 1→0)
    unit: actor-year
    event: regime_change
    event_filter: { direction: autocratize, cause: null }   # 8 of the 18 closures scored at as-of 1930 were German occupation or Soviet imposition, not domestic closure
    window: [1900, 2024]
    holdout_split: 2005
    sample: { regime_min: 1, regime_max: 2 }
    covariates:
      - { var: regime, transform: cat, prior: { 1: 0, 2: 0.3 } }
      - { var: log_gdp_pc, transform: z, prior: -0.5 }
      - { var: gdp_growth, transform: z, prior: -0.3 }
      - { var: at_war, transform: lag1, prior: 0.3 }
      - { var: intrastate, transform: lag1, prior: 0.4, default_outside: { window: [1946, 2024], value: 0, source: "UCDP/PRIO ACD covers 1946-2024; outside it internal conflict is unobserved and imputed 0 so the template is estimable back to its window start. Imputation, not an observation — see docs/refine-log.md" } }
      - { var: coup_attempt, transform: win5, prior: 0.8, default_outside: { window: [1950, 2021], value: 0, source: "Powell-Thyne coups via REIGN cover 1950+; the panel has zero positive coup_attempt values before 1950, so every pre-1950 actor-year enters this covariate as an imputed 0. Imputation, not an observation: essentially every interwar closure in the label set (1922, 1923, 1926, 1929, 1930, 1934, 1936) was a coup or self-coup. See docs/escalations.md for the pre-1950 coup dataset that would fix it" } }
      - { var: aid_conditionality, transform: none, prior: -0.5, lifecycle: { phase: active, promoted: 2026-09-06, reason: "conditionality deters closure: holdout≥2005 AUC 0.565→0.617, coef −0.61" }, note: "2026-09-07 (operator/derived-polarity): promotion era derived, coef −0.50 -> −0.43, holdout AUC 0.589 -> 0.579" }
      - { var: great_game, transform: none, prior: 0.5, lifecycle: { phase: active, promoted: 2026-09-06, reason: "Cold War superpower clients close more (+0.62, AUC +0.02); bare pact_* ≈0 once this is in" }, note: "2026-09-07 (operator/derived-polarity): bipolarity derived, coef +0.43 -> +0.29" }
    candidates:
      # operator/presence, scored at the package's holdout (>= 1986); the whole ablation including `base` is rescored
      # at that split, so the variants stay comparable — see scripts/lib/fit.mjs.
      - { id: presence_any, var: presence_any, transform: z, prior: 0, holdout_split: 1986, hypothesis: "a great-power garrison either underwrites the incumbent's closure or deters it", evidence: "measured 2026-09-07 (operator/presence), NOT promoted. Ablation at the package's split (>= 1986; the whole ablation including base is rescored there, so the numbers are not the template's own 2005 holdout). Base 0.592 / 0.0310 / 1.14: presence_any 0.591 / 0.0310 / 1.14 fitted -0.00, presence_change 0.591 / 0.0311 / 1.14 fitted +0.07, presence_USA 0.592 / 0.0310 / 1.14 fitted -0.03, presence_RUS 0.592 / 0.0310 / 1.15 fitted +0.03. Four terms, four zeros: closure is not a garrison story on this sample." }
      - { id: presence_change, var: presence_change, transform: none, prior: 0.3, holdout_split: 1986, hypothesis: "closure follows the patron's withdrawal", evidence: "measured 2026-09-07 (operator/presence), NOT promoted. numbers on the presence_any entry above (one ablation covers all four)." }
      - { id: presence_USA, var: presence_USA, transform: z, prior: 0, holdout_split: 1986, hypothesis: "per-power form, as the package names it", evidence: "measured 2026-09-07 (operator/presence), NOT promoted. numbers on the presence_any entry above." }
      - { id: presence_RUS, var: presence_RUS, transform: z, prior: 0, holdout_split: 1986, hypothesis: "per-power form, as the package names it", evidence: "measured 2026-09-07 (operator/presence), NOT promoted. numbers on the presence_any entry above." }
      - { id: patron_regime, var: patron_regime, transform: none, prior: 0, hypothesis: "patron's regime type" }
      - { id: hegemon_x_client, var: hegemon_x_client, transform: none, prior: 0, hypothesis: "hegemon's clients track the hegemon (untestable until the US series varies)" }
    sources: ["Goldstone et al. 2010", "Powell 2012", "Levitsky & Way 2010"]
    lifecycle: { phase: active, promoted: 2026-09-06, reason: "bucket C: closures are coup/conflict-adjacent, poor, low-information" }

  - id: intrastate_onset
    label: New internal armed-conflict episode (UCDP, ≥25 battle deaths)
    unit: actor-year
    event: intrastate_onset
    window: [1946, 2024]
    covariates:
      - { var: regime, transform: cat, prior: { 0: 0, 1: 0.7, 2: 0.4, 3: -1.0 } }   # PITF: partial democracy ~30x full autocracy
      - { var: log_gdp_pc, transform: z, prior: -0.6 }
      - { var: gdp_growth, transform: z, prior: -0.2 }
      - { var: intrastate, transform: win5, prior: 1.2 }          # conflict trap
      - { var: population, transform: log, prior: 0.3 }
      - { var: at_war, transform: lag1, prior: 0.3 }
    missing: [bad_neighbourhood, state_discrimination]   # PITF's other variables — add when fetched
    candidates:
      - { id: infant_mortality, var: infant_mortality, transform: log, prior: 0.5, hypothesis: "PITF: 75th vs 25th percentile = 7x the odds" }
      - { id: presence_any, var: presence_any, transform: z, prior: -0.2, hypothesis: "operator/presence: a great-power garrison raises the cost of starting an insurgency (prior negative)", evidence: "measured 2026-09-07 (operator/presence), NOT promoted. Holdout >= 1985 (the template's own split), AUC / Brier / exp-obs, base 0.813 / 0.0419 / 0.74: presence_any 0.807 / 0.0419 / 0.74 fitted -0.06 per sd (right sign, no discrimination), presence_change 0.812 / 0.0419 / 0.73 fitted +0.49 (right sign, no discrimination). The prior said -0.2 and the data says -0.06." }
      - { id: presence_change, var: presence_change, transform: none, prior: 0.3, hypothesis: "operator/presence: onsets follow the garrison out", evidence: "measured 2026-09-07 (operator/presence), NOT promoted. numbers on the presence_any entry above." }
    sources: ["Goldstone et al. 2010 (PITF)", "Hegre et al. 2019 (ViEWS)", "Fearon & Laitin 2003"]

  - id: mid_force
    label: Dyadic militarized dispute with use of force
    unit: dyad-year
    event: mid_force
    window: [1816, 2001]
    covariates:
      - { var: contiguous, transform: none, prior: 1.5 }           # Bremer's #1 predictor; from CShapes borders (1886+)
      - { var: allied, transform: none, prior: -0.6 }              # any defence pact between the pair
      - { var: joint_democracy, transform: none, prior: -0.8 }     # both regime >= 2
      - { var: cap_ratio, transform: log, prior: -0.3 }            # cinc_max / cinc_min: preponderance pacifies
      - { var: major_power_any, transform: none, prior: 0.8 }
      - { var: rivalry, transform: z, prior: 0.26, decay: 0.85, lifecycle: { phase: active, promoted: 2026-09-07, reason: "replaces win5(mid_force), the binary five-year recurrence flag, with an exponentially decaying rivalry trace: delta^(years since the pair's last militarized dispute), 0 for a pair that has never had one, delta = 0.85. Built once in src/engine/core.js (rivalryScore) and imported by scripts/lib/fit.mjs so the fit and the engine cannot drift apart. Prior: the literature's binary prior for a fresh dispute (1.5 log-odds) divided by the z-score a fresh dispute takes on the fitting sample (5.80 sd; rivalry mean 0.038, sd 0.140, nonzero on 22.7% of dyad-years) = 0.26. The posterior barely feels it (prior 0.10 to 0.80 moves the fitted coefficient by under 0.01 on the full sample, 0.04 at as-of 1900). Ablation over delta in 1.0 / 0.85 / 0.75 / 0.6: one-year holdout AUC (>=1946) 0.8475 / 0.8613 / 0.8582 / 0.8531 against 0.8586 for win5, and backtest 1870-2010 +20y 100 runs all states, pooled mid_force exp/obs and Brier skill 1.00 and -0.013 / 0.84 and +0.069 / 0.86 and +0.059 / 0.88 and +0.049, against 0.95 and +0.026 for win5. delta = 0.85 chosen; delta = 1.0, the no-decay endpoint, is worse than the binary flag it would replace. Fitted +0.40 per sd, where win5 fitted +1.81 - the trace is not weaker, it is shorter: a dispute one year old is 2.3 log-odds against win5's 1.81, and five years old 1.15 against the same 1.81." } }
      - { var: at_war_any, transform: lag1, prior: 0.5 }
    candidates:
      - { id: patron_presence, var: patron_presence, transform: none, prior: -0.3, holdout_split: 1946, hypothesis: "operator/presence: one side hosts a great-power station of level >= 2 belonging to a power allied to it and not to the other — tripwire deterrence. Built by src/engine/presence.js and read by scripts/lib/fit.mjs's dyad block and the engine's from the same code", evidence: "measured 2026-09-07 (operator/presence), NOT promoted. Holdout >= 1946, AUC / Brier / exp-obs. mid_force base 0.861 / 0.0099 / 0.95 -> 0.852 / 0.0100 / 1.10, fitted -0.17 (the predicted sign, and worse on all three). mid_war base 0.802 / 0.0013 / 3.22 -> 0.809 / 0.0013 / 3.50, fitted +0.20 — the WRONG sign against a prior of -0.3, and the +0.007 of AUC comes with an exp/obs already at 3.2 getting worse. Diagnosis: patron_presence is on 18% of politically relevant dyad-years and is close to collinear with `allied` and `major_power_any`, both already fitted; what is left of it is a marker for the Cold War blocs, where disputes are frequent. Re-propose as a directed term (the garrison is on ONE side) once the dyad sample is directed, or with the patron's own capability in it." }
      - { id: patron_presence_rival, var: patron_presence_rival, transform: none, prior: 0.3, holdout_split: 1946, hypothesis: "operator/presence, the second form the package asks to test: the same station, but the dispute is with a great power — a garrison is a tripwire against the patron's peers, not a general pacifier", evidence: "measured 2026-09-07 (operator/presence), NOT promoted. Holdout >= 1946. mid_force base 0.861 / 0.0099 / 0.95 -> 0.859 / 0.0099 / 0.99, fitted +0.42; mid_war base 0.802 / 0.0013 / 3.22 -> 0.800 / 0.0013 / 3.33, fitted +0.54. The sign the package predicted for this form, on both templates, and no AUC on either — the calibration on mid_force improves (0.95 -> 0.99) and that is the whole of it. This is the presence term most worth re-proposing when the dyad sample is directed." }
      - { id: corridor_stake, var: corridor_stake, transform: z, prior: -0.3, hypothesis: "the corridor dampener docs/schema.md specifies (era-1914-1945/corridors-7): log1p of the load-bearing weight that third parties carry on infrastructure running through either side of the pair, counted only where the third party holds a defence pact with one of the two. Built once in src/engine/core.js (corridorIndex / corridorStake) and read by scripts/lib/fit.mjs and the engine's dyad block from the same code. Prior negative: a pair whose shared infrastructure is load-bearing for someone's ally is a pair someone leans on not to fight", evidence: "measured 2026-09-07, NOT promoted: the sign is right and the size is nothing. One-year holdout ablation (>=1946): mid_force AUC 0.861 -> 0.861, Brier 0.0099 -> 0.0099, fitted -0.04; mid_war (>=1939) AUC 0.848 -> 0.850, Brier 0.0031 -> 0.0031, exp/obs 0.91 -> 0.87, fitted -0.13. Backtest off -> on (CORRIDOR_DAMPENER=1, 100 runs, all states): 1910-1940 mid_force Brier 0.03985 -> 0.03994 and mid_war 0.02902 -> 0.02918; 1950-2000 mid_force 0.00666 -> 0.00670 and mid_war 0.00205 -> 0.00211. The test asked for an improvement in both windows and got a small loss in all four. Diagnosis: the term is zero for almost every pair-year, because a defence-pact tie between a corridor's dependent third party and one of the two states it runs through is rare in the pre-1946 alliance graph, which is where the corridor records are. Re-propose with the stake weighted by something denser than a defence pact (trade share, or the load_bearing_for value itself without the alliance gate), or once the record layer covers the post-1945 alliance blocs." }
    rejected:                                                     # tested 2026-09-07 (era-1870-1914/statistics-6)
      - { id: pre_1946, evidence: "A derived era constant (year < 1946) on the dispute template earns nothing. Ablation at holdout_split 1975 (1946 and every earlier split leave the dummy with no within-training variation, so the test is empty there): holdout AUC 0.900 -> 0.900, holdout Brier 0.0081 -> 0.0081, holdout exp/obs 1.14 -> 1.12, fitted +0.14. The 5x era swing the package was written about is in wars, not disputes: the base dispute model is already calibrated out of sample. Promoted on mid_war instead, where the same ablation gives 0.838 -> 0.841 and exp/obs 3.68 -> 2.10 at +1.17. Post-1945 mid_force still improves in the backtest (pooled 1950-2000 exp/obs 1.32 -> 1.17), through the at_war feedback from the war template and not through a term of its own." }
    sources: ["Bremer 1992", "Oneal & Russett 1999", "Jones, Bremer & Singer 1996"]
    notes: "Dyad sample: politically relevant dyads (contiguous or ≥1 major power), all states, 1886–2001. The declared window is [1816, 2001] but the estimation sample starts at 1886: CShapes 2.0 has no polygons before it, and fit-hazards drops dyad-years with no contiguity value, so 134 mid_force and 106 mid_war events dated 1816–1885 are outside the fit (CoW Direct Contiguity 3.2 would fix it — deferred, see docs/refine-log.md). The engine freezes the border graph at as-of and, for an as-of before 1886, uses the 1886 snapshot as a documented stand-in. Corridor dampener and chokepoint stakes enter as extra dyad covariates once corridors carry historical status. Dyad labels are per-pair from 2026-09-06: hostility = min(hostlev_a, hostlev_b), onset = max(styear_a, styear_b), and mid_war nests inside mid_force. CoW Dyadic MID 3.1 / Maoz MIDdyadic, which ships real dyad-years instead of the coalition cross-product, is the substitution this approximates — see docs/escalations.md."

  - id: mid_war
    label: Dyadic war (hostility level 5)
    unit: dyad-year
    event: mid_war
    window: [1816, 2001]
    holdout_split: 1939                # the second world war must be forecast out of sample
    covariates:
      - { var: contiguous, transform: none, prior: 1.5 }
      - { var: allied, transform: none, prior: -0.5 }
      - { var: joint_democracy, transform: none, prior: -1.0 }
      - { var: cap_ratio, transform: log, prior: -0.4 }
      - { var: major_power_any, transform: none, prior: 1.0 }
      - { var: rivalry, transform: z, prior: 0.35, decay: 0.85, lifecycle: { phase: active, promoted: 2026-09-07, reason: "replaces win5(mid_force), the binary five-year recurrence flag, with an exponentially decaying rivalry trace: delta^(years since the pair's last militarized dispute), 0 for a pair that has never had one, delta = 0.85. Built once in src/engine/core.js (rivalryScore) and imported by scripts/lib/fit.mjs so the fit and the engine cannot drift apart. Prior: the literature's binary prior for a fresh dispute (2.0 log-odds) divided by the z-score a fresh dispute takes on the fitting sample (5.80 sd; rivalry mean 0.038, sd 0.140, nonzero on 22.7% of dyad-years) = 0.35. The posterior barely feels it (prior 0.10 to 0.80 moves the fitted coefficient by under 0.01 on the full sample, 0.04 at as-of 1900). Ablation over delta in 1.0 / 0.85 / 0.75 / 0.6: one-year holdout AUC (>=1939) 0.8447 / 0.8482 / 0.8477 / 0.8466 against 0.8498 for win5, and backtest 1870-2010 +20y 100 runs all states, pooled mid_war exp/obs and Brier skill 1.13 and -0.079 / 1.03 and -0.035 / 1.04 and -0.038 / 1.04 and -0.041, against 1.10 and -0.056 for win5. delta = 0.85 chosen; delta = 1.0, the no-decay endpoint, is worse than the binary flag it would replace. Fitted +0.15 per sd, where win5 fitted +0.79." } }
      - { var: nuclear_both, transform: none, prior: -1.5 }        # after 1945; the nuclear ceiling
      - { var: pre_1946, transform: none, prior: 0, source: "derived dyad-year constant (year < 1946), computed in scripts/lib/fit.mjs's dyad feature block and src/engine/core.js:dyadHazards; no panel column", lifecycle: { phase: active, promoted: 2026-09-07, reason: "era-1870-1914/statistics-6. Scored by the loop's own ablation with holdout_split 1975 — 1946 and every earlier split leave the dummy with no within-training variation, so the coefficient cannot leave its prior and the test is empty. At 1975: holdout AUC 0.838 -> 0.841 and holdout exp/obs 3.68 -> 2.10, fitted +1.17. Per-era, per-dyad-type in-sample calibration (exp/obs, contiguous-only / major-only / both, base -> with the term) 1886-1914 0.37 / 1.07 / 0.84 -> 0.71 / 1.64 / 1.20, 1915-1945 0.77 / 0.59 / 0.78 -> 1.38 / 0.82 / 0.98, 1946-2001 1.38 / 2.37 / 2.66 -> 0.88 / 1.17 / 1.25: the test asked for 1886-1914 contiguous-only above 0.6 (0.37 -> 0.71) and 1946-2001 major-only below 1.6 (2.37 -> 1.17), and both hold. Under the rolling-origin refit the term is identified only where a forecaster holds both eras: at as-of 1940 and earlier the training sample is all pre-1946 and the coefficient stays at its prior, so the pre-war rows are unchanged and the whole effect is post-1946. Rejected on mid_force, where it earns nothing (numbers under rejected: there)." } }
      - { var: at_war_any, transform: lag1, prior: 0.9, lifecycle: { phase: active, promoted: 2026-09-06, reason: "the feature was already computed in both scripts/fit-hazards.mjs and src/engine/core.js and used only by mid_force. Measured on the politically relevant dyad-years: P(war | either side at war last year) 0.99% vs 0.39% otherwise, log-OR +0.93. Ablation on the corrected dyad labels: holdout(>=1939) AUC 0.757 -> 0.850, in-sample 0.793 -> 0.872; backtest 1910-1940 exp/obs 0.28 -> 0.44 and skill 0.08 -> 0.12. Cost, recorded: it amplifies in simulation, because the engine has no war duration and redraws every year — backtest 1950-2000 exp/obs 1.66 -> 2.62 (the label change alone takes it from 1.15 to 1.66). Kept; the damping fix is a war-duration state, escalated as era-1914-1945/engine/5." } }
    candidates:
      - { id: patron_presence, var: patron_presence, transform: none, prior: -0.3, holdout_split: 1946, hypothesis: "operator/presence; same construction as on mid_force", evidence: "measured 2026-09-07 (operator/presence), NOT promoted. numbers on the mid_force candidate entry (one measurement covers both templates)." }
      - { id: patron_presence_rival, var: patron_presence_rival, transform: none, prior: 0.3, holdout_split: 1946, hypothesis: "operator/presence; same construction as on mid_force", evidence: "measured 2026-09-07 (operator/presence), NOT promoted. numbers on the mid_force candidate entry." }
      - { id: corridor_stake, var: corridor_stake, transform: z, prior: -0.3, hypothesis: "the corridor dampener docs/schema.md specifies (era-1914-1945/corridors-7); same construction as on mid_force", evidence: "measured 2026-09-07, NOT promoted; the numbers are on the mid_force candidate entry (one measurement covers both templates: the ablation and the backtest switch turn the term on for every template that declares it)" }
    coalition:                         # a war is between sides, not states (era-1914-1945/engine-1)
      status: candidate                # built, measured 2026-09-07, NOT promoted — the numbers are under rejected: below
      p_join: 0.094                    # per defence-pact ally of each side, per war onset
      source: "calibrated from the sides: lists in data/history/events.yaml (the one place country names are allowed, per agent/fixer.md), against CoW alliance v3.03 defence pacts (sstype 1) in the war's start year. For each of the 44 hand-coded wars take the pair that starts it (the earliest entrant on each side by the entries: map, the listed order otherwise), count every live state holding a defence pact with either of the two in that year, and count how many of those are in the war's sides: list. 297 allies at risk, 28 joiners, p = 0.0943. Reproduce with node scripts/coalition-calib.mjs, which prints the per-war rate and the per-dyadic-war-year rate side by side. Per war: ww2 9/12, ww1 5/5, gulf_1991 5/66, six_day 2/12, yom_kippur 1/16, balkan_1 1/1, balkan_2 1/1, austro_prussian 1/11, nomonhan 1/13, iran_1941 1/5, vietnam 1/38, and 0 of 43 (falklands), 0 of 16 (iran_iraq), 0 of 13 (winter_war), 0 of 11 (changkufeng), 0 of 7 (suez_1956), 0 of 5 (franco_prussian, italo_ethiopian, anglo_iraqi_1941 4), 0 of 3, 0 of 2, 0 of 1 elsewhere. One p across all eras: the post-1945 blocs are large and almost never join (gulf 5 of 66, falklands 0 of 43, vietnam 1 of 38), which is what holds the pooled rate down to 9% and is the reason the same rule does not have to fire in the wrong era."
      relevance: linked                # ... and the relevance set that implies, evaluated at the simulated year:
                                       # linked = at war with each other or with a state allied to the other;
                                       # both_at_war = the same, and both sides already in a war; false = off
                                       # Switches (node only, stamped into the backtest's meta and filename):
                                       # COALITION_ON=1 runs this candidate without editing the data, COALITION_P_JOIN=<p>
                                       # and COALITION_RELEVANCE=<mode> override the two fields (p_join 0 = relevance only),
                                       # ENGINE_ABLATE=coalition / coalition_relevance force it (or its second half) off.
    duration:                          # interstate war as a spell, not a one-year flag (era-1914-1945/engine-5)
      status: candidate                # built, measured 2026-09-07, NOT promoted — the numbers are under rejected: below
      draw: empirical                  # a fired war holds at_war on both belligerents for a length resampled from...
      source: "data/panel.json at_war run lengths as observed at the as-of year (data/history/events.yaml hand-coded interstate wars, per-participant entry/exit): 139 completed spells 1816–2025, mean 3.0 years, 49% of them one year. Set status: active to reproduce the measured run; src/engine/core.js reads this field and ENGINE_ABLATE=war_duration forces it off."
    rejected:                          # tested 2026-09-07 (era-1914-1945/engine-5, engine-1); kept so the loop does not re-propose them unchanged
      - { id: coalition_join, evidence: "Coalition joining (p_join per defence-pact ally of each side, calibrated at 0.094 on the sides: lists) plus the war-linked relevance set fixes the pre-war half of its test and fails its post-war guard by 7x. Backtest 1910-1940 +20y 100 runs all states, off -> on: mid_war n_structural_miss 81 -> 70 at as-of 1930 and 87 -> 54 at as-of 1940 (the test asked for below 20), auc_at_risk 0.729 -> 0.78 and 0.776 -> 0.82, pooled exp/obs 0.39 -> 0.60 and skill 0.092 -> 0.13; mid_force miss 105 -> 93 and 128 -> 88, pooled 0.50 -> 0.64 and 0.122 -> 0.15. Guard, 1950-2000: mid_war exp/obs 2.61 -> 28.00 and mid_force 1.17 -> 6.39. The relevance half alone (COALITION_P_JOIN=0) does not rescue it: it carries most of the structural gain (mid_war miss 81 -> 77 at 1930 and 87 -> 57 at 1940, mid_force 105 -> 96 and 128 -> 96, pooled 0.45 and 0.54) and still takes the guard to 4.85 / 1.69, while as-of 1940 auc_at_risk falls 0.776 -> 0.704, below the guard's 0.74 - the pairs it opens are mostly ones that never fight, and each of them carries lag1(at_war_any) = +1.92 because a war is what opened it. The two halves amplify separately (1950-1980, 20 runs, mid_war exp/obs 3.10 with the mechanism off): joining alone 12.96, joining at p=0.005 with the relevance set on 6.78, both at the calibrated p 33.58. p_join sweep with relevance off: 0.094 -> 12.96, 0.046 -> 7.36, 0.0145 -> 4.19, 0.005 -> 3.42; with the tighter both_at_war relevance, 0.094 -> 17.10 and 0.0145 -> 4.26. Every run above is reproducible with COALITION_ON=1 [COALITION_P_JOIN=<p>] [COALITION_RELEVANCE=both_at_war] [ENGINE_ABLATE=coalition_relevance] on scripts/backtest.mjs, which writes each ablation to its own scores/...-abl-<switches>.json. No setting of p_join is neutral post-1945. Diagnosis, measured: p_join is a per-war rate applied per dyadic war-year draw, and the engine fires 2.6x too many of those post-1945 into blocs an order of magnitude larger than the historical at-risk set of 3.91 allies per dyadic war-year (2.13 of them still out of the war) (1,016 dyadic war-years, 3,973 ally-draws counting every ally of the pair - the engine's own denominator - or 2,160 counting only the allies still out of the war, against 28 joiners: 0.0070 to 0.0130 per draw, against 0.094 per ally per war; node scripts/coalition-calib.mjs). The relevance half amplifies for a second reason: it admits a pair *because* one side is at war, so every pair it admits carries lag1(at_war_any) = +1.92. On the observed record the rule is small — 854 extra dyad-years 1886-2001 (69,099 -> 69,953), 397 of them pre-1946 carrying 29 wars (7.3%) and 457 post-1946 carrying 4 (0.9%), so the fit does see that the post-war ones are cold — but in simulation at as-of 1970 it opens about 5,000 extra at-risk pairs (mid_war n_at_risk 749 -> 5,186, mid_force 816 -> 5,297), because every one of the engine's too-many wars opens its belligerents' whole alliance neighbourhood. Re-propose against a war process that is calibrated post-1945, with p_join calibrated per dyadic war-year (0.0070 to 0.0130) rather than per war, or with the joining draw made once per war component per year rather than once per fired dyad." }
      - { id: war_duration, evidence: "Holding at_war on both belligerents for a drawn duration fixes the spell shape and fails on every calibration number. Spell shape, as-of 1920, 100 runs (node scripts/analysis/war-spells.mjs --as-of 1920): one-year spells 70% -> 24% and mean length 1.51 -> 3.91 years, against the panel's 49% / 2.99 over all years and 26% / 2.91 for the spells a forecaster at 1920 has seen. Calibration, backtest 1870-2010 +20y 100 runs all states: pooled mid_war exp/obs 1.03 -> 1.50 and Brier skill -0.035 -> -0.176, mid_force 0.84 -> 1.08 and +0.069 -> 0.000, AUC unchanged at 0.77; 1950-2000 mid_war 3.89 -> 5.58 (the test asked for below 1.5) and mid_force 1.32 -> 1.65; 1910-1940, where the model under-predicts, it helps: mid_war 0.39 -> 0.60 and mid_force 0.50 -> 0.69, skill 0.092 -> 0.090 and 0.122 -> 0.109. Diagnosis, measured: the amplification is not repeated draws inside the same dyad (those are suppressed) but lag1(at_war_any) = +2.13 reaching the belligerents' other dyads, so a longer spell is a longer exposure and the simulated war count at as-of 1920 doubles, 5,610 -> 10,352. The two at_war variables are also not the same population: the panel's at_war is the hand-coded interstate-war list (371 actor-years 1886-2001, 3.3% of live actor-years) while the engine sets at_war from any CoW hostility-5 dyad, whose onsets are 283 actor-years - 1.31 at-war years per onset year, not the 2.6-3.0 of a whole spell, because about half the dyadic onsets happen inside a war that is already running. Re-propose with the era term (era-1870-1914/statistics-6) or the coalition rule (era-1914-1945/engine-1) in place, or with the duration drawn per dyad from CoW MID endyear (396 dyadic war spells, mean 2.61, 38% of one year) and calibrated on simulated at-war exposure rather than on spell length." }
    sources: ["Bremer 1992", "Bueno de Mesquita & Lalman 1992"]
    notes: "mid_war nests inside mid_force: CoW hostlev is ordinal and the dyad's hostility is min(hostlev_a, hostlev_b), so a hostlev-5 pair is also a use-of-force pair. Before 2026-09-06 the two were disjoint (dispute-level max), which made observed mid_war exceed observed mid_force at as-of 1930. The engine nests the draw the same way from 2026-09-07 (era-1870-1914/engine-7): it draws mid_force first and the war only inside it, at P(war | dispute) = hz.mid_war / max(hz.mid_force, hz.mid_war) — the derived form, not a refit on the mid_force-positive subsample, which is the form these coefficients are therefore read with. The marginal is unchanged wherever p_war <= p_force and capped at the dispute's own probability where the war model runs hotter, which is where lag1(at_war_any) = +2.13 has switched on. Verified: 5,610 simulated wars at as-of 1920 over 100 runs, none in a dyad-year without a dispute (node scripts/analysis/war-spells.mjs). ENGINE_ABLATE=war_nesting restores the independent draws."
    lifecycle: { phase: active, reason: "dyad labels re-derived per pair 2026-09-06: hostility = min of the pair, onset = max of the pair. The dispute-level version stamped CoW dispnum 258 (WWII) as 223 dyadic wars all dated 1939, Spain-China among them" }

  - id: weaponization
    label: Nuclear latency to weapon
    unit: actor-year
    event: nuclear
    event_filter: { status: weapon }
    window: [1945, 2026]
    sample: latent_only                                            # only actor-years with latent capability
    covariates:
      - { var: mid_force, transform: win5, prior: 0.8 }            # security threat
      - { var: nuclear_ally, transform: none, prior: -1.2 }        # defence pact with a nuclear state substitutes
      - { var: log_gdp_pc, transform: z, prior: 0.3 }
      - { var: regime, transform: cat, prior: { 0: 0.3, 1: 0.2, 2: 0, 3: -0.3 } }
      - { var: struck_program, transform: win5, prior: 0.5 }       # Osirak/Al Kibar/2025: ambiguous sign — the whole Iran argument
    sources: ["Jo & Gartzke 2007", "Singh & Way 2004", "Fuhrmann & Tkach 2015"]
    notes: "n ≈ 10 weaponizations over ~600 latent actor-years. Fit is a prior update, not a regression; report the posterior rate with its interval."

  - id: chokepoint_status
    label: Chokepoint status or control transition
    unit: chokepoint-year
    event: chokepoint
    window: [1869, 2026]
    states: [open, contested, closed]
    covariates:
      - { var: adjacent_war, transform: none, prior: 2.5 }         # a transit state (or the controller) at war this year
      - { var: adjacent_intrastate, transform: none, prior: 1.0, default_outside: { window: [1946, 2026], value: 0, source: "UCDP/PRIO ACD covers 1946+; the panel has no intrastate column at all before it, so every pre-1946 record-year enters this covariate as an imputed 0. Imputation, not an observation" } }
      - { var: guarantor_withdrawal, transform: none, prior: 0.5, default_outside: { window: [1870, 2026], value: 0, source: "data/presence.yaml claims coverage 1870-2026 (its own header); the 1869 record-years take a declared structural zero rather than dropping the row" }, lifecycle: { phase: active, promoted: 2026-09-07, reason: "operator/presence. The guarantor's weight around the record fell inside the last 3 years — a great power removing forces from a strait's neighbourhood. Built once in src/engine/presence.js (guarantorLevels / guarantorFall) and read by scripts/lib/fit.mjs and src/engine/core.js through corridorFeatures from the same code, so the fit and the simulation are one construction. Ablation at five splits (holdout AUC / Brier, base -> with the term), chokepoint_status: 1940 0.692/0.0278 -> 0.660/0.0278, 1946 0.580/0.0212 -> 0.621/0.0214, 1960 0.572/0.0146 -> 0.597/0.0148, 1970 (the split the package asks for) 0.501/0.0148 -> 0.624/0.0151, 1980 0.742/0.0143 -> 0.714/0.0145; corridor_status: 1940 0.832/0.0078 -> 0.852/0.0078, 1946 0.683/0.0034 -> 0.774/0.0035 (the >= 1970 holdout the package asks for is EMPTY on corridors — 2 of the 37 transitions are after 1970 and fit.mjs reports `insufficient events`). Promoted on the AUC at the package's own splits and on the falsifiers, against a Brier that is flat to 0.0003 worse at every split: the term discriminates and does not calibrate, and the base model already over-predicts (holdout exp/obs 2.22 on chokepoints). It loses AUC at two of the five chokepoint splits (1940 and 1980) and that is recorded here rather than dropped. Falsifiers, node scripts/analysis/presence.mjs: the canal 1956 fires (guarantor weight 10 -> 7 in the transition year, where the MAXIMUM level does not move at all because a fleet 1,400 km away is still there — which is why the term is a per-power sum of station levels and not the package's stated max); the 1967 and 1971-73 withdrawals fire; the 2026 state fires on the Gulf record. What the backtest cannot see: the scoreable window for these templates is 1869-1945 (COVERAGE in scripts/backtest.mjs) and the term is on 26 of 620 pre-1946 chokepoint-years carrying 2 of 29 transitions and 105 of 1,114 pre-1946 corridor-years carrying 9 of 31, against 179 of 720 and 5 of 10 after 1945, so the pooled 1870-2010 backtest moves by +0.005 of skill on chokepoint_status and -0.004 on corridor_status and by stream noise elsewhere. (Checked 2026-09-07: these replace the 12 of ~480 with 0 transitions first written here, which were the 1900-1939 rows only and understated the term's reach into the scored window; the correct counts are the ones in the commit message, docs/escalations.md and docs/refine-log.md, and they are reproduced by scripts/analysis/presence.mjs section 3.) This promotion rests on the one-year holdout and the falsifiers, not on the rolling-origin score. Checked 2026-09-07: the construction the package's own text specifies - a per-power MAX station level instead of the sum - was re-measured at the same splits and is BETTER on the holdout, chokepoint 1940 0.717/0.0283, 1946 0.612/0.0213, 1960 0.614/0.0146, 1970 0.655/0.0149, 1980 0.735/0.0144 and corridor 1940 0.859/0.0077, 1946 0.802/0.0033, which is a gain at 6 of the 7 measurable splits on AUC and at 6 of 7 on Brier, fitted +0.49 and +0.96. It is not adopted because under it neither of the package's named checks fires at all: Suez 1956 stays at guarantor 3 with withdrawal 0 (the Mediterranean fleet 1,400 km away holds the maximum up while the garrison on the record's own transit state leaves) and the 2026 Gulf direction check stays at 0. The sum is chosen on the mechanism and the falsifiers against a holdout that prefers the max, and that trade is the record rather than a claim that the sum measured better." } }
    # nonstate_littoral: a Houthi-type armed actor on the shore (prior 1.5) — no panel column and no dated source; 2023-26 Bab al-Mandab is the case it exists for.
    candidates:                      # operator/presence, holdout >= 1970 as the package asks
      - { id: guarantor_presence, var: guarantor_presence, transform: z, prior: -0.5, holdout_split: 1970, default_outside: { window: [1870, 2026], value: 0, source: "data/presence.yaml claims coverage 1870-2026 (its own header); the 1869 record-years take a declared structural zero rather than dropping" }, hypothesis: "the weight of the strongest great-power guarantor within 1,500 km of the record or on one of its transit states (src/engine/presence.js). A guarded strait closes less often", evidence: "measured 2026-09-07 (operator/presence), NOT promoted: the guarantor's own weight adds nothing and its sign flips. Ablation at five splits (holdout AUC / Brier, base -> with the term): 1940 0.692/0.0278 -> 0.686/0.0280, 1946 0.580/0.0212 -> 0.560/0.0222, 1960 0.572/0.0146 -> 0.541/0.0149, 1970 0.501/0.0148 -> 0.477/0.0150, 1980 0.742/0.0143 -> 0.581/0.0146; fitted +0.07 per sd on chokepoint_status and -0.05 on corridor_status against a prior of -0.5 (checked 2026-09-07; the +0.30 first written here does not reproduce on either template). Diagnosis: 81 of the 90 chokepoint-years of the 1940s-1960s are guarded, so the level is nearly a constant, and what variance it has is cross-sectional between records rather than within one. The withdrawal term below carries the mechanism; the level does not. Re-propose relative to the record's own history (a guarantor weight z-scored within the record) rather than across the layer. These numbers are scored against a base WITHOUT guarantor_withdrawal, which is what the base was when they were measured; scripts/analysis/presence.mjs section 4 now prints the same ablation against the promoted base (chokepoint 1940 0.660 -> 0.688, 1946 0.621 -> 0.564, 1960 0.597 -> 0.559, 1970 0.624 -> 0.515, 1980 0.714 -> 0.612), which is the same verdict from a different starting point (checked 2026-09-07)." }
    missing: [nonstate_littoral]
    sources: ["hand records: data/corridors.yaml dated history, 9 chokepoint records 1869-2026"]
    notes: "Unit: one row per record per year, built by scripts/lib/fit.mjs:buildRecordRows from data/corridors.yaml. A record enters the sample in the year its dated history opens, EXCEPT where that first row is already an impairment (closed/contested), which is only observable if the thing existed unimpaired before — a strait is not built, so those records run from the window's first year at the kind's base status (open). Label: the record's status OR controller changed during the year. Control is half of what the layer is for (Suez 1882 and 1956 are control changes at constant status) and a change that reverses inside the year is still a transition in it. Covariates are contemporaneous, and the engine draws this layer last in the step, after the war draws, so the at_war a transit state acquires this year is visible on both sides. Transit states are dated: a transit that is not a live actor is followed through the successor chain and the controller counts as a transit, which is what keeps Suez scorable 1883-1921 (EGY out of the system under occupation, held by GBR) and Berlin-Baghdad scorable after 1922 (OTTOMAN -> TUR)."

  - id: corridor_status
    label: Corridor status or control transition (advance, cut, or change of hands)
    unit: corridor-year
    event: corridor
    window: [1869, 2026]
    covariates:
      - { var: transit_at_war_any, transform: none, prior: 1.5, source: "prior restated 2026-09-07 with the label (era-1914-1945/corridors-7): it was -2.0 for 'a corridor does not advance while a transit state is at war', but the fitted label is any status or control transition, and war is the modal cause of one — a corridor is cut, captured, or completed under military priority. Magnitude below the chokepoint template's 2.5: a land corridor has more of its length away from the front" }
      - { var: sponsor_great_power, transform: none, prior: 0.8 }  # sponsor, or the controller where no sponsor is declared
      - { var: guarantor_withdrawal, transform: none, prior: 0.5, default_outside: { window: [1870, 2026], value: 0, source: "as on chokepoint_status" }, lifecycle: { phase: active, promoted: 2026-09-07, reason: "operator/presence; the same construction and the same promotion as on chokepoint_status, where the full evidence block lives. On this template the ablation gives holdout AUC 0.832 -> 0.852 at split 1940 and 0.683 -> 0.774 at 1946, Brier 0.0078 -> 0.0078 and 0.0034 -> 0.0035; the >= 1970 holdout the package asks for is empty (2 of 37 transitions)." } }
    candidates:                      # operator/presence, same construction as on chokepoint_status. The package asks
                                     # for a holdout >= 1970; the corridor record layer has 2 transitions after 1970
                                     # and the test is empty there (fit.mjs reports `insufficient events`), so these
                                     # are scored at the template's own 1946 split, which holds 6 of the 37.
      - { id: guarantor_presence, var: guarantor_presence, transform: z, prior: -0.5, default_outside: { window: [1870, 2026], value: 0, source: "as on chokepoint_status" }, hypothesis: "a guarded corridor changes hands less often", evidence: "measured 2026-09-07, NOT promoted; one measurement covers both record templates and the numbers are on the chokepoint_status candidate entry" }
    rejected:                        # tested 2026-09-07 (era-1914-1945/corridors-7)
      - { id: transit_gdp_growth_mean, evidence: "The declared covariate (mean gdp_growth over the live transit states, z-scored, prior 0.4 for 'growth advances a corridor') is not missing at random and it buys its fit by deleting the hardest cases from the sample. Requiring it drops 168 of 3,143 corridor-years, and those 168 carry 5 of the 37 transitions — a 2.98% event rate against 1.08% in the rows it keeps, because Maddison's gaps ARE the war years (no China 1939-1950) and the record layer's transitions are the war years. The five it removes are hejaz_railway 1908 and 1917, trans_iranian_railway 1941, kirkuk_haifa_pipeline 1948, and burma_road 1940 — the last of them one of the three falsifiers this package was written around, so with the covariate in, the Burma Road closure is not a miss, it is not in the sample at all. On the same 2,975 rows the covariate is worth in-sample AUC 0.848 -> 0.870; on the full 3,143 rows the model without it scores 0.813, and the difference between 0.870 and 0.813 is mostly the selection, not the signal. Fitted -0.57 per sd (transitions happen when growth is bad), against a prior written for the opposite story. Re-propose when the growth series has no war-year holes, or with a stated imputation for a transit state with no growth observation." }
    sources: ["hand records: data/corridors.yaml dated history, 38 corridor records 1869-2026"]
    notes: "Same unit and label construction as chokepoint_status (see its notes). 3,143 corridor-years / 37 transitions over 1869-2025, every record-year in the sample: no covariate here can drop a row (see rejected: transit_gdp_growth_mean, which could)."

# ---------------------------------------------------------------------------------------------------------------
# Retired templates (2026-09-07 cleanup): kept verbatim for the record, not loaded by fit-hazards / backtest / engine.
# autocratization_onset, democratization_onset: V-Dem ERT episodes, superseded by the RoW category-step templates.
# autocratize_step: superseded by liberal_erosion + autocratic_closure. sovereign_default: no event source yet (see docs/data-catalogue.md).
retired:
  - id: autocratization_onset
    lead: 1                            # label = event in year+1; hazard from this year's state applies to the coming year
    status: monitored                  # fitted and backtested, not simulated: superseded by autocratize_step
    label: Autocratization episode begins
    unit: actor-year
    event: autocratization_onset
    window: [1900, 2024]
    holdout_split: 1990
    sample: { regime_min: 1 }          # closed autocracies can't autocratize further
    covariates:
      - { var: regime, transform: cat, prior: { 0: -0.5, 1: 0.6, 2: 0.4, 3: -0.6 } }   # partial regimes are least stable
      - { var: polyarchy, transform: z, prior: 0 }
      - { var: log_gdp_pc, transform: z, prior: -0.5 }
      - { var: gdp_growth, transform: z, prior: -0.3 }
      - { var: at_war, transform: lag1, prior: 0.3 }
      - { var: intrastate, transform: lag1, prior: 0.4, default_outside: { window: [1946, 2024], value: 0, source: "UCDP/PRIO ACD covers 1946-2024; outside it internal conflict is unobserved and imputed 0 so the template is estimable back to its window start. Imputation, not an observation — see docs/refine-log.md" } }
    sources: ["Maerz et al. 2024 (ERT)", "Przeworski et al. 2000", "Goldstone et al. 2010"]

  - id: democratization_onset
    lead: 1                            # label = event in year+1; hazard from this year's state applies to the coming year
    status: monitored                  # superseded by democratize_step (holdout AUC 0.47 vs 0.77)
    label: Democratization episode begins
    unit: actor-year
    event: democratization_onset
    window: [1900, 2024]
    holdout_split: 1990
    sample: { regime_max: 1 }          # at-risk set: autocracies
    covariates:
      - { var: regime, transform: cat, prior: { 0: 0, 1: 0.5, 2: 0.3, 3: -2 } }
      - { var: log_gdp_pc, transform: z, prior: 0.3 }
      - { var: gdp_growth, transform: z, prior: -0.3 }             # crises open windows
      - { var: at_war, transform: lag1, prior: 0.2 }
      - { var: leader_exit_recent, transform: win5, prior: 0.5 }
    sources: ["Boix & Stokes 2003", "Maerz et al. 2024 (ERT)", "Geddes, Wright & Frantz 2014"]

  - id: autocratize_step
    status: monitored                  # superseded by liberal_erosion + autocratic_closure (different mechanisms, see docs/system.md bucket C)
    lead: 1
    label: Regime category moves down (V-Dem RoW), any
    unit: actor-year
    event: regime_change
    event_filter: { direction: autocratize, cause: null }   # conquest/occupation steps excluded (see democratize_step)
    window: [1900, 2024]
    holdout_split: 1990
    sample: { regime_min: 1 }
    covariates:
      - { var: regime, transform: cat, prior: { 1: 0, 2: 0.3, 3: -0.8 } }
      - { var: log_gdp_pc, transform: z, prior: -0.5 }
      - { var: gdp_growth, transform: z, prior: -0.3 }
      - { var: at_war, transform: lag1, prior: 0.3 }
      - { var: intrastate, transform: lag1, prior: 0.4, default_outside: { window: [1946, 2024], value: 0, source: "UCDP/PRIO ACD covers 1946-2024; outside it internal conflict is unobserved and imputed 0 so the template is estimable back to its window start. Imputation, not an observation — see docs/refine-log.md" } }
    sources: ["Goldstone et al. 2010", "V-Dem RoW via OWID"]
    lifecycle: { phase: active, promoted: 2026-09-06, reason: "holdout AUC 0.74; NOTE under-predicts post-1990 autocratization 5× (exp/obs 0.21) — open era shock" }

  - id: sovereign_default
    label: Sovereign default or restructuring
    unit: actor-year
    event: default
    window: [1816, 2024]
    covariates:
      - { var: gdp_growth, transform: z, prior: -0.5 }
      - { var: at_war, transform: lag1, prior: 0.6 }
      - { var: regime_change, transform: win5, prior: 0.5 }
    missing: [external_debt_gdp, reserves_gdp, current_account, real_rate]   # Reinhart–Rogoff / BoC–BoE database not yet fetched
    sources: ["Manasse & Roubini 2005", "Reinhart & Rogoff 2009", "Bank of Canada–Bank of England sovereign default database"]
    status: candidate                                              # no events yet in events.json
