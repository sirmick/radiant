  - id: mid_force
    label: Dyadic militarized dispute with use of force
    unit: dyad-year
    event: mid_force
    window: [1816, 2010]               # era-1991-2026-r2/data-1: was [1816, 2001] (CoW MID 3.02's last dispute year). GML MID 2.2.1 carries the same hostlev variable to 2010 and is spliced on from 2002 in scripts/build-events.mjs; the two sources give 14.0 vs 14.5 pair-onsets/yr over the decade they share
    covariates:
      - { var: contiguous, transform: none, prior: 1.5 }           # Bremer's #1 predictor; CShapes borders (1886+) merged with CoW Direct Contiguity 3.2 (1816+)
      - { var: allied, transform: none, prior: -0.6 }              # any defence pact between the pair
      - { var: joint_democracy, transform: none, prior: -0.8 }     # both regime >= 2
      - { var: cap_ratio, transform: log, prior: -0.3 }            # cinc_max / cinc_min: preponderance pacifies
      - { var: major_power_any, transform: none, prior: 0.8 }
      - { var: rivalry, transform: z, prior: 0.26, decay: 0.85, lifecycle: { phase: active, promoted: 2026-09-07, reason: "replaces win5(mid_force), the binary five-year recurrence flag, with an exponentially decaying rivalry trace: delta^(years since the pair's last militarized dispute), 0 for a pair that has never had one, delta = 0.85. Built once in src/engine/core.js (rivalryScore) and imported by scripts/lib/fit.mjs so the fit and the engine cannot drift apart. Prior: the literature's binary prior for a fresh dispute (1.5 log-odds) divided by the z-score a fresh dispute takes on the fitting sample (5.80 sd; rivalry mean 0.038, sd 0.140, nonzero on 22.7% of dyad-years) = 0.26. The posterior barely feels it (prior 0.10 to 0.80 moves the fitted coefficient by under 0.01 on the full sample, 0.04 at as-of 1900). Ablation over delta in 1.0 / 0.85 / 0.75 / 0.6: one-year holdout AUC (>=1946) 0.8475 / 0.8613 / 0.8582 / 0.8531 against 0.8586 for win5, and backtest 1870-2010 +20y 100 runs all states, pooled mid_force exp/obs and Brier skill 1.00 and -0.013 / 0.84 and +0.069 / 0.86 and +0.059 / 0.88 and +0.049, against 0.95 and +0.026 for win5. delta = 0.85 chosen; delta = 1.0, the no-decay endpoint, is worse than the binary flag it would replace. Fitted +0.40 per sd, where win5 fitted +1.81 - the trace is not weaker, it is shorter: a dispute one year old is 2.3 log-odds against win5's 1.81, and five years old 1.15 against the same 1.81." } }
      - { var: at_war_any, transform: lag1, prior: 0.5 }
      - { var: at_war_any_post46, transform: lag1, prior: 0, source: "the era interaction, same construction as on the war template: a delta on the base contagion term for y >= 1946, entered as a delta rather than a second dummy for the reason recorded there. Measured log-odds ratio on this template's own rows: +1.55 pre-1946 against +0.28 after, on a shipped pooled fit of +1.060", lifecycle: { phase: active, promoted: 2026-09-07, reason: "era-1914-1945-r2/engine-1, the same split as on the war template. holdout_split moves to 1975 so the interaction has within-training variation." } }
    holdout_split: 1975                # era-1914-1945-r2/engine-1: the era-split contagion term needs both eras in training
    candidates:
      - { id: patron_presence, var: patron_presence, transform: none, prior: -0.3, holdout_split: 1946, hypothesis: "operator/presence: one side hosts a great-power station of level >= 2 belonging to a power allied to it and not to the other — tripwire deterrence. Built by src/engine/presence.js and read by scripts/lib/fit.mjs's dyad block and the engine's from the same code", evidence: "measured 2026-09-07 (operator/presence), NOT promoted. Holdout >= 1946, AUC / Brier / exp-obs. mid_force base 0.861 / 0.0099 / 0.95 -> 0.852 / 0.0100 / 1.10, fitted -0.17 (the predicted sign, and worse on all three). mid_war base 0.802 / 0.0013 / 3.22 -> 0.809 / 0.0013 / 3.50, fitted +0.20 — the WRONG sign against a prior of -0.3, and the +0.007 of AUC comes with an exp/obs already at 3.2 getting worse. Diagnosis: patron_presence is on 18% of politically relevant dyad-years and is close to collinear with `allied` and `major_power_any`, both already fitted; what is left of it is a marker for the Cold War blocs, where disputes are frequent. Re-propose as a directed term (the garrison is on ONE side) once the dyad sample is directed, or with the patron's own capability in it." }
      - { id: patron_presence_rival, var: patron_presence_rival, transform: none, prior: 0.3, holdout_split: 1946, hypothesis: "operator/presence, the second form the package asks to test: the same station, but the dispute is with a great power — a garrison is a tripwire against the patron's peers, not a general pacifier", evidence: "measured 2026-09-07 (operator/presence), NOT promoted. Holdout >= 1946. mid_force base 0.861 / 0.0099 / 0.95 -> 0.859 / 0.0099 / 0.99, fitted +0.42; mid_war base 0.802 / 0.0013 / 3.22 -> 0.800 / 0.0013 / 3.33, fitted +0.54. The sign the package predicted for this form, on both templates, and no AUC on either — the calibration on mid_force improves (0.95 -> 0.99) and that is the whole of it. This is the presence term most worth re-proposing when the dyad sample is directed." }
      - { id: corridor_stake, var: corridor_stake, transform: z, prior: -0.3, hypothesis: "the corridor dampener docs/schema.md specifies (era-1914-1945/corridors-7): log1p of the load-bearing weight that third parties carry on infrastructure running through either side of the pair, counted only where the third party holds a defence pact with one of the two. Built once in src/engine/core.js (corridorIndex / corridorStake) and read by scripts/lib/fit.mjs and the engine's dyad block from the same code. Prior negative: a pair whose shared infrastructure is load-bearing for someone's ally is a pair someone leans on not to fight", evidence: "measured 2026-09-07, NOT promoted: the sign is right and the size is nothing. One-year holdout ablation (>=1946): mid_force AUC 0.861 -> 0.861, Brier 0.0099 -> 0.0099, fitted -0.04; mid_war (>=1939) AUC 0.848 -> 0.850, Brier 0.0031 -> 0.0031, exp/obs 0.91 -> 0.87, fitted -0.13. Backtest off -> on (CORRIDOR_DAMPENER=1, 100 runs, all states): 1910-1940 mid_force Brier 0.03985 -> 0.03994 and mid_war 0.02902 -> 0.02918; 1950-2000 mid_force 0.00666 -> 0.00670 and mid_war 0.00205 -> 0.00211. The test asked for an improvement in both windows and got a small loss in all four. Diagnosis: the term is zero for almost every pair-year, because a defence-pact tie between a corridor's dependent third party and one of the two states it runs through is rare in the pre-1946 alliance graph, which is where the corridor records are. Re-propose with the stake weighted by something denser than a defence pact (trade share, or the load_bearing_for value itself without the alliance gate), or once the record layer covers the post-1945 alliance blocs. KNOWN LOOKAHEAD, era-1945-1991-r2/corridors-3: `load_bearing_for` in data/corridors.yaml is ONE undated map per record — the 2026 dependence weights — so every measurement above reads 2026 numbers at 1910 and 1950 (hormuz JPN 0.70 / SGP 1.00 on malacca at as-of 1950, where Japan's Gulf-oil dependence was near zero and Singapore was not a state). src/engine/core.js:corridorStake now takes the year and a record may declare `load_bearing_from`, the first year its weights are a claim rather than a back-projection; it returns 0 for a record before that year. The eleven records added or corrected in this turn carry the field. The other 62 do not, so the ablation above is still measured on a partial lookahead and re-measuring it is part of dating the whole layer." }
    rejected:                                                     # tested 2026-09-07 (era-1870-1914/statistics-6)
      - { id: pre_1946, evidence: "A derived era constant (year < 1946) on the dispute template earns nothing. Ablation at holdout_split 1975 (1946 and every earlier split leave the dummy with no within-training variation, so the test is empty there): holdout AUC 0.900 -> 0.900, holdout Brier 0.0081 -> 0.0081, holdout exp/obs 1.14 -> 1.12, fitted +0.14. The 5x era swing the package was written about is in wars, not disputes: the base dispute model is already calibrated out of sample. Promoted on mid_war instead, where the same ablation gives 0.838 -> 0.841 and exp/obs 3.68 -> 2.10 at +1.17. Post-1945 mid_force still improves in the backtest (pooled 1950-2000 exp/obs 1.32 -> 1.17), through the at_war feedback from the war template and not through a term of its own." }
    sources: ["Bremer 1992", "Oneal & Russett 1999", "Jones, Bremer & Singer 1996"]
    notes: "Dyad sample: politically relevant dyads (contiguous or >=1 major power), all states, 1816-2001. The estimation sample used to start at 1886 — CShapes 2.0 has no polygon before it and scripts/lib/fit.mjs dropped every dyad-year with no contiguity value, so 111 mid_force and 64 mid_war dyad-years dated 1816-1885 were outside the fit and the 1870, 1880 and 1890 as-of rows of the backtest scored nothing at all. Since era-1870-1914-r2 data/contiguity.json merges CoW Direct Contiguity 3.2 (1816-2016, conttype 1-3) with CShapes and its meta.years[0] is 1816; the fitter reads that floor from the file rather than a literal, so the two can no longer drift. (The earlier version of this note claimed 134 and 106 events; the counted numbers are 111 and 64.) The engine still freezes the border graph at as-of, and the stand-in for an as-of before the source starts is now unreachable. Corridor dampener and chokepoint stakes enter as extra dyad covariates once corridors carry historical status. Dyad labels are per-pair from 2026-09-06: hostility = min(hostlev_a, hostlev_b), onset = max(styear_a, styear_b), and mid_war nests inside mid_force. CoW Dyadic MID 3.1 / Maoz MIDdyadic, which ships real dyad-years instead of the coalition cross-product, is the substitution this approximates — see docs/escalations.md."

  - id: mid_war
    label: Dyadic war (hostility level 5)
    unit: dyad-year
    event: mid_war
    window: [1816, 2010]               # era-1991-2026-r2/data-1: was [1816, 2001] (CoW MID 3.02's last dispute year). GML MID 2.2.1 carries the same hostlev variable to 2010 and is spliced on from 2002 in scripts/build-events.mjs; the two sources give 14.0 vs 14.5 pair-onsets/yr over the decade they share
    holdout_split: 1975                # era-1914-1945-r2/engine-1: was 1939 ("the second world war must be forecast out of
                                       # sample"), which is the better test of the base model but leaves the era-split
                                       # contagion term's post-1946 half with no within-training variation, so it cannot
                                       # leave its prior and the ablation is empty. Same contract `pre_1946` ships under.
    covariates:
      - { var: contiguous, transform: none, prior: 1.5 }
      - { var: allied, transform: none, prior: -0.5 }
      - { var: joint_democracy, transform: none, prior: -1.0 }
      - { var: cap_ratio, transform: log, prior: -0.4 }
      - { var: major_power_any, transform: none, prior: 1.0 }
      - { var: rivalry, transform: z, prior: 0.35, decay: 0.85, lifecycle: { phase: active, promoted: 2026-09-07, reason: "replaces win5(mid_force), the binary five-year recurrence flag, with an exponentially decaying rivalry trace: delta^(years since the pair's last militarized dispute), 0 for a pair that has never had one, delta = 0.85. Built once in src/engine/core.js (rivalryScore) and imported by scripts/lib/fit.mjs so the fit and the engine cannot drift apart. Prior: the literature's binary prior for a fresh dispute (2.0 log-odds) divided by the z-score a fresh dispute takes on the fitting sample (5.80 sd; rivalry mean 0.038, sd 0.140, nonzero on 22.7% of dyad-years) = 0.35. The posterior barely feels it (prior 0.10 to 0.80 moves the fitted coefficient by under 0.01 on the full sample, 0.04 at as-of 1900). Ablation over delta in 1.0 / 0.85 / 0.75 / 0.6: one-year holdout AUC (>=1939) 0.8447 / 0.8482 / 0.8477 / 0.8466 against 0.8498 for win5, and backtest 1870-2010 +20y 100 runs all states, pooled mid_war exp/obs and Brier skill 1.13 and -0.079 / 1.03 and -0.035 / 1.04 and -0.038 / 1.04 and -0.041, against 1.10 and -0.056 for win5. delta = 0.85 chosen; delta = 1.0, the no-decay endpoint, is worse than the binary flag it would replace. Fitted +0.15 per sd, where win5 fitted +0.79." } }
      - { var: nuclear_both, transform: none, prior: -1.5 }        # after 1945; the nuclear ceiling
      - { var: pre_1946, transform: none, prior: 0, source: "derived dyad-year constant (year < 1946), computed in scripts/lib/fit.mjs's dyad feature block and src/engine/core.js:dyadHazards; no panel column", lifecycle: { phase: active, promoted: 2026-09-07, reason: "era-1870-1914/statistics-6. Scored by the loop's own ablation with holdout_split 1975 — 1946 and every earlier split leave the dummy with no within-training variation, so the coefficient cannot leave its prior and the test is empty. At 1975: holdout AUC 0.838 -> 0.841 and holdout exp/obs 3.68 -> 2.10, fitted +1.17. Per-era, per-dyad-type in-sample calibration (exp/obs, contiguous-only / major-only / both, base -> with the term) 1886-1914 0.37 / 1.07 / 0.84 -> 0.71 / 1.64 / 1.20, 1915-1945 0.77 / 0.59 / 0.78 -> 1.38 / 0.82 / 0.98, 1946-2001 1.38 / 2.37 / 2.66 -> 0.88 / 1.17 / 1.25: the test asked for 1886-1914 contiguous-only above 0.6 (0.37 -> 0.71) and 1946-2001 major-only below 1.6 (2.37 -> 1.17), and both hold. Under the rolling-origin refit the term is identified only where a forecaster holds both eras: at as-of 1940 and earlier the training sample is all pre-1946 and the coefficient stays at its prior, so the pre-war rows are unchanged and the whole effect is post-1946. Rejected on mid_force, where it earns nothing (numbers under rejected: there)." } }
      - { var: at_war_any, transform: lag1, prior: 0.9, lifecycle: { phase: active, promoted: 2026-09-06, reason: "the feature was already computed in both scripts/fit-hazards.mjs and src/engine/core.js and used only by mid_force. Measured on the politically relevant dyad-years: P(war | either side at war last year) 0.99% vs 0.39% otherwise, log-OR +0.93. Ablation on the corrected dyad labels: holdout(>=1939) AUC 0.757 -> 0.850, in-sample 0.793 -> 0.872; backtest 1910-1940 exp/obs 0.28 -> 0.44 and skill 0.08 -> 0.12. Cost, recorded: it amplifies in simulation, because the engine has no war duration and redraws every year — backtest 1950-2000 exp/obs 1.66 -> 2.62. The era interaction below is the damping this turn adds." } }
      - { var: at_war_any_post46, transform: lag1, prior: 0, source: "derived dyad-year interaction: either side at war in y-1 AND y >= 1946, built in scripts/lib/fit.mjs's dyad feature block and src/engine/core.js:dyadHazards from the `pre_1946` constant already in both; no panel column. Entered as a DELTA on the base term above and not as a second dummy, so a forecaster with no post-1946 training rows keeps the pooled contagion coefficient instead of falling back to a prior. The two-dummy form was built and measured first and cost this turn's own window — mid_war pooled exp/obs 0.47 -> 0.28 and mid_force 0.51 -> 0.40 against the corrected labels — because at as-of <= 1940 the post-1946 half is unidentified and 15 of the 20 horizon years took a prior of +0.4 where the pooled term had +1.70. Prior 0: absent evidence, the two eras are the same", lifecycle: { phase: active, promoted: 2026-09-07, reason: "era-1914-1945-r2/engine-1: one pooled contagion coefficient was doing two jobs. Stratified log-odds ratio of lag1(at_war_any) on the fitter's own dyad rows: pre-1946 +2.02 (n=31,043, 197 events, 122 of them in 5,570 at-war dyad-years) against post-1946 +0.50 (n=47,872, 60 events, 8 in 4,268 at-war dyad-years); on mid_force +1.55 against +0.28. The shipped pooled fit was +1.774, so the post-1945 dyad was handed 4.8x the odds multiplier its own era supports: the simulated at-war count from as-of 1950 climbed 9.7 (1951) to 28.2 (1970) against an observed panel count of 0-9 with no trend, and 88% of simulated wars fired in a dyad where one side was at war last year. holdout_split moves 1939 -> 1975 with it: at 1946 and every earlier split the interaction has no within-training variation, cannot leave its prior, and the ablation is empty — the identification contract `pre_1946` already ships under." } }
    candidates:
      - { id: patron_presence, var: patron_presence, transform: none, prior: -0.3, holdout_split: 1946, hypothesis: "operator/presence; same construction as on mid_force", evidence: "measured 2026-09-07 (operator/presence), NOT promoted. numbers on the mid_force candidate entry (one measurement covers both templates)." }
      - { id: patron_presence_rival, var: patron_presence_rival, transform: none, prior: 0.3, holdout_split: 1946, hypothesis: "operator/presence; same construction as on mid_force", evidence: "measured 2026-09-07 (operator/presence), NOT promoted. numbers on the mid_force candidate entry." }
      - { id: corridor_stake, var: corridor_stake, transform: z, prior: -0.3, hypothesis: "the corridor dampener docs/schema.md specifies (era-1914-1945/corridors-7); same construction as on mid_force", evidence: "measured 2026-09-07, NOT promoted; the numbers are on the mid_force candidate entry (one measurement covers both templates: the ablation and the backtest switch turn the term on for every template that declares it)" }
    coalition:                         # a war is between sides, not states (era-1914-1945/engine-1)
      status: candidate                # built, measured 2026-09-07, NOT promoted — the numbers are under rejected: below
      p_join: 0.094                    # per defence-pact ally of each side, per war onset
      source: "calibrated from the sides: lists in data/history/events.yaml (the one place country names are allowed, per agent/fixer.md), against CoW alliance v3.03 defence pacts (sstype 1) in the war's start year. For each of the 44 hand-coded wars take the pair that starts it (the earliest entrant on each side by the entries: map, the listed order otherwise), count every live state holding a defence pact with either of the two in that year, and count how many of those are in the war's sides: list. 297 allies at risk, 28 joiners, p = 0.0943. Reproduce with node scripts/coalition-calib.mjs, which prints the per-war rate and the per-dyadic-war-year rate side by side. Per war: ww2 9/12, ww1 5/5, gulf_1991 5/66, six_day 2/12, yom_kippur 1/16, balkan_1 1/1, balkan_2 1/1, austro_prussian 1/11, nomonhan 1/13, iran_1941 1/5, vietnam 1/38, and 0 of 43 (falklands), 0 of 16 (iran_iraq), 0 of 13 (winter_war), 0 of 11 (changkufeng), 0 of 7 (suez_1956), 0 of 5 (franco_prussian, italo_ethiopian, anglo_iraqi_1941 4), 0 of 3, 0 of 2, 0 of 1 elsewhere. One p across all eras: the post-1945 blocs are large and almost never join (gulf 5 of 66, falklands 0 of 43, vietnam 1 of 38), which is what holds the pooled rate down to 9% and is the reason the same rule does not have to fire in the wrong era."
      relevance: linked                # ... and the relevance set that implies, evaluated at the simulated year:
                                       # linked = at war with each other or with a state allied to the other;
                                       # both_at_war = the same, and both sides already in a war; false = off
                                       # Switches (node only, stamped into the backtest's meta and filename):
                                       # COALITION_ON=1 runs this candidate without editing the data, COALITION_P_JOIN=<p>
                                       # and COALITION_RELEVANCE=<mode> override the two fields (p_join 0 = relevance only),
                                       # ENGINE_ABLATE=coalition / coalition_relevance force it (or its second half) off.
    duration:                          # interstate war as a spell, not a one-year flag (era-1914-1945/engine-5)
      status: candidate                # built and measured twice, NOT promoted: it fails the package-2 guard — see below
      draw: war_end                    # the fitted war_end template, drawn once per running spell per year
      source: "Was `draw: empirical` — a length resampled from the panel's own at_war run lengths as observed at the as-of year (139 completed spells 1816-2025, mean 3.0 years, 49% of one year). That version was built and measured on 2026-09-07 and NOT promoted; its numbers are under `rejected: war_duration` below and it is still reproducible with ENGINE_ABLATE=war_end, which leaves the spell mechanism on and takes the fitted hazard off. It is now the fitted `war_end` template above: a running war draws its own termination each year from its duration-so-far and the shape of the coalition it is inside, a fired war draws at age 0 so it can be a one-year war, and a war already running at as-of is seeded from the observed record with its real start year. That version FIXES the spell shape and still fails the package-2 guard, so it stays a candidate too; the numbers are under `rejected: war_end` below. WAR_DURATION_ON=1 runs it without editing this field (node only, stamped into the backtest meta and filename) and ENGINE_ABLATE=war_duration forces it off."
    rejected:                          # tested 2026-09-07 (era-1914-1945/engine-5, engine-1, operator/termination); kept so the loop does not re-propose them unchanged
      - { id: recency_weighted_fit, evidence: "era-1914-1945-r2/statistics-8, measured by the adversary and recorded here so the loop does not chase it: a discounted likelihood (weights exp(-(asOf - labelYear)/tau) in a weighted IRLS) is the obvious remedy for 'a forecaster standing in 1950 has WW1 and WW2 in the sample and nothing after', and it makes the guard row worse monotonically. Static rolling-origin forecast for mid_war, tau in inf / 60 / 40 / 25 / 15: as-of 1950 exp/obs 5.33 / 5.58 / 5.72 / 5.96 / 6.38 with holdout AUC 0.887 / 0.876 / 0.872 / 0.866 / 0.854; as-of 1960 flat (3.31 -> 3.14); 1970 and 1980 improve slightly (1.96 -> 1.60, 2.39 -> 1.99) always with AUC falling. It does help the under-predicting era rows (as-of 1940 0.59 -> 1.03, as-of 1920 0.66 -> 0.95 at tau = 15) — which is diagnostic, not encouraging: down-weighting the 19th century helps the interwar rows, and down-weighting the world wars cannot help the post-war rows because at as-of 1950 the world wars ARE the recent data. The post-1945 break is a missing covariate, not stale data. If a weighting scheme is ever re-proposed it must beat these numbers at these as-of years." }
      - { id: war_end, evidence: "The FITTED war-spell hazard (operator/termination, package 8) — a running war draws `war_end` each year with its own duration-so-far in it, a fired war draws at age 0 so it can be a one-year war, and a war already running at as-of is seeded from the observed record with its real start year. It fixes what the resampled length below got wrong and fails the same guard. Spell shape, as-of 1920, 400 runs (node scripts/analysis/termination.mjs): mean 3.06 years and 36% one-year spells, against the panel's 3.02 / 49% over all years, a 20-year-windowed panel figure of 2.39 / 57%, and the package's stated 3.0 / 33% — inside the +-30% the test asks for, where the resampled draw gave 3.91 / 24%. Calibration, backtest 1870-2010 +20y 100 runs all states, off -> on: pooled mid_war exp/obs 0.80 -> 1.10 and Brier skill -0.009 -> -0.064, mid_force 0.77 -> 0.96 and +0.088 -> +0.044, AUC unchanged at 0.77 on both. The pooled calibration IMPROVES — without a duration the model under-predicts wars over the whole window — and the guard is on the post-war half: 1950-2000 mid_war exp/obs 2.65 -> 3.57 (the package asks for not worse) and mid_force 1.17 -> 1.43. Reproduce with WAR_DURATION_ON=1 on scripts/backtest.mjs; both runs are committed as scores/backtest-1870-2010-h20-all-abl-war_duration_on_1.json and scores/backtest-1950-2000-h20-all-abl-war_duration_on_1.json. Diagnosis, unchanged from the resampled version: the amplification is lag1(at_war_any) = +1.91 reaching the belligerents' OTHER dyads, so a longer spell is a longer exposure; and the two at_war populations still differ (the panel's at_war is the hand-coded interstate-war list, the engine sets at_war from any simulated hostlev-5 dyad, and in the observed record about half the dyadic onsets happen inside a war that is already running, so a war-level termination process would put 1.31 at-war years on an onset year where a pair-level one puts 2.5). Re-propose with the war as the unit rather than the pair — one spell per war component, with the pairs inside it sharing it — which is also what the coalition rule needs." }
      - { id: coalition_join, evidence: "Coalition joining (p_join per defence-pact ally of each side, calibrated at 0.094 on the sides: lists) plus the war-linked relevance set fixes the pre-war half of its test and fails its post-war guard by 7x. Backtest 1910-1940 +20y 100 runs all states, off -> on: mid_war n_structural_miss 81 -> 70 at as-of 1930 and 87 -> 54 at as-of 1940 (the test asked for below 20), auc_at_risk 0.729 -> 0.78 and 0.776 -> 0.82, pooled exp/obs 0.39 -> 0.60 and skill 0.092 -> 0.13; mid_force miss 105 -> 93 and 128 -> 88, pooled 0.50 -> 0.64 and 0.122 -> 0.15. Guard, 1950-2000: mid_war exp/obs 2.61 -> 28.00 and mid_force 1.17 -> 6.39. The relevance half alone (COALITION_P_JOIN=0) does not rescue it: it carries most of the structural gain (mid_war miss 81 -> 77 at 1930 and 87 -> 57 at 1940, mid_force 105 -> 96 and 128 -> 96, pooled 0.45 and 0.54) and still takes the guard to 4.85 / 1.69, while as-of 1940 auc_at_risk falls 0.776 -> 0.704, below the guard's 0.74 - the pairs it opens are mostly ones that never fight, and each of them carries lag1(at_war_any) = +1.92 because a war is what opened it. The two halves amplify separately (1950-1980, 20 runs, mid_war exp/obs 3.10 with the mechanism off): joining alone 12.96, joining at p=0.005 with the relevance set on 6.78, both at the calibrated p 33.58. p_join sweep with relevance off: 0.094 -> 12.96, 0.046 -> 7.36, 0.0145 -> 4.19, 0.005 -> 3.42; with the tighter both_at_war relevance, 0.094 -> 17.10 and 0.0145 -> 4.26. Every run above is reproducible with COALITION_ON=1 [COALITION_P_JOIN=<p>] [COALITION_RELEVANCE=both_at_war] [ENGINE_ABLATE=coalition_relevance] on scripts/backtest.mjs, which writes each ablation to its own scores/...-abl-<switches>.json. No setting of p_join is neutral post-1945. Diagnosis, measured: p_join is a per-war rate applied per dyadic war-year draw, and the engine fires 2.6x too many of those post-1945 into blocs an order of magnitude larger than the historical at-risk set of 3.91 allies per dyadic war-year (2.13 of them still out of the war) (1,016 dyadic war-years, 3,973 ally-draws counting every ally of the pair - the engine's own denominator - or 2,160 counting only the allies still out of the war, against 28 joiners: 0.0070 to 0.0130 per draw, against 0.094 per ally per war; node scripts/coalition-calib.mjs). The relevance half amplifies for a second reason: it admits a pair *because* one side is at war, so every pair it admits carries lag1(at_war_any) = +1.92. On the observed record the rule is small — 854 extra dyad-years 1886-2001 (69,099 -> 69,953), 397 of them pre-1946 carrying 29 wars (7.3%) and 457 post-1946 carrying 4 (0.9%), so the fit does see that the post-war ones are cold — but in simulation at as-of 1970 it opens about 5,000 extra at-risk pairs (mid_war n_at_risk 749 -> 5,186, mid_force 816 -> 5,297), because every one of the engine's too-many wars opens its belligerents' whole alliance neighbourhood. Re-propose against a war process that is calibrated post-1945, with p_join calibrated per dyadic war-year (0.0070 to 0.0130) rather than per war, or with the joining draw made once per war component per year rather than once per fired dyad." }
      - { id: war_duration, evidence: "Holding at_war on both belligerents for a drawn duration fixes the spell shape and fails on every calibration number. Spell shape, as-of 1920, 100 runs (node scripts/analysis/war-spells.mjs --as-of 1920): one-year spells 70% -> 24% and mean length 1.51 -> 3.91 years, against the panel's 49% / 2.99 over all years and 26% / 2.91 for the spells a forecaster at 1920 has seen. Calibration, backtest 1870-2010 +20y 100 runs all states: pooled mid_war exp/obs 1.03 -> 1.50 and Brier skill -0.035 -> -0.176, mid_force 0.84 -> 1.08 and +0.069 -> 0.000, AUC unchanged at 0.77; 1950-2000 mid_war 3.89 -> 5.58 (the test asked for below 1.5) and mid_force 1.32 -> 1.65; 1910-1940, where the model under-predicts, it helps: mid_war 0.39 -> 0.60 and mid_force 0.50 -> 0.69, skill 0.092 -> 0.090 and 0.122 -> 0.109. Diagnosis, measured: the amplification is not repeated draws inside the same dyad (those are suppressed) but lag1(at_war_any) = +2.13 reaching the belligerents' other dyads, so a longer spell is a longer exposure and the simulated war count at as-of 1920 doubles, 5,610 -> 10,352. The two at_war variables are also not the same population: the panel's at_war is the hand-coded interstate-war list (371 actor-years 1886-2001, 3.3% of live actor-years) while the engine sets at_war from any CoW hostility-5 dyad, whose onsets are 283 actor-years - 1.31 at-war years per onset year, not the 2.6-3.0 of a whole spell, because about half the dyadic onsets happen inside a war that is already running. Re-propose with the era term (era-1870-1914/statistics-6) or the coalition rule (era-1914-1945/engine-1) in place, or with the duration drawn per dyad from CoW MID endyear (396 dyadic war spells, mean 2.61, 38% of one year) and calibrated on simulated at-war exposure rather than on spell length." }
    sources: ["Bremer 1992", "Bueno de Mesquita & Lalman 1992"]
    notes: "mid_war nests inside mid_force: CoW hostlev is ordinal and the dyad's hostility is min(hostlev_a, hostlev_b), so a hostlev-5 pair is also a use-of-force pair. Before 2026-09-06 the two were disjoint (dispute-level max), which made observed mid_war exceed observed mid_force at as-of 1930. The engine nests the draw the same way from 2026-09-07 (era-1870-1914/engine-7): it draws mid_force first and the war only inside it, at P(war | dispute) = hz.mid_war / max(hz.mid_force, hz.mid_war) — the derived form, not a refit on the mid_force-positive subsample, which is the form these coefficients are therefore read with. The marginal is unchanged wherever p_war <= p_force and capped at the dispute's own probability where the war model runs hotter, which is where lag1(at_war_any) = +2.13 has switched on. Verified: 5,610 simulated wars at as-of 1920 over 100 runs, none in a dyad-year without a dispute (node scripts/analysis/war-spells.mjs). ENGINE_ABLATE=war_nesting restores the independent draws."
    lifecycle: { phase: active, reason: "dyad labels re-derived per pair 2026-09-06: hostility = min of the pair, onset = max of the pair. The dispute-level version stamped CoW dispnum 258 (WWII) as 223 dyadic wars all dated 1939, Spain-China among them" }

  - id: interstate_onset
    label: Interstate armed-conflict onset (UCDP/PRIO type 2, >= 25 battle deaths)
    unit: dyad-year
    event: interstate_onset
    window: [1946, 2024]               # era-modern-2000-2025/data-1, engine-4, statistics-3: the second dyadic unit, and the only one whose
                                       # ground truth reaches the forecast origin. mid_force / mid_war / war_end stop at 2010 (GML MID 2.2.1's
                                       # last dispute year), so as-of 2010 reported n=0 on all three and the modern dyad was graded by nothing.
                                       # UCDP/PRIO ACD 25.1 carries interstate onsets 1946-2024 and scripts/build-events.mjs already emits 84 of
                                       # them; nothing consumed them as labels. NOT a substitute for mid_force and NOT merged into it: the rates
                                       # differ by an order of magnitude (UCDP interstate onsets 0.58/yr over 1992-2010 against mid_force's
                                       # 10.58/yr, 0.79/yr over 2011-2024), because the two sources measure different things — a militarized
                                       # dispute with use of force against a conflict that killed 25 people. This is its own unit with its own
                                       # base rate, scored on its own window.
    holdout_split: 2000                # leaves 1946-1999 in training and the 2000-2024 events out of sample: the era the template exists for
    covariates:
      - { var: contiguous, transform: none, prior: 1.5 }           # Bremer's #1 predictor, as on mid_force
      - { var: allied, transform: none, prior: -0.5 }
      - { var: joint_democracy, transform: none, prior: -1.0 }
      - { var: cap_ratio, transform: log, prior: -0.4 }
      - { var: major_power_any, transform: none, prior: 0.8 }
      - { var: rivalry, transform: z, prior: 0.35, decay: 0.85 }   # the same decaying trace mid_force and mid_war carry; DYADIC_DISPUTE already includes this kind, so the trace and the label come from one source set
      - { var: at_war_any, transform: lag1, prior: 0.9 }
      - { var: nuclear_both, transform: none, prior: -1.5 }
    sources: ["UCDP/PRIO Armed Conflict Dataset 25.1 (type 2, interstate)"]
    notes: "84 dyadic onsets 1946-2024 over 55 distinct pairs, 11 of them in 2011-2024 — the only dyadic labels that exist past the MID window. The engine draws it as a third, independent dyadic event alongside the nested mid_force/mid_war pair (src/engine/core.js:stepYear): it is a different source measuring a different threshold, so it is neither nested inside mid_force nor suppressed by it, and a fired onset writes the pair into the rivalry memory exactly as a fired MID does. `pre_1946` and `at_war_any_post46` are not covariates here — the window starts in 1946, so both are constant on this sample and unidentifiable."

  # ------------------------------------------------------------------------------------------------------------
  # Terminations (operator/termination, package 8). Every template above predicts an ONSET; these four predict the
  # END of a spell the engine carries as state, on the spell-year unit (one row per unit per year the spell runs,
  # covariates from the state the year opens in, label = the spell ends during the year — the record layer's
  # construction, not `lead: 1`, because here the transition IS the label and cannot also be a covariate).
  # The samples and covariate blocks are built once in src/engine/termination.js and read by scripts/lib/fit.mjs
  # and src/engine/core.js from the same code.

  - id: war_end
    label: A dyadic interstate war ends
    unit: war-year                     # one row per pair per year of a running war spell
    event: war_end
    spell: war
    window: [1816, 2010]               # era-1991-2026-r2/data-1: was [1816, 2001] (CoW MID 3.02's last dispute year). GML MID 2.2.1 carries the same hostlev variable to 2010 and is spliced on from 2002 in scripts/build-events.mjs; the two sources give 14.0 vs 14.5 pair-onsets/yr over the decade they share; spells still open in 2010 are right-censored and their last row dropped
    holdout_split: 1975                # era-1914-1945-r2/engine-5: was 1946; the era term needs both halves in training
    cluster: war_component             # era-1914-1945-r2/statistics-6: the 421 dyadic spells are ~65 independent wars
    covariates:
      - { var: war_duration, transform: z, prior: -0.2, source: "Bennett & Stam 1996: negative duration dependence — the wars still running at year t are the hard ones. The observed hazard on this sample is 0.43 / 0.35 / 0.24 at ages 0 / 1 / 2 and then rises again on the two world wars, and the posterior comes out at +0.08: the prior's sign is not what this sample says" }
      - { var: war_coalition, transform: none, prior: -0.3, source: "derived from the spell itself (src/engine/termination.js:warSpells): the widest participant count any of the pair's overlapping disputes carried, > 2. A pair fighting inside a coalition stops when the coalition's war stops, which is later. Not one of the package's five covariates — it was added because four of those five either fail the holdout or delete the sample's largest cluster of endings; the numbers are under candidates: and rejected: below" }
      - { var: pre_1946, transform: none, prior: 0, source: "derived war-year constant (year < 1946), the same constant the dyadic templates carry; built in src/engine/termination.js:warEndFeatures so the fitter and the engine read one construction", lifecycle: { phase: active, promoted: 2026-09-07, reason: "era-1914-1945-r2/engine-5: the template was effectively a constant while its own sample says the constant is wrong by era. Observed termination hazard on the fitter's spell-year rows: pre-1914 0.559 (152 spell-years, 85 endings), 1914-1945 0.391 (619 / 242), post-1946 0.296 (270 / 80) — a 1.9x monotone swing that no covariate in the block tracks. Under the rolling refit a forecaster at as-of 1950 was giving post-war wars spells about 30% too short and one at as-of 1910 interwar wars about 40% too short. holdout_split 1946 leaves the term identified (both eras are in training at 1975; at 1946 the pre-war half is all of training and the coefficient is a level shift on the test half), so the split moves with it." } }
      - { var: contiguous, transform: none, prior: 0.3, source: "data/contiguity.json (CShapes 2.0 merged with CoW Direct Contiguity 3.2), read through src/engine/termination.js:termLook so the fitter and the engine build it once", lifecycle: { phase: active, promoted: 2026-09-07, reason: "era-1870-1914-r2. Measured and NOT promoted on 2026-09-07 with the note 'promote it together with the pre-1886 contiguity source (CoW Direct Contiguity 3.2) that data/templates.yaml already names as deferred', because the term cost 122 spell-years carrying 64 endings — every war-year before 1886, where CShapes has no polygon and the fitter dropped the row. The source landed this turn (scripts/fetch-contdir.mjs; data/contiguity.json meta.years[0] = 1816), and the condition the earlier measurement set is met: the ablation now keeps the WHOLE sample, n=1041 spell-years / 407 endings with and without the term. Holdout (>= 1946) AUC 0.612 -> 0.632, Brier 0.2241 -> 0.2230, exp/obs 1.45 -> 1.45, fitted +0.25 against a prior of +0.3. A gain on discrimination and calibration at no cost in sample, which is what the deferred promotion was waiting for. It changes no scored row yet: war_end is scored only under WAR_DURATION_ON=1 (the war spell is a candidate mechanism), so this is a fit-level promotion whose backtest consequence is measured when that mechanism is re-taken." } }
    candidates:                        # the package's own five, measured 2026-09-07 and NOT promoted. Base = the two fitted
                                       # covariates above: n=1,041 spell-years / 407 endings, holdout (>= 1946) AUC 0.612.
      - { id: cap_ratio, var: cap_ratio, transform: log, prior: 0.4, hypothesis: "the package's capability ratio: preponderance decides quickly (Bennett & Stam 1996; Slantchev 2004)", evidence: "measured 2026-09-07, NOT promoted, and the reason is the sample and not the coefficient. Requiring it drops 87 of 1,041 spell-years, and the rows it drops carry 84 of the 407 endings — an 82% event rate against 29% in the rows it keeps — because scripts/build-panel.mjs nulls `cinc` for occupied actor-years (OCC_NULL) and the occupied actor-years of 1940-45 are exactly where the war spells of 1945 end. With it in: n=954, holdout AUC 0.612 -> 0.592, fitted +0.06. This is the transit_gdp_growth_mean failure on corridor_status again: a covariate that buys its fit by deleting the hardest cases. Re-propose once the fitter carries the last observed capability forward the way src/engine/core.js already does for the engine." }
      - { id: major_power_any, var: major_power_any, transform: none, prior: -0.4, hypothesis: "the package's great-power belligerent: great-power wars run long", evidence: "measured 2026-09-07, NOT promoted. Loses no rows and loses the holdout: 0.612 -> 0.514, fitted -0.25 (the predicted sign). It is the term the coalition size already carries — with war_coalition in the model, `major_power_any` adds nothing out of sample." }
      - { id: war_growth_min, var: war_growth_min, transform: z, prior: 0.3, hypothesis: "the package's GDP shock: economic exhaustion ends wars (Slantchev 2004), read from the WORSE of the two belligerents' growth in the PREVIOUS year", evidence: "measured 2026-09-07, NOT promoted. Holdout 0.612 -> 0.554, fitted -0.13, and it drops 46 spell-years. Recorded because the same term measured CONTEMPORANEOUSLY fits at -0.66 with in-sample AUC 0.639 — 'wars end in good years' — which is the recovery being dated to the year the fighting stopped: a covariate that is partly its own label. Lagging it one year flips the sign to the prior's and costs the in-sample AUC, which is the tell." }
      - { id: joint_democracy, var: joint_democracy, transform: none, prior: 0.3, hypothesis: "democracies fight short wars (Bennett & Stam 1998)", evidence: "measured 2026-09-07, NOT promoted. It is the largest single holdout gain available (0.612 -> 0.661) and it fits at -0.35, the WRONG sign against the literature, on a sample it shrinks by 123 rows carrying 73 endings (regime is missing for both sides in 50 rows of the 1960s alone). A wrong-signed term that buys holdout AUC by deleting a quarter of the post-war endings is not a mechanism." }
      - { id: patron_presence, var: patron_presence, transform: none, prior: 0.3, hypothesis: "the package's third-party presence: a great power with a station on one side, allied to it and not to the other, is a third party with a stake in stopping the war (src/engine/presence.js)", evidence: "measured 2026-09-07, NOT promoted. Holdout 0.612 -> 0.591, fitted +0.42 (the predicted sign, no discrimination); the rival form patron_presence_rival gives 0.585 at +0.29. The term is also a silent structural zero before 1870, where data/presence.yaml claims no coverage." }
    rejected:                          # tested 2026-09-07 (operator/termination)
      - { id: war_end_discrimination, evidence: "The template as fitted does not discriminate, and the ONE split at which it does is the one the package asked for. Holdout AUC for the promoted pair (war_duration + war_coalition) at splits 1900 / 1914 / 1939 / 1946 / 1960 / 1975: 0.468 / 0.461 / 0.499 / 0.612 / 0.504 / 0.550, with test-half base rates 0.371 / 0.362 / 0.385 / 0.296 / 0.265 / 0.291. In-sample AUC is 0.507 on 1,041 rows. Read the promotion accordingly: what this template is FOR is the baseline hazard and its duration shape, which is what src/engine/core.js draws a war's length from, and the >= 0.6 the package's test asks for is one split's worth of ordering. A specification search over the package's five covariates and two more found nothing that discriminates at more than one split; the alternative is not a better dyadic covariate but a war-level (rather than pair-level) termination process, where the thing that ends is the war and not the pair." }
    sources: ["Bennett & Stam 1996 (duration of interstate wars)", "Slantchev 2004 (how initiators end their wars)", "CoW MID 3.02 endyear"]
    notes: "Sample: merged dyadic hostlev-5 spells (src/engine/termination.js:warSpells) — the pair's overlapping disputes are one spell, because the state the engine carries is 'this pair is at war' and not 'this dispute is running'. 407 spells / 1,017 spell-years 1816-2001, mean 2.50 years, 43% of one year. This template replaces the drawn `duration:` block below on data/templates.yaml's dyadic war template: a fired war draws its termination each year from these coefficients instead of resampling a length."

  - id: intrastate_end
    label: An internal armed conflict ends
    unit: actor-year
    event: intrastate_end
    spell: intrastate                  # the sample is the actor-years the spell is running (panel `intrastate` > 0)
    sample: { flag: intrastate }
    window: [1946, 2024]               # UCDP/PRIO ACD 25.1; runs still open in 2024 are censored and their last row dropped
    holdout_split: 1985
    covariates:
      - { var: conflict_duration, transform: z, prior: -0.3, source: "Fearon 2004: civil wars that have run long run longer still — the observed hazard on this sample falls from 0.28 at age 0 to under 0.10 past age 10" }
      - { var: regime, transform: cat, prior: { 0: 0, 1: 0.1, 2: 0.2, 3: 0.3 } }
      - { var: log_gdp_pc, transform: z, prior: 0.3 }           # capable states finish conflicts (Fearon & Laitin 2003, read backwards)
      - { var: at_war, transform: none, prior: -0.4 }           # an interstate war on top of it keeps the internal one alive
      # external presence, the package's third covariate: the strongest great-power station on the actor's own territory
      - { var: presence_any, transform: z, prior: 0.2, default_outside: { window: [1870, 2026], value: 0, source: "data/presence.yaml claims coverage 1870-2026 (its own header); this template's window opens inside it, so the default never fires — it is declared so the covariate cannot silently drop a row if the layer's coverage is ever narrowed" } }
    sources: ["Fearon 2004 (why some civil wars last so much longer)", "UCDP/PRIO ACD 25.1", "Doyle & Sambanis 2000 (external intervention and settlement)"]
    notes: "Split sensitivity, holdout AUC at 1970 / 1985 / 2000: 0.706 / 0.734 / 0.735 (n_test 1,355 / 1,032 / 601) — unlike war_end this template discriminates wherever it is cut. Sample: runs of the panel's `intrastate` flag — the union over every type-3/4 conflict the actor is in, which is the same union the engine sets and clears, so the spell fitted is the spell simulated. 1,778 actor-years / 272 observed endings 1946-2024. This template replaces the engine's typed `conflictLeft = 1 + floor(rng()*6)`."

  - id: record_reopen
    label: An impaired corridor or chokepoint returns to service
    unit: record-year
    kinds: [chokepoint, corridor]      # one process over both record kinds — see notes
    event: record_reopen
    spell: impaired                    # the sample is the record-years the record opens closed or contested
    window: [1869, 2025]               # era-1945-1991-r2/corridors-1: NOT reopened. The 1946-1991 record layer landed in this
                                       # turn (see chokepoint_status), and on the chokepoint half it passes the
                                       # era-1914-1945-r2/statistics-5 gate; on this template's own spell sample it does
                                       # not. 18 reopenings over 242 impaired record-years in 1946-1991 (7.44%) against
                                       # 41 over 150 (27.33%) in the coded window, a factor of 3.7. Part of that is real
                                       # — the era's closures were long (Benguela cut 1975-2014, Kirkuk-Haifa closed in
                                       # 1948 and never reopened, the Gibraltar land frontier shut 1969-1985) — and part
                                       # is the same un-coded reopenings corridor_status is held back for. The sample is
                                       # the 46 corridor records plus the chokepoints and is not separable from
                                       # corridor_status, so this window moves when that one does.
                                       # era-modern-2000-2025/corridors-2, engine-3: THE WINDOW MOVES TO 2025, and the
                                       # gate is re-read as the censoring problem it is. Raw, on the fitter's own spell
                                       # rows: 27.15% over 151 impaired record-years in 1869-1945, 11.61% over 155 in
                                       # 1946-1991, 6.08% over 148 in 1992-2025 — a ratio of 0.22 that reads as a
                                       # coding hole. It is not one. 113 of those 148 modern rows are SIX spells that
                                       # are still running at 2025 and therefore cannot contribute a reopening
                                       # (kerch_strait 22 years, yamal_europe 21, bratstvo/soyuz/urengoy 11 each,
                                       # benguela_railway 23), which is right-censoring, and the termination layer's
                                       # own convention already names it. Drop the never-ending spells from the
                                       # measurement and the modern rate is 25.71% over 35 rows against 28.47% over 144
                                       # pre-1946 — a ratio of 0.90, inside the band. The censored rows are NOT dropped
                                       # from the fit: a spell still running contributes its years as observed
                                       # non-endings, which is the correct discrete-time exposure and is exactly what
                                       # tells the hazard that modern closures are long. That is the point of the move:
                                       # the shipped 1869-1945 fit (n=148, 40 events, base rate 0.270/yr, holdout AUC
                                       # 0.500 at 1930) reopened all fifteen impaired records at as-of 2025 with
                                       # probability >= 0.87 within twenty years, on a hazard estimated entirely on
                                       # pre-war straits and never graded out of sample after 1945.
    holdout_split: 1930
    covariates:
      - { var: impair_duration, transform: z, prior: -0.2 }
      - { var: adjacent_war, transform: none, prior: -1.5 }     # a strait does not reopen while a transit state is still at war
      - { var: guarantor_presence, transform: z, prior: 0.4, default_outside: { window: [1870, 2026], value: 0, source: "as on chokepoint_status: data/presence.yaml claims 1870-2026 and the 1869 record-years take a declared structural zero" } }
      - { var: sponsor_great_power, transform: none, prior: 0.3 }
    sources: ["hand records: data/corridors.yaml dated history, 9 chokepoint records 1869-2026"]
    notes: "Sample: 185 impaired record-years carrying 16 returns to service, 1869-1945. Two departures from the package, both forced by the data and both measured. (a) The unit is BOTH record kinds, not chokepoints alone: an impaired strait and a cut rail line or pipeline are the same process — the thing stops carrying traffic and later carries it again — and chokepoints on their own give 31 spell-years in this window, below the fitter's own n >= 50 floor. (b) The window stops at 1945, which is where scripts/backtest.mjs already says the hand-coded record layer is complete. On the full 1869-2026 record the chokepoint sample reaches 128 rows, but 86 of them are ONE record sitting closed from 1939 to 2025 because nothing has ever added its post-war reopening — so the full-record base rate of 9.4% is an artefact of a missing history and not a measurement, and a hazard fitted on it reopens straits an order of magnitude too slowly. Extending the record layer past 1945 (era-1914-1945/corridors-7 (b)) is what would let this template be fitted on the whole record and scored at the >= 1946 holdout the package asks for; today that holdout has 4 events in its test half and fit.mjs reports `insufficient events`. Split sensitivity inside the window, holdout AUC at 1930 / 1943: 0.742 / 0.656 (n_test 90 / 23). Three rows are dropped, one of them carrying a reopening, because no transit state of that record is a live actor in those years — the same three rows chokepoint_status drops. Covariates are the record layer's own (src/engine/core.js:corridorFeatures) plus the impairment's duration, so the reopen template and the status template describe the same record-year with the same numbers."

  - id: contest_settle
    label: A territorial contest is settled
    unit: territory-year
    event: territory_settle
    spell: unsettled                   # the sample is the territory-years the record is in any status other than `settled`
    window: [1871, 2026]
    holdout_split: 1946
    covariates:
      - { var: contest_duration, transform: z, prior: -0.2 }
      - { var: contest_reversible, transform: none, prior: 0.8, source: "the record's own status word: a lease has a term, a protectorate and a mandate are held in trust, an occupation is provisional — against annexation, breakaway, frozen, disputed and contested, which claim permanence or claim nothing (src/engine/termination.js:REVERSIBLE). Not one of the package's four covariates and the strongest thing in the template: alone it scores holdout AUC 0.736 against the package's own four at 0.513" }
      - { var: contest_at_war, transform: none, prior: 0.5 }    # contests are settled by the wars that end, not in quiet decades
    candidates:                        # measured 2026-09-07. Base = the three fitted covariates above: n=1,577 / 22 settlements, holdout (>= 1946) AUC 0.646.
      - { id: contest_allied, var: contest_allied, transform: none, prior: 0.5, hypothesis: "the package's treaty/pact channel: a defence pact between the holder and a claimant is the instrument a settlement is written in", evidence: "measured 2026-09-07, NOT promoted. Holdout 0.646 -> 0.594, fitted +0.50 (the predicted sign, and a loss out of sample)." }
      - { id: holder_great_power, var: holder_great_power, transform: none, prior: -0.3, hypothesis: "a great power holds on", evidence: "measured 2026-09-07, NOT promoted. Holdout 0.646 -> 0.597, fitted -0.70; with contest_allied in as well (the package's own four plus contest_reversible) 0.646 -> 0.571. The sign is the predicted one and the post-1945 half of the sample is decolonisation, where the great-power holder is precisely the one that lets go — the term is fitted on an era in which it means the opposite of what it means in the test half." }
      - { id: holder_presence, var: holder_presence, transform: z, prior: 0.3, hypothesis: "operator/presence: a great-power station on the holder's own territory is the guarantee a settlement is written under (src/engine/presence.js:hostLevel)", evidence: "measured 2026-09-07, NOT promoted. Holdout 0.646 -> 0.503 and holdout exp/obs 0.71 -> 3.97 — the worst single term measured in this package. Against the package's own four covariates alone (before contest_reversible) it gave 0.513 -> 0.417 and 1.42 -> 6.04, the same verdict from a different base." }
    sources: ["hand records: data/territories.yaml dated history, 57 territory records 1871-2026", "Huth 1996 (standing territorial disputes)"]
    notes: "Sample: 1,584 unsettled territory-years carrying 22 settlements 1871-2025. `settled` is the only resolved status: `annexed` is a change of holder and the records show it cycling (one record is annexed three times before it is settled once), so treating it as a resolution would score a conquest as an ending. This is the package's `contested_active` template widened, and the widening is forced: the literal sample — territory-years with status `contested_active` — is 21 rows and 0 endings, because that status only appears on live 2014-2026 records."

  - id: wave_attain
    label: An actor reaches sovereign production in a capability wave
    unit: actor-wave-year              # operator/capability-waves (package 12); rows built by src/engine/waves.js
    event: wave_attain                 # the label is the dated sovereign_by history in data/waves.yaml, not data/events.json
    window: [1825, 2024]
    lead: 1                            # a state-transition template: this year's state, next year's attainment
    holdout_split: 1945                # the era split; test (a) in docs/escalations.md cuts by WAVE COHORT instead
    sample:
      min_industry: 0.0003             # the at-risk floor, src/engine/waves.js WAVES.min_industry — see notes
    covariates:
      - { var: wave_clock, transform: z, prior: 0.3, source: "estimate: a follower's hazard rises with the years since a technology existed — cost falls, tooling and trained people diffuse. log1p(years since introduced), so the rise is fast early and flat late" }
      - { var: wave_industry, transform: z, prior: 0.8, source: "Gerschenkron 1962 (relative backwardness) read forwards: the industrial base is what a state builds a new capability ON. log10 share of world industrial output (panel industry_share)" }
      - { var: log_gdp_pc, transform: z, prior: 0.4, source: "estimate: income buys the tooling and the engineers; the standard capability covariate everywhere else in this file" }
      - { var: wave_access, transform: none, prior: 0.4, source: "estimate: a defence pact with an actor already sovereign IN THIS WAVE — the licence-production and technology-transfer channel (Gholz & Sapolsky 1999 on alliance production sharing)" }
      - { var: wave_diffusion, transform: z, prior: 1.0, source: "estimate: the share of live actors already sovereign; the epidemic term of a diffusion model (Rogers 1962), and the term that makes late waves spread faster than early ones" }
      - { var: at_war, transform: none, prior: 0.3, source: "estimate: war is the demand shock that funds a domestic line — the file's own clearest case is an actor attaining an armed-UAV capability in 2023 under invasion" }
      - { var: great_power, transform: none, prior: 0.5, source: "estimate: great powers try to make everything themselves; the flag is frozen at as-of in the engine like every other use of it" }
    # The SECOND half of operator/capability-waves, and it is a candidate, not a promotion. `capability.status: active`
    # (or WAVE_CAPABILITY=1) makes the dyadic capability ratio and the termination layer read the wave-weighted share
    # in place of CINC. Publishing the share as a forecast and letting it decide a war are two different claims, and
    # only the first is on. The backtest is why: see `rejected` below.
    capability:
      status: candidate
      switch: WAVE_CAPABILITY=1
      reads: [cap_ratio, war_end, contest_settle, record_reopen]
    rejected:                          # tested 2026-09-08 (operator/capability-waves); kept so the loop does not re-propose them unchanged
      - { id: wave_capability_substitution, evidence: "Letting the wave-weighted share REPLACE cinc in the dyadic capability ratio (and in the termination layer's capability read). It passes the package's own outcome test and fails the model's promotion rule, which is the backtest. Package test (b), AUC of 'the stronger side prevails' over GML MID 2.2.1 decisive outcomes with capability read the year before the dispute: wave_share 0.603 against cinc 0.512 over 1900-2001 (n=715) and 0.612 against 0.517 over 1946-2001 (n=322) — both bars cleared, the post-1945 one by 0.095 against a required 0.02. The 1870-2010 +20y 100-run event backtest with WAVE_CAPABILITY=1 against the same run without it: mid_force AUC 0.810 -> 0.773 and skill +0.113 -> +0.074, mid_war AUC 0.780 -> 0.688 and skill +0.032 -> -0.016, interstate_onset AUC 0.889 -> 0.812. It is BETTER on everything that reads capability through the termination layer — record_reopen skill -0.300 -> -0.102, corridor_status +0.036 -> +0.085, chokepoint_status +0.037 -> +0.055, autocratic_closure -0.058 -> -0.052 — and worse on every dyadic template, which is where the ratio does its work. The diagnosis is in test (b)'s own decomposition: the raw industrial share alone scores 0.628 after 1945, ABOVE the wave portfolio built on it (0.612), so the mass and displacement weights add nothing over their own input on that test and the dyadic AUC they cost is real. The wave index beats CINC and loses to the industrial share it is made of. Re-propose with the mass coefficients fitted rather than hand-typed (the obvious form: mass as a per-wave coefficient estimated on dispute outcomes, which needs a wave-level outcome sample this model does not have), or with the ratio reading a blend rather than a swap. Reproduce with WAVE_CAPABILITY=1 on scripts/backtest.mjs; both runs are committed as scores/backtest-1870-2010-h20-all.json and scores/backtest-1870-2010-h20-all-abl-wave_capability_1.json." }
    sources: ["Rogers, Diffusion of Innovations (1962)", "Gerschenkron, Economic Backwardness in Historical Perspective (1962)", "Bairoch, International Industrialization Levels 1750-1980 (1982)", "data/waves.yaml sovereign_by (dated, sourced per entry from 1900)"]
    notes: "The attainment half of operator/capability-waves. AT-RISK FLOOR: the sample is the actor-wave-years where the actor holds at least 0.03% of world industrial output, which stands in for the wave ladder's level I (nothing in the data says who IMPORTS a technology). Without it the sample is 167,506 rows carrying 175 attainments (0.10%), nine tenths of them states that were never candidates; with it, 65,879 rows and 153 attainments (0.23%). The 22 attainments below the floor are structural misses, counted by scripts/analysis/waves.mjs and not hidden. Unit: the actor-wave-year while the wave exists and the actor is not yet sovereign; the actor leaves the sample the year it attains, and a wave it never attains inside the window is right-censored by the window rather than scored as a permanent non-attainer. Rows are built by src/engine/waves.js attainRows() and read from there by scripts/lib/fit.mjs AND by the engine's forward step, so the sample fitted and the sample simulated are one object. The test that decides it is test (a) in docs/escalations.md: fit on the waves introduced before 1900 and predict the 20th-century ones."

  - id: weaponization
    label: Nuclear latency to weapon
    unit: actor-year
    event: nuclear
    event_filter: { status: weapon }
    window: [1945, 2026]
    sample: latent_only                                            # only actor-years with latent capability
    covariates:
      - { var: mid_force, transform: win5, prior: 0.8 }            # security threat
      - { var: nuclear_ally, transform: none, prior: -1.2 }        # defence pact with a nuclear state substitutes
      - { var: log_gdp_pc, transform: z, prior: 0.3 }
      - { var: regime, transform: cat, prior: { 0: 0.3, 1: 0.2, 2: 0, 3: -0.3 } }
      - { var: struck_program, transform: win5, prior: 0.5 }       # Osirak/Al Kibar/2025: ambiguous sign — the whole Iran argument
    sources: ["Jo & Gartzke 2007", "Singh & Way 2004", "Fuhrmann & Tkach 2015"]
    notes: "n ≈ 10 weaponizations over ~600 latent actor-years. Fit is a prior update, not a regression; report the posterior rate with its interval."

  - id: chokepoint_status
    label: Chokepoint status or control transition
    unit: chokepoint-year
    event: chokepoint
    window: [1869, 2025]               # era-1945-1991-r2/corridors-1: was [1869, 1945]. The window is a claim about where the hand
                                       # record layer is complete, and the 1946-1991 half of it landed in this turn
                                       # (data/corridors.yaml: the Berlin access corridors, the Straits of Tiran, the
                                       # Florida Straits, Tazara and the southern-African set, the Soviet energy set,
                                       # and the dated decolonisation control transfers on eight records that still
                                       # named a departed colonial power in 1980). Measured before reopening, exactly as
                                       # era-1914-1945-r2/statistics-5 requires, and on the label rate the fitter itself
                                       # sees rather than on a hand count: 4.73% over 825 post-1945 chokepoint-years
                                       # against 5.19% over the 1,080 coded ones, inside the factor of 1.5 that test
                                       # names. corridor_status and record_reopen did NOT pass the same gate and their
                                       # windows stayed at 1945 — the numbers are on those two templates.
                                       # era-1991-2026-r2/corridors-1, 3, 6: the 1992-2025 half was coded in that turn
                                       # (Bosphorus 2022-23, Suez 2015/2021, Hormuz 2019/2024, Panama 2016/2023-24,
                                       # Malacca 2004-06, Taiwan 2022/2024, Tiran 2017, and a new kerch_strait record)
                                       # and twenty dead records were given `exists_until`. Re-measured on the same
                                       # gate BEFORE moving anything: 3.27% over 581 modern chokepoint-years against
                                       # 5.11% over the 1,859 coded ones, a ratio of 0.64 against the 0.67 floor. The
                                       # entries closed a third of the gap (0.56 -> 0.64) and did not close it, so
                                       # THIS WINDOW DOES NOT MOVE. Nine of the eighteen records have no 1992-2025
                                       # transition and they are genuinely quiet straits (Gibraltar, the Danish
                                       # Straits, Kiel, Dover, Magellan, Sunda, Corinth, the Florida Straits), not
                                       # missing history — so what closes the rest of the gap is a modern chokepoint
                                       # the layer does not have, not more rows on these. corridor_status DID pass at
                                       # 0.74 and moved to 2025; the numbers are on that template.
                                       # era-modern-2000-2025/corridors-1, engine-6: THE WINDOW MOVES TO 2025, on the
                                       # same gate re-measured after this turn coded the three modern transitions the
                                       # last turn's list called quiet straits and was wrong about — `corinth_canal`
                                       # shut by a landslide 4 Jan 2021 and fully reopened 5 Jul 2023 (two closures,
                                       # two reopenings), `kiel` shut to large vessels by the large-lock failure of
                                       # 5 Mar 2013, and `bosphorus` contested by the unilateral traffic regulations
                                       # of 1 Jul 1994 until the revised rules of Nov 1998. On
                                       # the fitter's own rows: 4.13% over 581 modern chokepoint-years against 5.11%
                                       # over the 1,859 coded ones, a ratio of 0.81 against the 0.67 floor, where the
                                       # same measurement gave 0.64 before these rows. Recorded because the pooled
                                       # ratio hides a step (era-modern-2000-2025/statistics-4): per decade the modern
                                       # rate is 1.92% (1992-2000), 1.76% (2001-2010) and 7.06% (2011-2025), so the
                                       # 1990s and 2000s are still coded at a third of the historical rate and the
                                       # as-of-2000 row is scored on a decade whose deficit is measured, not assumed.
                                       # What kept the window shut was worse: chokepoint_status reported n=0 at as-of
                                       # 1950, 1960, 1970, 1980, 1990, 2000 and 2010 alike, so the modern-risk template
                                       # the model exists for had never been graded out of sample at any origin.
    states: [open, contested, closed]
    covariates:
      - { var: adjacent_war, transform: none, prior: 2.5 }         # a transit state (or the controller) at war this year
      - { var: adjacent_intrastate, transform: none, prior: 1.0, default_outside: { window: [1946, 2026], value: 0, source: "UCDP/PRIO ACD covers 1946+; the panel has no intrastate column at all before it, so every pre-1946 record-year enters this covariate as an imputed 0. Imputation, not an observation" } }
      - { var: guarantor_withdrawal, transform: none, prior: 0.5, default_outside: { window: [1870, 2026], value: 0, source: "data/presence.yaml claims coverage 1870-2026 (its own header); the 1869 record-years take a declared structural zero rather than dropping the row" }, lifecycle: { phase: active, promoted: 2026-09-07, reason: "operator/presence. The guarantor's weight around the record fell inside the last 3 years — a great power removing forces from a strait's neighbourhood. Built once in src/engine/presence.js (guarantorLevels / guarantorFall) and read by scripts/lib/fit.mjs and src/engine/core.js through corridorFeatures from the same code, so the fit and the simulation are one construction. Ablation at five splits (holdout AUC / Brier, base -> with the term), chokepoint_status: 1940 0.692/0.0278 -> 0.660/0.0278, 1946 0.580/0.0212 -> 0.621/0.0214, 1960 0.572/0.0146 -> 0.597/0.0148, 1970 (the split the package asks for) 0.501/0.0148 -> 0.624/0.0151, 1980 0.742/0.0143 -> 0.714/0.0145; corridor_status: 1940 0.832/0.0078 -> 0.852/0.0078, 1946 0.683/0.0034 -> 0.774/0.0035 (the >= 1970 holdout the package asks for is EMPTY on corridors — 2 of the 37 transitions are after 1970 and fit.mjs reports `insufficient events`). Promoted on the AUC at the package's own splits and on the falsifiers, against a Brier that is flat to 0.0003 worse at every split: the term discriminates and does not calibrate, and the base model already over-predicts (holdout exp/obs 2.22 on chokepoints). It loses AUC at two of the five chokepoint splits (1940 and 1980) and that is recorded here rather than dropped. Falsifiers, node scripts/analysis/presence.mjs: the canal 1956 fires (guarantor weight 10 -> 7 in the transition year, where the MAXIMUM level does not move at all because a fleet 1,400 km away is still there — which is why the term is a per-power sum of station levels and not the package's stated max); the 1967 and 1971-73 withdrawals fire; the 2026 state fires on the Gulf record. What the backtest cannot see: the scoreable window for these templates is 1869-1945 (COVERAGE in scripts/backtest.mjs) and the term is on 26 of 620 pre-1946 chokepoint-years carrying 2 of 29 transitions and 105 of 1,114 pre-1946 corridor-years carrying 9 of 31, against 179 of 720 and 5 of 10 after 1945, so the pooled 1870-2010 backtest moves by +0.005 of skill on chokepoint_status and -0.004 on corridor_status and by stream noise elsewhere. (Checked 2026-09-07: these replace the 12 of ~480 with 0 transitions first written here, which were the 1900-1939 rows only and understated the term's reach into the scored window; the correct counts are the ones in the commit message, docs/escalations.md and docs/refine-log.md, and they are reproduced by scripts/analysis/presence.mjs section 3.) This promotion rests on the one-year holdout and the falsifiers, not on the rolling-origin score. Checked 2026-09-07: the construction the package's own text specifies - a per-power MAX station level instead of the sum - was re-measured at the same splits and is BETTER on the holdout, chokepoint 1940 0.717/0.0283, 1946 0.612/0.0213, 1960 0.614/0.0146, 1970 0.655/0.0149, 1980 0.735/0.0144 and corridor 1940 0.859/0.0077, 1946 0.802/0.0033, which is a gain at 6 of the 7 measurable splits on AUC and at 6 of 7 on Brier, fitted +0.49 and +0.96. It is not adopted because under it neither of the package's named checks fires at all: Suez 1956 stays at guarantor 3 with withdrawal 0 (the Mediterranean fleet 1,400 km away holds the maximum up while the garrison on the record's own transit state leaves) and the 2026 Gulf direction check stays at 0. The sum is chosen on the mechanism and the falsifiers against a holdout that prefers the max, and that trade is the record rather than a claim that the sum measured better." } }
    # nonstate_littoral: a Houthi-type armed actor on the shore (prior 1.5) — no panel column and no dated source; 2023-26 Bab al-Mandab is the case it exists for.
    candidates:                      # operator/presence, holdout >= 1970 as the package asks
      - { id: guarantor_presence, var: guarantor_presence, transform: z, prior: -0.5, holdout_split: 1970, default_outside: { window: [1870, 2026], value: 0, source: "data/presence.yaml claims coverage 1870-2026 (its own header); the 1869 record-years take a declared structural zero rather than dropping" }, hypothesis: "the weight of the strongest great-power guarantor within 1,500 km of the record or on one of its transit states (src/engine/presence.js). A guarded strait closes less often", evidence: "measured 2026-09-07 (operator/presence), NOT promoted: the guarantor's own weight adds nothing and its sign flips. Ablation at five splits (holdout AUC / Brier, base -> with the term): 1940 0.692/0.0278 -> 0.686/0.0280, 1946 0.580/0.0212 -> 0.560/0.0222, 1960 0.572/0.0146 -> 0.541/0.0149, 1970 0.501/0.0148 -> 0.477/0.0150, 1980 0.742/0.0143 -> 0.581/0.0146; fitted +0.07 per sd on chokepoint_status and -0.05 on corridor_status against a prior of -0.5 (checked 2026-09-07; the +0.30 first written here does not reproduce on either template). Diagnosis: 81 of the 90 chokepoint-years of the 1940s-1960s are guarded, so the level is nearly a constant, and what variance it has is cross-sectional between records rather than within one. The withdrawal term below carries the mechanism; the level does not. Re-propose relative to the record's own history (a guarantor weight z-scored within the record) rather than across the layer. These numbers are scored against a base WITHOUT guarantor_withdrawal, which is what the base was when they were measured; scripts/analysis/presence.mjs section 4 now prints the same ablation against the promoted base (chokepoint 1940 0.660 -> 0.688, 1946 0.621 -> 0.564, 1960 0.597 -> 0.559, 1970 0.624 -> 0.515, 1980 0.714 -> 0.612), which is the same verdict from a different starting point (checked 2026-09-07)." }
      - { id: record_building, var: record_building, transform: none, prior: 1.0, hypothesis: "as on corridor_status: a record still being built transitions because construction has stages, one in service because somebody seizes or shuts it", evidence: "measured 2026-09-07 (era-1870-1914-r2/corridors-2), NOT promoted on this template. Only two chokepoint records are ever under construction — panama (1881-1904) and corinth_canal (1882-1893) — so the term is near-constant here and it shows: at the ablation split this template forces (1970, from the guarantor_presence candidate) holdout AUC 0.659 -> 0.659 and Brier 0.0097 -> 0.0097, with holdout exp/obs 2.72 -> 2.57 and the term fitted +1.69, the sign the hypothesis predicts. Calibration only, and a thousandth of it. Promoted on corridor_status, where 15 of 45 in-sample records pass through a construction sequence." }
    missing: [nonstate_littoral]
    sources: ["hand records: data/corridors.yaml dated history, 9 chokepoint records 1869-2026"]
    notes: "Unit: one row per record per year, built by scripts/lib/fit.mjs:buildRecordRows from data/corridors.yaml. A record enters the sample in the year its dated history opens, EXCEPT where that first row is already an impairment (closed/contested), which is only observable if the thing existed unimpaired before — a strait is not built, so those records run from the window's first year at the kind's base status (open). Label: the record's status OR controller changed during the year. Control is half of what the layer is for (Suez 1882 and 1956 are control changes at constant status) and a change that reverses inside the year is still a transition in it. Covariates are contemporaneous, and the engine draws this layer last in the step, after the war draws, so the at_war a transit state acquires this year is visible on both sides. Transit states are dated: a transit that is not a live actor is followed through the successor chain and the controller counts as a transit, which is what keeps Suez scorable 1883-1921 (EGY out of the system under occupation, held by GBR) and Berlin-Baghdad scorable after 1922 (OTTOMAN -> TUR)."

  - id: corridor_status
    label: Corridor status or control transition (advance, cut, or change of hands)
    unit: corridor-year
    event: corridor
    window: [1869, 2025]               # era-1991-2026-r2/corridors-1, 4, 5, 6, 7: OPENED from [1869, 1945] on the same
                                       # gate that kept it shut twice. What changed is the record layer, not the rule.
                                       # This turn added the modern transit corridors (the three Ukrainian gas lines'
                                       # 2006/2009/2014/2022/2025 rows, Druzhba 2019-2025, Nord Stream's two distinct
                                       # closure mechanisms, yamal_europe, blue_stream, turkstream, the Black Sea grain
                                       # corridor, the Lachin corridor, and a modern subsea class — Balticconnector,
                                       # EstLink, C-Lion1, the Red Sea bundle, the Matsu cables), gave INSTC, IMEC, the
                                       # Development Road, Zangezur, the Gulf landbridge and the China-Iran-Turkey rail
                                       # their real dated instruments instead of a 2026 snapshot row, and retired twenty
                                       # records whose thing had ended (`exists_until`, docs/schema.md) so they stopped
                                       # supplying non-event years for eighty years each. Measured after all of it and
                                       # before moving the window: 3.52% over 1,107 modern corridor-years against 4.77%
                                       # over the 1,529 coded ones — a ratio of 0.74, inside the [0.67, 1.5] band the
                                       # era-1914-1945-r2/statistics-5 test names, against 0.20 before this turn.
                                       # record_reopen does NOT move with it: measured separately it is 6.87% over 131
                                       # modern impaired record-years against 27.52% coded, a ratio of 0.25, and the
                                       # reason is real rather than missing data (Benguela 1975-2014, Kerch and Yamal
                                       # closed since 2022, the Ukrainian transit lines since 2025 — long modern
                                       # closures that are right-censored, not uncoded). The numbers below are the
                                       # 1945 decision this replaces, kept so the two measurements can be compared.
                                       # era-1945-1991-r2/corridors-1: NOT reopened, and this is the measurement that decided it.
                                       # The 1946-1991 record layer landed in this turn (see chokepoint_status), and on
                                       # the CHOKEPOINT half it passes the era-1914-1945-r2/statistics-5 gate: the label
                                       # rate the fitter actually sees is 4.73% over 825 post-1945 chokepoint-years
                                       # against 5.19% over the 1,080 coded ones, so that window moved to 1991. The
                                       # corridor half does not: 1.63% over 1,781 post-1945 corridor-years against 4.32%
                                       # over the 1,690 coded ones, a factor of 2.6 — reopening it would count un-coded
                                       # years as observed non-events and halve the base rate, which is precisely the
                                       # failure era-1914-1945-r2/statistics-5 recorded. (The adversary's own script,
                                       # which dates each record from its first history row rather than from
                                       # corridorFirstYear, reads 1.68% against 1.37% and would pass; the two
                                       # denominators differ and the fitter's is the one that biases the coefficients.)
                                       # What would close the gap is not more entries: 29 of the 46 corridor records
                                       # have no post-1945 transition and roughly a dozen of those are records that
                                       # genuinely stopped being corridors (the submarine telegraph cables superseded by
                                       # radio, the Hejaz railway abandoned in 1917, Madeira-Mamore closed in 1972) and
                                       # are scored as live at-risk record-years for eighty years each. The next step is
                                       # a dated `retired:` on a record, not more history rows — docs/refine-log.md.
    covariates:
      - { var: transit_at_war_any, transform: none, prior: 1.5, source: "prior restated 2026-09-07 with the label (era-1914-1945/corridors-7): it was -2.0 for 'a corridor does not advance while a transit state is at war', but the fitted label is any status or control transition, and war is the modal cause of one — a corridor is cut, captured, or completed under military priority. Magnitude below the chokepoint template's 2.5: a land corridor has more of its length away from the front" }
      - { var: sponsor_great_power, transform: none, prior: 0.8 }  # sponsor, or the controller where no sponsor is declared
      - { var: guarantor_withdrawal, transform: none, prior: 0.5, default_outside: { window: [1870, 2026], value: 0, source: "as on chokepoint_status" }, lifecycle: { phase: active, promoted: 2026-09-07, reason: "operator/presence; the same construction and the same promotion as on chokepoint_status, where the full evidence block lives. On this template the ablation gives holdout AUC 0.832 -> 0.852 at split 1940 and 0.683 -> 0.774 at 1946, Brier 0.0078 -> 0.0078 and 0.0034 -> 0.0035; the >= 1970 holdout the package asks for is empty (2 of 37 transitions)." } }
      - { var: record_building, transform: none, prior: 1.0, source: "derived from the record's own status word in src/engine/core.js:corridorFeatures (status in {planned, building}), the way contest_settle reads contest_reversible; no panel column", lifecycle: { phase: active, promoted: 2026-09-07, reason: "era-1870-1914-r2/corridors-2. The eleven construction sequences this turn added to the one-row stubs (gotthard 1869 planned / 1872 building / 1882 built, canadian_pacific, trans_caspian, uganda, cape_bulawayo, simplon, arica_la_paz, madeira_mamore, orenburg_tashkent, sind_pishin_chaman, corinth_canal) raised the template's event count from 37 to 56 and its base rate from 1.18% to 1.37% — and made the over-prediction visible: a hazard fitted over a mixture of two processes puts a construction-stage rate on records that are finished and in service. Ablation (holdout AUC / Brier / exp-obs, base -> with the term) at four splits: 1910 0.813 / 0.0113 / 6.39 -> 0.867 / 0.0092 / 3.68; 1920 0.817 / 0.0081 / 5.42 -> 0.833 / 0.0072 / 3.02; 1930 0.846 / 0.0072 / 5.16 -> 0.846 / 0.0066 / 2.99; 1946 0.830 / 0.0031 / 12.43 -> 0.830 / 0.0027 / 8.06. Fitted +2.59 against a prior of +1.0 — AUC never falls, Brier improves at all four, and the calibration gain is between a third and a half of the over-prediction at every split. It does not close the gap: exp/obs is still 3.0 at the splits inside the scored window, and the residual is the same two-process problem on the in-service half (a corridor changes hands in a war, and the war term is a transit-state flag). It is promoted on the calibration and recorded as partial." } }
    candidates:                      # operator/presence, same construction as on chokepoint_status. The package asks
                                     # for a holdout >= 1970; the corridor record layer has 2 transitions after 1970
                                     # and the test is empty there (fit.mjs reports `insufficient events`), so these
                                     # are scored at the template's own 1946 split, which holds 6 of the 37.
      - { id: guarantor_presence, var: guarantor_presence, transform: z, prior: -0.5, default_outside: { window: [1870, 2026], value: 0, source: "as on chokepoint_status" }, hypothesis: "a guarded corridor changes hands less often", evidence: "measured 2026-09-07, NOT promoted; one measurement covers both record templates and the numbers are on the chokepoint_status candidate entry" }
    rejected:                        # tested 2026-09-07 (era-1914-1945/corridors-7)
      - { id: transit_gdp_growth_mean, evidence: "The declared covariate (mean gdp_growth over the live transit states, z-scored, prior 0.4 for 'growth advances a corridor') is not missing at random and it buys its fit by deleting the hardest cases from the sample. Requiring it drops 168 of 3,143 corridor-years, and those 168 carry 5 of the 37 transitions — a 2.98% event rate against 1.08% in the rows it keeps, because Maddison's gaps ARE the war years (no China 1939-1950) and the record layer's transitions are the war years. The five it removes are hejaz_railway 1908 and 1917, trans_iranian_railway 1941, kirkuk_haifa_pipeline 1948, and burma_road 1940 — the last of them one of the three falsifiers this package was written around, so with the covariate in, the Burma Road closure is not a miss, it is not in the sample at all. On the same 2,975 rows the covariate is worth in-sample AUC 0.848 -> 0.870; on the full 3,143 rows the model without it scores 0.813, and the difference between 0.870 and 0.813 is mostly the selection, not the signal. Fitted -0.57 per sd (transitions happen when growth is bad), against a prior written for the opposite story. Re-propose when the growth series has no war-year holes, or with a stated imputation for a transit state with no growth observation." }
    sources: ["hand records: data/corridors.yaml dated history, 38 corridor records 1869-2026"]
    notes: "Same unit and label construction as chokepoint_status (see its notes). 3,143 corridor-years / 37 transitions over 1869-2025, every record-year in the sample: no covariate here can drop a row (see rejected: transit_gdp_growth_mean, which could)."

# ---------------------------------------------------------------------------------------------------------------
# Retired templates (2026-09-07 cleanup): kept verbatim for the record, not loaded by fit-hazards / backtest / engine.
# autocratization_onset, democratization_onset: V-Dem ERT episodes, superseded by the RoW category-step templates.
# autocratize_step: superseded by liberal_erosion + autocratic_closure. sovereign_default: no event source yet (see docs/data-catalogue.md).
retired:
  - id: liberal_erosion
    status: monitored                  # era-modern-2000-2025/statistics-2, engine-1: MERGED INTO autocratic_closure and retired from the
                                       # simulated set on 2026-09-08. It is kept here whole, with its numbers, because the
                                       # mechanism is real and the reason for retiring it is a sample-size fact that a later
                                       # decade can overturn. The fact: 29 of its 31 `autocratize from=3` labels fall in
                                       # 2010-2025, so the fitter's events>=5 gate refuses it at ALL 15 rolling-origin
                                       # as-of years (n=1,417 / 1 event at 2000; n=1,830 / 2 at 2010), while
                                       # `actorHazards` drops any template whose fit is not `fitted`. The consequence was
                                       # structural, not cosmetic: `autocratic_closure` declared regime_max: 2, so regime 3
                                       # had no downward hazard at all in any backtested world and the engine ratcheted
                                       # states into liberal democracy — 44.9 regime-3 actors at y+1 to 69.0 at y+20 from
                                       # as-of 2010, against an observed 2025 count of 31. The 3->2 step is now a label on
                                       # autocratic_closure (sample regime_min 1, regime_max 3, with `regime` as a cat
                                       # covariate), where it is estimated at every as-of year: n 7,396 -> 9,852, events
                                       # 313 -> 343, regime=3 fitted -0.56, in-sample AUC 0.648 -> 0.683 and the base
                                       # ablation's holdout AUC 0.574 -> 0.601. Re-promote this template as the finer
                                       # split when its own labels support a holdout — the test is in the unvalidated_note
                                       # below and in scores/backtest-1990-2015-h10-all.json.
    lead: 1
    label: Liberal democracy erodes to electoral democracy (3→2)
    unit: actor-year
    event: regime_change
    event_filter: { direction: autocratize, from: 3, cause: null }   # NOT filtered on `durable`, though 8 of its 29 modern labels are flaps (CAN 2020 and 2022, LVA 2013 and 2016, SVN 2021 and 2023, SVK 2019 and 2023): see the rejected: block on democratize_step
    window: [1900, 2024]                # NOT extended to 1816 (era-1870-1914-r2/data-3): 48 rows and 0 erosion events at labels <= 1900. Same reason as democratic_deepening
    holdout_split: 1990
    sample: { regime_min: 3, exclude_flag: occupied }   # era-1914-1945-r2/statistics-3: a state under foreign occupation is not at risk of a DOMESTIC transition and its label is already forced to 0 by event_filter — censor the row out of the denominator instead of scoring it as an observed non-event
    covariates:
      - { var: log_gdp_pc, transform: z, prior: -0.3 }
      - { var: gdp_growth, transform: z, prior: -0.3 }
      - { var: at_war, transform: lag1, prior: 0.3 }
      - { var: leader_exit_recent, transform: win5, prior: 0.3, default_outside: { window: [1946, 2021], value: 0, source: "REIGN leader exits start 1950; pre-1946 this is an imputed 0, not an observation" } }
    candidates:
      - { id: info_access, var: info_access, transform: z, prior: 0, hypothesis: "information access raises erosion risk in rich democracies (polarisation channel) — the inverse of its coup effect" }
      - { id: hegemon_x_client, var: hegemon_x_client, transform: none, prior: 0, hypothesis: "user: the hegemon's clients track the hegemon's regime score (cross-sectional form)" }
      - { id: pact_usa, var: pact_usa, transform: none, prior: 0, hypothesis: "US allies track the US" }
      - { id: urban_share, var: urban_share, transform: z, prior: 0, hypothesis: "control" }
    sources: ["Maerz et al. 2024 (ERT)", "V-Dem Democracy Report 2025"]
    lifecycle: { phase: unvalidated, promoted: 2026-09-06, reason: "bucket C: 3→2 steps are a European/Anglosphere erosion process distinct from coups", unvalidated_note: "era-1991-2026-r2/statistics-8, marked 2026-09-07: this template has NEVER been scored out of sample. It reports n=0 at every one of the 15 as-of years of the rolling-origin backtest with the reason `no fit at as-of: events=1 / 2 in years <= as-of` — the fitter's events>=5 gate is never met on labels available at any backtested origin, because 29 of the 35 `autocratize from=3` events fall in 2010-2025 (12 in the 2010s, 17 in the 2020s) and only 6 before. So the single mechanism the 1991-2026 era exists to model has never been graded, and in every backtested world the engine runs it on the literature prior. Its full-sample fit is not reassuring either: z(log_gdp_pc) +0.047 against a -0.3 prior and z(gdp_growth) +0.138 against a -0.3 prior, both signs reversed, on n=2,408 / 30 events with no holdout that can test them. The shorter-horizon score file that would reach the events is scores/backtest-1990-2015-h10-all.json (`node scripts/backtest.mjs --from 1990 --to 2015 --step 5 --horizon 10 --universe all`), where as-of 2015 has 15 training labels and 17 in the 2016-2025 horizon; the phase moves back to `active` when that row carries a fit and an AUC. RUN 2026-09-07 and committed as scores/backtest-1990-2015-h10-all.json: as-of 1990, 1995, 2000, 2005 and 2010 still report `no fit at as-of` (1 or 2 events), and as-of 2015 gives the template its FIRST out-of-sample row ever — n=41, 26 at risk, predicted 0.5 against 17 observed erosions in 2016-2025, count_ratio 0.03, AUC 0.45 (auc_at_risk 0.61), Brier 0.406, flagged underpowered and kept out of pooled. A 34x under-prediction of the mechanism the era is about. It is not a calibration wobble: the two economic covariates carry the wrong sign, the template has never had a holdout, and eight of the era's labels are the V-Dem flaps the rejected durable_label_filter block measures. The template stays in the model because removing it would silence the mechanism entirely, and stays `unvalidated` because this number is what it is." }

  - id: autocratization_onset
    lead: 1                            # label = event in year+1; hazard from this year's state applies to the coming year
    status: monitored                  # fitted and backtested, not simulated: superseded by autocratize_step
    label: Autocratization episode begins
    unit: actor-year
    event: autocratization_onset
    window: [1900, 2024]
    holdout_split: 1990
    sample: { regime_min: 1 }          # closed autocracies can't autocratize further
    covariates:
      - { var: regime, transform: cat, prior: { 0: -0.5, 1: 0.6, 2: 0.4, 3: -0.6 } }   # partial regimes are least stable
      - { var: polyarchy, transform: z, prior: 0 }
      - { var: log_gdp_pc, transform: z, prior: -0.5 }
      - { var: gdp_growth, transform: z, prior: -0.3 }
      - { var: at_war, transform: lag1, prior: 0.3 }
      - { var: intrastate, transform: lag1, prior: 0.4, default_outside: { window: [1946, 2024], value: 0, source: "UCDP/PRIO ACD covers 1946-2024; outside it internal conflict is unobserved and imputed 0 so the template is estimable back to its window start. Imputation, not an observation — see docs/refine-log.md" } }
    sources: ["Maerz et al. 2024 (ERT)", "Przeworski et al. 2000", "Goldstone et al. 2010"]

  - id: democratization_onset
    lead: 1                            # label = event in year+1; hazard from this year's state applies to the coming year
    status: monitored                  # superseded by democratize_step (holdout AUC 0.47 vs 0.77)
    label: Democratization episode begins
    unit: actor-year
    event: democratization_onset
    window: [1900, 2024]
    holdout_split: 1990
    sample: { regime_max: 1 }          # at-risk set: autocracies
    covariates:
      - { var: regime, transform: cat, prior: { 0: 0, 1: 0.5, 2: 0.3, 3: -2 } }
      - { var: log_gdp_pc, transform: z, prior: 0.3 }
      - { var: gdp_growth, transform: z, prior: -0.3 }             # crises open windows
      - { var: at_war, transform: lag1, prior: 0.2 }
      - { var: leader_exit_recent, transform: win5, prior: 0.5 }
    sources: ["Boix & Stokes 2003", "Maerz et al. 2024 (ERT)", "Geddes, Wright & Frantz 2014"]

  - id: autocratize_step
    status: monitored                  # superseded by autocratic_closure, which since era-modern-2000-2025/statistics-2 carries the whole ordinal ladder down (regime 1-3) and absorbed liberal_erosion's 3->2 step
    lead: 1
    label: Regime category moves down (V-Dem RoW), any
    unit: actor-year
    event: regime_change
    event_filter: { direction: autocratize, cause: null }   # conquest/occupation steps excluded (see democratize_step)
    window: [1900, 2024]
    holdout_split: 1990
    sample: { regime_min: 1 }
    covariates:
      - { var: regime, transform: cat, prior: { 1: 0, 2: 0.3, 3: -0.8 } }
      - { var: log_gdp_pc, transform: z, prior: -0.5 }
      - { var: gdp_growth, transform: z, prior: -0.3 }
      - { var: at_war, transform: lag1, prior: 0.3 }
      - { var: intrastate, transform: lag1, prior: 0.4, default_outside: { window: [1946, 2024], value: 0, source: "UCDP/PRIO ACD covers 1946-2024; outside it internal conflict is unobserved and imputed 0 so the template is estimable back to its window start. Imputation, not an observation — see docs/refine-log.md" } }
    sources: ["Goldstone et al. 2010", "V-Dem RoW via OWID"]
    lifecycle: { phase: active, promoted: 2026-09-06, reason: "holdout AUC 0.74; NOTE under-predicts post-1990 autocratization 5× (exp/obs 0.21) — open era shock" }

  - id: sovereign_default
    label: Sovereign default or restructuring
    unit: actor-year
    event: default
    window: [1816, 2024]
    covariates:
      - { var: gdp_growth, transform: z, prior: -0.5 }
      - { var: at_war, transform: lag1, prior: 0.6 }
      - { var: regime_change, transform: win5, prior: 0.5 }
    missing: [external_debt_gdp, reserves_gdp, current_account, real_rate]   # Reinhart–Rogoff / BoC–BoE database not yet fetched
    sources: ["Manasse & Roubini 2005", "Reinhart & Rogoff 2009", "Bank of Canada–Bank of England sovereign default database"]
    status: candidate                                              # no events yet in events.json
