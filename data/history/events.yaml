# ---------------------------------------------------------------- occupation spans (turn era-1914-1945, added 2026-09-06)
# A state under foreign occupation is not making domestic politics. These spans do three things:
#   1. scripts/build-events.mjs stamps `cause: occupation` on a regime_change inside [floor(start), ceil(end)] and
#      `cause: imposed` on one in (ceil(end), imposed_until] — the restoration or the settlement written by the occupier;
#      the domestic regime templates filter both out (data/templates.yaml `event_filter: { cause: null }`).
#   2. scripts/build-panel.mjs nulls NMC capabilities and the dispute/alliance flags for the fully occupied years
#      (ceil(start)..floor(end)), so an occupied year is unknown rather than a peaceful non-event.
#   3. the occupied years are visible as data rather than as an unexplained hole in the series.
# `imposed_until` is the end of externally-written politics; where it is not a treaty date it is an estimate.
# First World War spans (turn era-1914-1945-r2, data/6). The layer began in 1936, so Belgium's 1914 collapse (3->0) and
# its 1919 restoration (0->1) were scored as domestic regime change while the identical 1940/1946 pair was correctly caused.
# `partial: true` marks an occupation of part of a state whose own government kept functioning on its own soil: the cause
# stamp applies (a regime step there is not domestic) but scripts/build-panel.mjs does not null the capability series,
# because the state was still raising and fielding one.
- { kind: occupation, actor: BEL, start: 1914.60, end: 1918.86, by: DEU, imposed_until: 1919.9, source: "invasion 4 Aug 1914, Antwerp falls 10 Oct 1914; the government sits at Le Havre and the army holds the Yser; liberation Nov 1918" }
- { kind: occupation, actor: LUX, start: 1914.60, end: 1918.86, by: DEU, imposed_until: 1919.9, source: "occupied 2 Aug 1914; German withdrawal Nov 1918" }
- { kind: occupation, actor: SRB, start: 1915.86, end: 1918.83, by: AUT_HUN, imposed_until: 1919.9, source: "Central Powers offensive Oct 1915, the retreat through Albania Nov-Dec 1915; Belgrade retaken 1 Nov 1918" }
- { kind: occupation, actor: ROU, start: 1916.95, end: 1918.86, by: DEU, imposed_until: 1919.9, partial: true, source: "Bucharest falls 6 Dec 1916; the government and army hold Moldavia from Iasi and fight at Marasesti Aug 1917; the Treaty of Bucharest 7 May 1918 is voided by the armistice 11 Nov 1918" }
- { kind: occupation, actor: ALB, start: 1916.00, end: 1920.00, by: AUT_HUN, imposed_until: 1921.9, source: "Austro-Hungarian and Italian occupation from Jan 1916; the Congress of Lushnje Jan 1920 and the Italian withdrawal from Vlore Aug 1920 restore an Albanian government" }
- { kind: occupation, actor: ETH, start: 1936.35, end: 1941.35, by: ITA, imposed_until: 1941.9, source: "Addis Ababa falls 5 May 1936, annexation 9 May 1936; liberated 5 May 1941" }
