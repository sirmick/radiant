# Declared exemptions and resolutions for the population/tpop build guard in scripts/build-panel.mjs.
#
# The panel carries two population series: `population` (OWID/HYDE, on the modern successor's borders) and `tpop`
# (CoW NMC, contemporaneous). They are two measurements of one quantity, so a live actor-year where they disagree by
# more than 30% in logs is a row that has joined two different states — the failure that put Austria's 4.5M and the
# Habsburg empire's 35.7M in the same 1870 row. The build FAILS on any such row that is not declared here.
#
# The first answer to a disagreement is a constituent set (`derived_series` in actors.yaml), which fixes the row
# instead of excusing it: that is what Austria-Hungary, the Ottoman Empire, Russia, Sweden-Norway, the United
# Kingdom of the Netherlands, Denmark's duchies, the Greek kingdom and the Romanian Old Kingdom now use. What is
# left here is what a constituent set cannot fix.
#
# spans: [[from, to)] years the declaration covers. prefer:
#   tpop        the modern-borders `population` is dropped for those years (the actor is bigger than its successor)
#   population  the NMC `tpop` is dropped (NMC is measuring something else, or is wrong)
#   none        a declared, unresolved disagreement: two independent estimates of the same territory, both kept.
#               Not a borders join — recording it is what keeps the guard hard for everything undeclared.

# ---- resolved: the actor is not its modern successor
- { id: VAT, spans: [[1816, 1861]], prefer: tpop, reason: "The 1816-1860 entity is the Papal States (CoW 327, tpop 3.16M in 1860); the id's OWID series is Vatican City, which is not a system member. The iso3c collision is documented in data/history/actors.yaml.", source: "CoW NMC 3.02 ccode 327" }
- { id: PAK, spans: [[1947, 1971]], prefer: tpop, reason: "CoW ccode 770 is Pakistan including the eastern wing until 1971 (110.0M in 1964); the OWID PAK series is modern Pakistan alone (50.8M), with the east in BGD. The contemporaneous series is the actor's.", source: "CoW NMC 3.02 ccode 770; Bangladesh independent 1971" }

# ---- resolved: an NMC data error
- { id: HTI, spans: [[2001, 2002]], prefer: population, reason: "NMC tpop for Haiti jumps 8,222 (2000) to 82,248 (2001) thousand — a misplaced decimal in the last year of the series, not a population.", source: "CoW NMC 3.02 ccode 41, rows 1997-2001" }

# ---- declared and unresolved: two independent estimates of the same territory
# CoW NMC's pre-census figures for states without a census, against HYDE/Gapminder back-projections. Neither is
# demonstrably wrong; both are kept and the row is flagged rather than silently reconciled.
- { id: GTM, spans: [[1868, 1911]], prefer: none, reason: "NMC 0.50M against HYDE 1.07M in 1868; the series converge by 1911.", source: "estimate dispute, no borders change" }
- { id: MAR, spans: [[1847, 1886]], prefer: none, reason: "NMC 1.59M against HYDE 2.83M in 1847 for the pre-protectorate sultanate.", source: "estimate dispute" }
- { id: HTI, spans: [[1859, 1896]], prefer: none, reason: "NMC runs about half of HYDE through the second half of the 19th century.", source: "estimate dispute" }
- { id: ETH, spans: [[1898, 1934]], prefer: none, reason: "NMC 7.10M against HYDE 17.68M in 1903; Ethiopia had no census before 1984 and the pre-war estimates range from 8M to 20M.", source: "estimate dispute" }
- { id: LBR, spans: [[1920, 1965]], prefer: none, reason: "NMC 0.22M against HYDE 0.58M in 1920: NMC appears to count the Americo-Liberian settled counties, HYDE the whole territory. Liberia's first census is 1962.", source: "estimate dispute" }
- { id: PRY, spans: [[1869, 1896]], prefer: none, reason: "The decade after the War of the Triple Alliance; the post-war population is disputed by a factor of two in the sources themselves.", source: "estimate dispute" }
- { id: PER, spans: [[1842, 1855]], prefer: none, reason: "NMC 1.85M against HYDE 3.09M in 1848, before the 1876 census.", source: "estimate dispute" }
- { id: AFG, spans: [[1919, 1924], [1982, 1984]], prefer: none, reason: "1920-23 is a pre-census estimate dispute; 1982-83 is the refugee exodus, which the two series time differently.", source: "estimate dispute" }
- { id: SAU, spans: [[1950, 2000]], prefer: none, reason: "NMC 3.20M against the UN's 1.70M in 1950; Saudi Arabia's own pre-1974 figures are administrative estimates that the UN series does not follow.", source: "estimate dispute" }
- { id: JOR, spans: [[1946, 1987]], prefer: none, reason: "NMC 1.09M against 0.35M in 1946 and about 1.4x through the 1980s; the NMC series appears to include the West Bank and the registered refugee population.", source: "estimate dispute" }
- { id: BTN, spans: [[1971, 2002]], prefer: none, reason: "NMC 2.12M against the UN's 0.60M in 2000 — Bhutan's own official figure before the 2005 census was around 1.9M and the UN series was revised down after it.", source: "estimate dispute" }
