- { id: LBN, spans: [[1988, 1994]], prefer: none, reason: "The end of the civil war; Lebanon has held no census since 1932 and the wartime series diverge.", source: "estimate dispute" }
- { id: ARE, spans: [[1999, 2002]], prefer: none, reason: "The migrant-labour population: NMC 2.44M against 3.72M in 2001.", source: "estimate dispute" }
- { id: SOM, spans: [[1992, 1994]], prefer: none, reason: "State collapse and famine; no administration was counting.", source: "estimate dispute" }
- { id: RWA, spans: [[1993, 1994]], prefer: none, reason: "The genocide year: the two series place the population loss in different years.", source: "estimate dispute" }
- { id: KWT, spans: [[1991, 1992]], prefer: none, reason: "The occupation and the expulsion of the Palestinian community; NMC 2.10M against 1.35M.", source: "estimate dispute" }
