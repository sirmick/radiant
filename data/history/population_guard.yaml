- { id: ERI, spans: [[1993, 2018]], prefer: none, reason: "Post-independence Eritrea has no census; NMC and the UN back-projections differ by 60%. NMC 7.0 extends the dispute and adds two discontinuities of its own inside it (6.13M in 2012 to 4.65M in 2013, 4.96M in 2016 to 3.15M in 2017) against a UN series running 3.0-3.2M.", source: "estimate dispute" }
