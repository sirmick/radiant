# ---- declared and unresolved: the actor's own definition is the problem (escalated, not excused)
- { id: VNM, spans: [[1954, 1976]], prefer: none, reason: "The model's VNM is CoW ccode 816, the DRV (19.94M in 1975), while every OWID-coded series joined to it is whole Vietnam (46.48M). The row is two states until the actor is split into DRV and RVN; dropping either series would lose the covariates or the war.", source: "CoW NMC 3.02 ccode 816/817" }
- { id: SRB, spans: [[1996, 2002]], prefer: none, reason: "NMC ccode 345 is FR Yugoslavia (10.64M in 2001: Serbia, Montenegro and Kosovo) while the OWID SRB series is Serbia without them (7.65M). Same problem as VNM: an actor whose extent changed inside its own life.", source: "CoW NMC 3.02 ccode 345" }

# ---- NMC 7.0 (2002-2022 extension block), added 2026-09-07 with operator / modern-capability
- { id: FSM, spans: [[2002, 2017]], prefer: population, reason: "NMC 7.0 carries 500-523 thousand for the Federated States of Micronesia across 2002-2016, between its own 117 (2001) and 109 (2017). No source puts Micronesia near half a million (2010 census 102,843); the block is a data error in the extension, not a population.", source: "CoW NMC 7.0 ccode 987, rows 2001-2017; FSM 2010 census" }
- { id: PAN, spans: [[1903, 1914]], prefer: none, reason: "NMC repeats a flat 450 thousand for every year of Panama's first decade against the OWID series' 0.27M; the 1911 census counted 336,742, so neither series is the census and the flat run is an interpolation.", source: "estimate dispute; Panama census 1911" }
- { id: CYP, spans: [[2001, 2002]], prefer: none, reason: "NMC 7.0 revises Cyprus 2001 from 786 to 701 thousand — the government-controlled area, which the 2001 census counted at 689,565 — while the OWID series is the whole island at 0.96M. Two different territories, one year.", source: "CoW NMC 7.0 ccode 352; Republic of Cyprus census 2001" }
