# Historical actor set — actors have lifecycles too.
# id: model id (ISO3 of the modern successor where one exists; else a historical tag).
# introduced/retired: years the entity exists as an actor in the model (system membership, roughly CoW/GW dates).
# successor: id inheriting territory/state on retirement. gw: Gleditsch-Ward code (CShapes, REIGN uses CoW ccode which mostly matches).
# owid: entity code in OWID/Maddison files (modern-borders series stand in for predecessors; flagged in `series_note`).
# great_power: years in the CoW major-power list (drives the 'major power' dyad term).
# Modern actors from data/actors.yaml are merged on top of this at build; entries here add lifecycle + codes.

- { id: GBR, name: United Kingdom, introduced: 1816, gw: 200, owid: GBR, great_power: [1816, null] }
- { id: FRA, name: France, introduced: 1816, gw: 220, owid: FRA, great_power: [1816, null] }
- { id: PRUSSIA, name: Prussia, introduced: 1816, retired: 1871, successor: DEU, gw: 255, owid: DEU, great_power: [1816, 1871], successor_borders_until: 1871, series_note: "OWID Germany series used; modern-borders population dropped (NMC tpop is the contemporaneous one)" }
- { id: DEU, name: Germany, spans: [[1871, 1946], [1949, null]], gw: 255, owid: DEU, great_power: [1871, 1945, 1991, null], notes: "1949-90 split: model keeps DEU as West Germany (gw 260) and adds DDR. CoW system membership ends with the surrender 8 May 1945 and resumes with the Federal Republic 1949 (CoW dates the FRG 1955; the model uses the Basic Law, 23 May 1949, because the state exists from then); the 1946-48 gap is Allied military government, not a state." }
- { id: DDR, name: East Germany, introduced: 1949, retired: 1990, successor: DEU, gw: 265, owid: null }
