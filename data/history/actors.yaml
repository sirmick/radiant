# Historical actor set — actors have lifecycles too.
# id: model id (ISO3 of the modern successor where one exists; else a historical tag).
# introduced/retired: years the entity exists as an actor in the model (system membership, roughly CoW/GW dates).
# successor: id inheriting territory/state on retirement. gw: Gleditsch-Ward code (CShapes, REIGN uses CoW ccode which mostly matches).
# owid: entity code in OWID/Maddison files (modern-borders series stand in for predecessors; flagged in `series_note`).
# great_power: years in the CoW major-power list (drives the 'major power' dyad term).
# Modern actors from data/actors.yaml are merged on top of this at build; entries here add lifecycle + codes.

