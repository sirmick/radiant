# Historical actor set — actors have lifecycles too.
# id: model id (ISO3 of the modern successor where one exists; else a historical tag).
# introduced/retired: years the entity exists as an actor in the model (system membership, roughly CoW/GW dates).
# successor: id inheriting territory/state on retirement. gw: Gleditsch-Ward code (CShapes, REIGN uses CoW ccode which mostly matches).
# owid: entity code in OWID/Maddison files (modern-borders series stand in for predecessors; flagged in `series_note`).
# great_power: years in the CoW major-power list (drives the 'major power' dyad term).
# Modern actors from data/actors.yaml are merged on top of this at build; entries here add lifecycle + codes.

- { id: GBR, name: United Kingdom, introduced: 1816, gw: 200, owid: GBR, great_power: [1816, null] }
- { id: FRA, name: France, introduced: 1816, gw: 220, owid: FRA, great_power: [1816, null] }
- { id: PRUSSIA, name: Prussia, introduced: 1816, retired: 1871, successor: DEU, gw: 255, owid: DEU, great_power: [1816, 1871], successor_borders_until: 1871, series_note: "OWID Germany series used; modern-borders population dropped (NMC tpop is the contemporaneous one)" }
- { id: DEU, name: Germany, spans: [[1871, 1946], [1949, null]], gw: 255, owid: DEU, great_power: [1871, 1945, 1991, null], notes: "1949-90 split: model keeps DEU as West Germany (gw 260) and adds DDR. CoW system membership ends with the surrender 8 May 1945 and resumes with the Federal Republic 1949 (CoW dates the FRG 1955; the model uses the Basic Law, 23 May 1949, because the state exists from then); the 1946-48 gap is Allied military government, not a state." }
- { id: DDR, name: East Germany, introduced: 1949, retired: 1990, successor: DEU, gw: 265, owid: null }

- id: AUT_HUN
  name: Austria-Hungary
  introduced: 1816
  retired: 1918
  successor: AUT
  gw: 300
  owid: AUT
  great_power: [1816, 1918]
  successor_borders_until: 1918
  series_note: "OWID Austria series understates the empire: population 4.5M in 1870 against an NMC tpop of 35.7M (7.9x). Both series are now derived as a successor-state sum (derived_series below); the Austria-only join is suppressed inside the window."
  derived_series:
    window: [1816, 1918]
    min_gdp_coverage: 0.5
    source: "Constituent set = the Habsburg crown lands, mapped to the modern successor codes that hold them. Whole-country parts are inside the empire in full; a partly-inside successor carries a share = the Habsburg portion's 1910 population over that successor's 1910 population (1910 census: Cisleithania 28.57M, Transleithania 20.89M, Bosnia-Herzegovina 1.93M, total 51.39M; Galicia 8.03M split west/east 3.7/4.3, Bukovina 0.80M, Zakarpattia 0.60M, Transylvania+Banat+Crisana+Maramures 5.26M, Vojvodina 1.51M, Trentino+Trieste+Gorizia+Istria 0.93M, Lombardy-Venetia 4.3M in 1816). Shares are held constant over the window - estimate."
    parts:
      - { pop: AUT, gdp: AUT, note: "Austrian lands" }
      - { pop: HUN, gdp: HUN, note: "Hungary proper" }
      - { pop: CZE, gdp: OWID_CZS, note: "Bohemia, Moravia, Austrian Silesia" }
      - { pop: SVK, gdp: OWID_CZS, note: "Upper Hungary" }
      - { pop: SVN, gdp: OWID_YGS, note: "Carniola, Styria, Carinthia" }
      - { pop: HRV, gdp: OWID_YGS, note: "Croatia-Slavonia, Dalmatia" }
      - { pop: BIH, gdp: OWID_YGS, from: 1878, note: "occupied 1878, annexed 1908" }
      - { pop: OWID_YGS, gdp: OWID_YGS, share: 0.11, note: "Vojvodina (no successor code of its own; 1.51M of Yugoslavia's 13.59M in 1913)" }
      - { pop: POL, gdp: POL, share: 0.15, note: "western Galicia" }
      - { pop: UKR, gdp: POL, share: 0.21, note: "eastern Galicia, Bukovina, Zakarpattia; Galicia's own series as the gdp proxy" }
      - { pop: ROU, gdp: ROU, share: 0.44, note: "Transylvania, Banat, Crisana, Maramures" }
      - { pop: ITA, gdp: ITA, share: 0.21, to: 1859, note: "Lombardy-Venetia" }
      - { pop: ITA, gdp: ITA, share: 0.11, from: 1859, to: 1866, note: "Venetia" }
      - { pop: ITA, gdp: ITA, share: 0.025, from: 1866, note: "Trentino, Trieste, Gorizia, Istria" }
- { id: AUT, name: Austria, spans: [[1918, 1938], [1955, null]], gw: 305, owid: AUT, notes: "Anschluss 12 Mar 1938 ends system membership; restored by the State Treaty 15 May 1955. Occupied years carry no capabilities and no dispute non-events." }
- { id: HUN, name: Hungary, introduced: 1918, gw: 310, owid: HUN }

- id: RUS
  name: Russia / USSR
  introduced: 1816
  gw: 365
  owid: RUS
  owid_alt: [{ code: OWID_USS, from: 1922, to: 1991, source: "Maddison/OWID 'USSR' entity: gdp_pc 2308 and population 151.1M in 1930 against modern-borders RUS 1345 and 85.2M; NMC tpop for the same year is 154.9M. The window ends in 1991 because the panel introduces the 14 successor actors that year and NMC's 1991 tpop for ccode 365 is Russia alone (148.3M against the union's 292.7M)" }]
  great_power: [1816, 1917, 1922, null]
  successor_borders_until: 1918
  notes: "USSR 1922-91 kept under RUS; successor states introduced 1991"
  series_note: "OWID Russia population is modern-borders: 49.5M in 1870 against an NMC tpop of 84.5M for the empire. 1816-1921 is now the derived successor-state sum below (the OWID_USS entity is the sum of the 15 union republics, so the empire is that entity minus the parts not yet or no longer Russian, plus Finland and Congress Poland); 1922-91 comes from OWID_USS through owid_alt."
  derived_series:
    window: [1816, 1922]
    min_gdp_coverage: 0.5
    source: "The Maddison/OWID USSR entity (OWID_USS) is exactly the sum of the 15 union republics (87.82M in 1870 = RUS+UKR+BLR+MDA+GEO+ARM+AZE+KAZ+UZB+TKM+TJK+KGZ+LTU+LVA+EST), so the Russian Empire is written as that entity with the not-yet-conquered or already-lost republics subtracted (share -1) and Finland (1809-1917) and Congress Poland added. Central Asian dates: Kokand/Semirechye 1876, Transcaspia 1885, the Pamirs 1895. Congress Poland's share 0.36 of modern Poland is its 6.1M of 1870 over Poland's 16.8M - estimate. Cross-check against NMC tpop at four dates, not two: 1870 90.5/84.5M (1.07), 1890 115.4/117.8M (0.98), 1910 139.8/160.7M (0.87), 1914 143.7/175.1M (0.82). The two agreeing endpoints the first version of this line quoted hid a monotone drift: the derived series compounds at 1.05%/yr where NMC compounds at 1.67%/yr, so by 1914 it is 31.4M short on the era's largest actor (era-1870-1914-r2/data-8). The parts list is not what is wrong — the empire IS the 15 republics plus Finland plus Congress Poland — the deficit is in the OWID_USS back-projection over the late-imperial decades, where the contemporaneous NMC figure is the better one. It is recorded rather than repaired here because the build guard trips at |log(population/tpop)| > 0.3 and 1914 is 0.20: this is the one large, systematic, direction-consistent disagreement the threshold is calibrated to let through, and it is declared in data/history/population_guard.yaml. The repair is to prefer tpop over the derived population for 1900-1922, which changes every per-capita covariate on the largest actor of the era and belongs in its own change."
    parts:
      - { pop: OWID_USS, gdp: OWID_USS, note: "the 15 union republics" }
      - { pop: UZB, gdp: OWID_USS, share: -1, to: 1876 }
      - { pop: KGZ, gdp: OWID_USS, share: -1, to: 1876 }
      - { pop: TKM, gdp: OWID_USS, share: -1, to: 1885 }
      - { pop: TJK, gdp: OWID_USS, share: -1, to: 1895 }
      - { pop: LTU, gdp: OWID_USS, share: -1, from: 1918, note: "independent 1918" }
      - { pop: LVA, gdp: OWID_USS, share: -1, from: 1918 }
      - { pop: EST, gdp: OWID_USS, share: -1, from: 1918 }
      - { pop: MDA, gdp: OWID_USS, share: -1, from: 1918, note: "Bessarabia to Romania 1918" }
      - { pop: FIN, gdp: FIN, to: 1918, note: "Grand Duchy 1809-1917" }
      - { pop: POL, gdp: POL, share: 0.36, to: 1916, note: "Congress Poland" }
- { id: ITA, name: Italy, introduced: 1861, gw: 325, owid: ITA, great_power: [1860, 1943] }
- { id: ESP, name: Spain, introduced: 1816, gw: 230, owid: ESP }
