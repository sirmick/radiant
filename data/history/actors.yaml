# Retired codelist twins: the countrycode panel carries a second, non-iso3c entity for a CoW code a hand actor already
# owns, so the universe held two actors for one state (cow 345 SRB/Yugoslavia overlapped for 148 years). No data source
# maps to them today — makeCodeMap prefers the modeled hand entity — but they would materialise the moment one did.
# Retired with `spans: []` rather than deleted; scripts/build-panel.mjs reports any remaining overlap.
- { id: YUGOSLAVIA, name: Yugoslavia (codelist twin of SRB), spans: [], retired: 1878, successor: SRB, modeled: false, cow: 345, gw: 345, owid: null, notes: "Yugoslavia 1918-92 is carried by SRB (data/history/actors.yaml), which owns cow/gw 345 and the OWID_YGS series" }
