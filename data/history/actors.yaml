    parts:
      - { pop: ROU, gdp: ROU, share: 0.56, note: "the Old Kingdom" }
- { id: BGR, name: Bulgaria, introduced: 1908, gw: 355, owid: BGR }
- { id: SRB, name: Serbia / Yugoslavia, introduced: 1878, gw: 345, owid: SRB, owid_alt: [{ code: OWID_YGS, from: 1918, to: 1992, source: "Maddison/OWID 'Yugoslavia' entity: gdp_pc 1935 and population 14.41M in 1930 against modern-Serbia 3.99M; NMC tpop 13.78M. The window ends in 1992: from then NMC's ccode 345 is FR Yugoslavia (10.45M), not the SFRY (23.09M)" }], successor_borders_until: 1918, notes: "Yugoslavia 1918-92 under SRB", series_note: "Modern-Serbia population understates the Kingdom of Yugoslavia 3.4x; 1918-92 gdp_pc and population come from OWID_YGS (owid_alt), pre-1918 modern-borders population dropped" }
