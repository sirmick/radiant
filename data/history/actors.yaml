- id: GRC
  name: Greece
  introduced: 1828
  gw: 350
  owid: GRC
  series_note: "The OWID series is modern-borders Greece; the kingdom held about a third of that territory until 1881 and about half until the Balkan-war settlements (population 2.75M against an NMC tpop of 0.82M in 1839). The population is a dated share of the modern series - see derived_series."
  derived_series:
    window: [1816, 1914]
    min_gdp_coverage: 0.5
    source: "A predecessor smaller than its own modern borders, written in the same constituent-set form with one part: the 1832 kingdom (Peloponnese, Attica, Boeotia, Euboea, the Cyclades) is about 0.35 of the population inside modern Greek borders, and 0.48 after Thessaly and Arta in 1881; NMC dates the Balkan-war gains to 1914 (tpop 2.74M in 1913, 4.60M in 1914), so the share is 1 from then. The shares are the complement of the Ottoman set's Greek parts, so the two partition modern Greece - estimate. gdp_pc is unchanged by this (one part, so the weighted mean is the part's own series)."
    parts:
      - { pop: GRC, gdp: GRC, share: 0.35, to: 1881, note: "the 1832 kingdom" }
      - { pop: GRC, gdp: GRC, share: 0.48, from: 1881, note: "after Thessaly and Arta 1881" }
- id: ROU
  name: Romania
  introduced: 1878
  gw: 360
  owid: ROU
  series_note: "The OWID series is modern-borders Romania, which includes Transylvania (Habsburg until 1918); the Old Kingdom is the complement of the Habsburg share - see derived_series."
  derived_series:
