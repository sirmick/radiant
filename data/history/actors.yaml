- id: DNK
  name: Denmark
  introduced: 1816
  gw: 390
  owid: DNK
  series_note: "NMC tpop includes the duchies of Schleswig, Holstein and Lauenburg until 1864 (2.34M in 1850 against 1.50M for Denmark proper); those years are a derived sum."
  derived_series:
    window: [1816, 1864]
    min_gdp_coverage: 0.5
    source: "The duchies have no successor code of their own - they are inside modern Germany - so they enter as a share of the German series: about 0.93M of Germany's 34M in 1850, share 0.027, held constant to the Second Schleswig War (NMC tpop drops from 2.69M in 1863 to 1.72M in 1864) - estimate."
    parts:
      - { pop: DNK, gdp: DNK }
      - { pop: DEU, gdp: DEU, share: 0.027, note: "Schleswig, Holstein, Lauenburg" }
