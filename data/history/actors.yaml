- id: OTTOMAN
  name: Ottoman Empire
  introduced: 1816
  retired: 1922
  successor: TUR
  gw: 640
  owid: TUR
  successor_borders_until: 1922
  series_note: "OWID Turkey series is modern-Turkey borders: population 11.8M in 1870 against an NMC tpop of 33.7M (2.9x), and gdp_pc has only the 1820/1870/1913 Maddison benchmarks. Both are now derived as a dated successor-state sum (derived_series below)."
  derived_series:
    window: [1816, 1922]
    min_gdp_coverage: 0.5
    source: "Constituent set = the territory under Ottoman sovereignty or suzerainty in each year, mapped to modern successor codes, with the losses dated (Serbia/Romania/Montenegro/Bulgaria/Bosnia/Cyprus at the Congress of Berlin, July 1878 - the parts run through 1878, Thessaly 1881, Libya 1912, Albania/Macedonia/Aegean/Crete 1913, the Arab provinces at San Remo in April 1920 - occupied from 1918 but not detached before it). Shares: Hejaz+Al-Hasa 0.3 of modern Saudi Arabia; Wallachia+Moldavia 0.56 of modern Romania (the complement of the Habsburg 0.44); modern Greece outside the 1832 kingdom 0.65, and 0.52 after Thessaly 1881 (the complement of the shares in Greece's own derived_series). Yemen is excluded - Ottoman authority there was nominal (Zaydi imamate, Daan 1911) and it is not in the empire's own counts; Egypt is excluded because the khedivate is its own actor in the panel. Cross-check against NMC tpop: 1816 28.4/25.2M, 1870 32.1/33.7M, 1913 21.9/21.3M - estimate."
    parts:
      - { pop: TUR, gdp: TUR, note: "Anatolia and eastern Thrace" }
      - { pop: IRQ, gdp: IRQ, to: 1920, note: "Baghdad, Basra, Mosul" }
      - { pop: SYR, gdp: SYR, to: 1920 }
      - { pop: LBN, gdp: LBN, to: 1920 }
      - { pop: JOR, gdp: JOR, to: 1920 }
      - { pop: ISR, gdp: SYR, to: 1920, note: "Palestine; no Maddison series before 1950, Levant proxy" }
      - { pop: PSE, gdp: SYR, to: 1920 }
      - { pop: SAU, gdp: SAU, share: 0.3, to: 1920, note: "Hejaz and Al-Hasa" }
      - { pop: ALB, gdp: ALB, to: 1913 }
      - { pop: MKD, gdp: OWID_YGS, to: 1913 }
      - { pop: LBY, gdp: EGY, to: 1912, note: "Tripolitania and Cyrenaica; Egypt as the North African gdp proxy" }
      - { pop: CYP, gdp: GRC, to: 1879, note: "British administration from 1878" }
      - { pop: BGR, gdp: BGR, to: 1879 }
      - { pop: BIH, gdp: OWID_YGS, to: 1879 }
      - { pop: MNE, gdp: OWID_YGS, to: 1879 }
      - { pop: SRB, gdp: OWID_YGS, to: 1879, note: "autonomous principality under suzerainty until 1878" }
      - { pop: ROU, gdp: ROU, share: 0.56, to: 1879, note: "Wallachia and Moldavia under suzerainty" }
      - { pop: GRC, gdp: GRC, to: 1830, note: "all of modern Greece is Ottoman before independence" }
      - { pop: GRC, gdp: GRC, share: 0.65, from: 1830, to: 1881, note: "modern-Greece territory outside the 1832 kingdom (the complement of the kingdom's own 0.35)" }
      - { pop: GRC, gdp: GRC, share: 0.52, from: 1881, to: 1914, note: "after Thessaly and Arta 1881; the rest is ceded in the 1913 settlements, which NMC dates to 1914" }
