# Territories — polygons whose controller is not their sole claimant. Where the dice get rolled.
# geometry.ne_ids reference features in the Natural Earth 10m disputed-areas layer (data/geo/world.topo.json, object "disputed").
# geometry.sketch is a hand-drawn lon/lat ring, tagged so the UI renders it as an approximation. Replace with ISW/DeepState GeoJSON when wired.
# stakes: 0-1 per side, how much it would pay to hold/take (estimate). hazard: id in hazards.yaml (omit = static).
# Snapshot: 2026-09-06.

# ---------------------------------------------------------------- Ukraine
- id: crimea
  name: Crimea
  controller: RUS
  claimants: [UKR]
  status: occupied
  stakes: { RUS: 0.95, UKR: 0.8 }
  geometry: { ne_ids: [1159321217] }
  hazard: ukraine_territory
  notes: "Annexed 2014. No plausible path back to Kyiv inside the model horizon except Russian state failure."

- id: donbas
  name: Donetsk & Luhansk (Russian-held)
  controller: RUS
  claimants: [UKR]
  status: contested_active
  stakes: { RUS: 0.9, UKR: 0.85 }
  geometry: { ne_ids: [1763286545, 1763286547] }
  hazard: ukraine_territory
  notes: "NE breakaway polygons are the 2014-22 'republics'; the 2026 line runs west of them. Sketch below carries the rest."

- id: ukraine_south_occupied
  name: Zaporizhzhia & Kherson (Russian-held, land bridge)
  controller: RUS
  claimants: [UKR]
  status: contested_active
  stakes: { RUS: 0.85, UKR: 0.9 }
  geometry:
    sketch: [[33.6, 46.1], [34.3, 46.6], [35.2, 47.1], [36.2, 47.5], [37.2, 47.6], [37.5, 47.1], [37.2, 46.7], [36.0, 46.3], [35.0, 46.0], [34.0, 45.9]]
    geometry_source: sketch (ISW control-of-terrain, Sept 2026, approximate)
  hazard: ukraine_territory
  notes: "Includes the ZNPP. The land bridge to Crimea is the thing Moscow will not trade."

