# Territories — polygons whose controller is not their sole claimant. Where the dice get rolled.
# geometry.ne_ids reference features in the Natural Earth 10m disputed-areas layer (data/geo/world.topo.json, object "disputed").
# geometry.sketch is a hand-drawn lon/lat ring, tagged so the UI renders it as an approximation. Replace with ISW/DeepState GeoJSON when wired.
# stakes: 0-1 per side, how much it would pay to hold/take (estimate). hazard: id in hazards.yaml (omit = static).
# history: dated control list — [{ year, controller, status, source }]. controller/status at the top of a record are the
# 2026 snapshot; history is what a backtest as-of a historical year reads.
# Snapshot: 2026-09-06.

