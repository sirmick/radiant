# Supranational and regional unions — dated membership, the as-of record (docs/plan-structure.md, "unions").
# A union here is a standing treaty organisation of states with a regional membership rule: a single market, a customs
# union, or a political organisation. Defence pacts are not here (they are the pact graph, scripts/lib/hist.mjs).
# The model reads membership as state (src/engine/unions.js): who is in at as-of, then entry rounds, member exits and the
# dissolution of a whole union as hazards POOLED across these unions, and joint membership as a dyad covariate split by
# depth. members: [id, from, to?] — to = the year the state left or was suspended; a second row is a return.
#   depth  deep      single market, common law and institutions (the EU)
#          customs   customs union / free-trade area / planned-economy integration
#          political a political organisation without an economic union
#   dissolved: the year the union ceased (its members' spells end there).
# Dates are entry into force; hand-coded from the founding and accession treaties (sources per union).
unions:
  - id: eu
    name: European Union (EEC 1958, EC 1967/1993, EU 1993)
    founded: 1958
    members:
      - [BEL, 1958]
      - [FRA, 1958]
      - [DEU, 1958]          # West Germany; the GDR's territory joins with unification, 3 Oct 1990
      - [ITA, 1958]
      - [LUX, 1958]
      - [NLD, 1958]
      - [DNK, 1973]
      - [IRL, 1973]
      - [GBR, 1973, 2020]    # withdrawal 31 Jan 2020 (art. 50, notified 29 Mar 2017)
      - [GRC, 1981]
      - [PRT, 1986]
      - [ESP, 1986]
      - [AUT, 1995]
      - [FIN, 1995]
      - [SWE, 1995]
      - [CYP, 2004]
