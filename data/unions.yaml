      - [POL, 2004]
      - [SVK, 2004]
      - [SVN, 2004]
      - [BGR, 2007]
      - [ROU, 2007]
      - [HRV, 2013]
    depth: deep
    source: "Treaties of Rome (1957) and the accession treaties; Treaty on European Union art. 49 (entry) and 50 (exit)"
    notes: "Norway signed accession treaties in 1972 and 1994 and rejected both by referendum; Greenland (a territory) left the EC in 1985. Neither is a member-state exit."

