# Claims — resolvable statements with a human prior and a model query.
# query: evaluated per sampled run at the horizon step. Grammar (src/engine/query.js):
#   fired(hazard_id[, outcome])           hazard fired (with outcome) by horizon
#   not fired(...)
#   state(path) == value                  world/actor/territory/corridor state at horizon
#   state(path) >= number
#   A and B, A or B, (A)
# p_history entries: [date, p, source] — source is human | model | crowd. prior is never edited.
