    - { year: 1915.13, status: contested, controller: OTTOMAN, source: "Anglo-French naval attack on the Dardanelles 19 Feb - 18 Mar 1915; Gallipoli landings 25 Apr 1915 — the forcing attempt" }
    - { year: 1916.05, status: closed, controller: OTTOMAN, source: "Allied evacuation of Gallipoli 9 Jan 1916; the closure holds to 1918" }
