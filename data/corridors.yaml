- id: panama
  name: Panama Canal
  kind: chokepoint
  mode: sea
  status: open
  controller: PAN
  geometry: { point: [-79.6, 9.1] }
  transits: [PAN, USA]
  load_bearing_for: { PAN: 0.9, USA: 0.5, CHL: 0.4, PER: 0.4, ECU: 0.4, COL: 0.3 }
  load_bearing_source: estimate
  history:
    - { year: 1881.00, status: building, source: "Compagnie Universelle du Canal Interocéanique begins work Jan 1881" }
    - { year: 1889.10, status: abandoned, source: "liquidation 4 Feb 1889 — the era's largest corridor failure (~22,000 dead, the Panama scandal)" }
    - { year: 1904.40, status: building, controller: USA, source: "US takes over May 1904 after the Hay–Bunau-Varilla treaty of 18 Nov 1903" }
    - { year: 1914.60, status: open, controller: USA, source: "SS Ancon transits 15 Aug 1914" }
    - { year: 1915.70, status: closed, controller: USA, source: "Culebra/Cucaracha slides close the canal to traffic from Sep 1915 — the dataset's only corridor closure with no war attached" }
    - { year: 1916.30, status: open, controller: USA, source: "traffic resumes Apr 1916 (month is an estimate; the slides recur into 1920)" }
    - { year: 1964.03, status: contested, controller: USA, source: "flag riots 9-12 Jan 1964; Panama severs relations with the United States until 3 Apr 1964 — the crisis that starts the treaty negotiation (era-1945-1991-r2/corridors-8: the record had no row between 1916 and 1999)" }
    - { year: 1977.68, status: open, controller: USA, source: "Torrijos-Carter treaties signed 7 Sep 1977" }
    - { year: 1979.75, status: open, controller: PAN, source: "the treaties enter into force 1 Oct 1979: the Canal Zone is abolished and the canal passes to the binational Panama Canal Commission under Panamanian sovereignty. data/territories.yaml already recorded this as panama_canal_zone 1979 and the two layers disagreed" }
    - { year: 1989.97, status: closed, controller: USA, source: "the canal is closed to traffic 20 Dec 1989 during the US invasion — the only wartime closure in its history" }
    - { year: 1990.0, status: open, controller: PAN, source: "reopened 21 Dec 1989 / Jan 1990" }
    - { year: 1999.99, status: open, controller: PAN, source: "Torrijos–Carter handover 31 Dec 1999" }
    - { year: 2016.48, status: open, controller: PAN, capacity: 1.0, capacity_source: estimate, source: "the expanded neo-Panamax locks open 26 Jun 2016, roughly tripling the transitable tonnage" }
    - { year: 2023.83, status: contested, controller: PAN, capacity: 0.6, capacity_source: estimate, source: "Gatun Lake drought: daily transits cut from 36 to 24 on 30 Jul 2023, to 22 in Nov 2023, with 18 scheduled for Feb 2024 - the layer second impairment with no war attached" }
    - { year: 2024.58, status: open, controller: PAN, source: "restrictions lifted from Aug 2024 as the lake refills; 36 slots restored through 2025" }
  notes: "The 1881–1889 French attempt is the model's only abandoned corridor: a corridor can fail without anyone fighting over it."

