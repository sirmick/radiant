# Corridors and chokepoints — the load-bearing infrastructure that turns transit into alliance.
# kind: chokepoint | corridor.  mode: sea | rail | pipeline | hvdc | cable | multimodal.
# status: open | contested | closed | planned | building | built | abandoned.
# history: dated status list — [{ year, status, controller?, capacity?, completion?, source }] — the as-of record.
#   `status`/`controller`/`completion` at the top of a record are the 2026 snapshot; `history` is what a backtest reads.
# controller: the state that actually holds it (Suez 1882-1956 is the case the field exists for). sponsor: who is building it.
# load_bearing_for: 0-1 per dependent state (estimate). For planned/building corridors this is the value once built;
# the engine scales it by completion. This number is the corridor-dampener term in the dyadic conflict hazard.
# Geometry is rough lon/lat; chokepoints are points, corridors are polylines through the cities they connect.
# Snapshot: 2026-09-06.

