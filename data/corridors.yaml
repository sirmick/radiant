    - { year: 1936.50, status: open, controller: TUR, source: "Montreux Convention 20 Jul 1936" }
    - { year: 1939.67, status: closed, controller: TUR, source: "Montreux Art. 19: the Straits are closed to belligerent warships — the closure that makes the Persian Corridor necessary" }
    - { year: 1945.75, status: open, controller: TUR, source: "the war ends and the Montreux peacetime regime resumes; the record's own history used to stop at the 1939 closure and never reopen, which is the case scripts/backtest.mjs's COVERAGE comment cites (era-1870-1914-r2/engine-5)" }
