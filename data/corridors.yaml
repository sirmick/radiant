  notes: "Without this record the Suez entry asserts an open canal for 1940-43, the years nobody could reach it: Allied traffic went round the Cape, adding roughly 40 days per voyage."
  history:
    - { year: 1904.29, status: open, controller: GBR, source: "Entente Cordiale 8 Apr 1904; the route is British-Italian-French in peacetime" }
    - { year: 1940.44, status: closed, controller: ITA, source: "Italian entry 10 Jun 1940: Allied through-traffic reroutes via the Cape" }
    - { year: 1943.38, status: contested, controller: GBR, source: "Tunis falls 13 May 1943" }
    - { year: 1943.60, status: open, controller: GBR, source: "first through convoy since 1940 sails in Aug 1943 (date is an estimate)" }

# ---------------------------------------------------------------- records the era had and this layer did not (turn era-1870-1914-r2, added 2026-09-07)
# Why this block exists. Before it the layer held 9 chokepoints, of which 4 had no dated entry before 1942 and were
# back-dated to 1869 by an inference this turn removed (src/engine/core.js:corridorFirstYear); the 1891-1900 decade
# contained zero chokepoint transitions anywhere in the file; and `chokepoint_status` had 4 events at both as-of 1890
# and as-of 1900 against a fitter that needs 5. The straits below are the ones the era's own presence and territory
# layers already imply — data/presence.yaml carries GBR at Gibraltar from 1816 — and each carries a dated history with
# a source. `load_bearing_for` values are estimates unless a share is cited.

- id: gibraltar
  name: Strait of Gibraltar
  kind: chokepoint
  mode: sea
  status: open
  controller: GBR
  geometry: { point: [-5.35, 36.14] }
  transits: [ESP, MAR]
  load_bearing_for: { GBR: 0.9, FRA: 0.4, ITA: 0.3 }
  load_bearing_source: estimate
  history:
    - { year: 1869.0, status: open, controller: GBR, source: "British since the Treaty of Utrecht 1713; the Rock and the Mediterranean Fleet are what make the Suez route a British route (data/presence.yaml: GBR GIB from 1816)" }
    - { year: 1904.29, status: open, controller: GBR, source: "Anglo-French Declaration 8 Apr 1904: France accepts the British position and the strait stops being a Franco-British question" }
  notes: "The western gate of the Mediterranean route. It never changes hands in the modelled window, and that is the point: a chokepoint sample with no unchanging straits in it has its base rate wrong the other way."

