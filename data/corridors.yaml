- id: berlin_corridors
  name: West Berlin access corridors (road, rail, canal, air)
  kind: chokepoint
  mode: multimodal
  status: open
  controller: DEU
  geometry: { point: [13.4, 52.5] }
  transits: [DEU, DDR]
  exists_until: 1994
  exists_until_source: "the Berlin access regime ends: the Two Plus Four Treaty enters into force 15 Mar 1991 and the last Russian troops leave Berlin 31 Aug 1994, after which there is no corridor to control (era-1991-2026-r2/corridors-6)"
  load_bearing_for: { DEU: 0.35, USA: 0.3, GBR: 0.3, FRA: 0.3 }
  load_bearing_source: estimate
  load_bearing_from: 1945
  notes: "era-1945-1991-r2/corridors-4. The era's defining corridor crisis and the one case where a chokepoint closure produces a great-power confrontation without a war — 322 days closed, reopened without a shot, with a guarantor airlift attached. It is the best in-era falsifier for the guarantor_presence / guarantor_withdrawal terms, because the record reopens when the guarantor's weight goes UP."
  history:
    - { year: 1945.53, status: open, controller: USA, source: "four-power occupation from 4 Jul 1945; the access agreements of 29 Jun 1945 (road, rail) and 30 Nov 1945 (the three air corridors) are what the western sectors are supplied through" }
    - { year: 1948.48, status: closed, controller: RUS, source: "surface access to the western sectors severed 24 Jun 1948; the airlift begins 26 Jun 1948" }
    - { year: 1949.36, status: open, controller: USA, source: "the blockade is lifted 12 May 1949 after 322 days; the airlift continues to 30 Sep 1949 to build a stockpile" }
    - { year: 1958.90, status: contested, controller: RUS, source: "Khrushchev's ultimatum 27 Nov 1958: six months to make West Berlin a free city or access is handed to the GDR" }
    - { year: 1961.62, status: contested, controller: RUS, source: "the sector boundary is sealed 13 Aug 1961 and the wall built; allied access along the corridors is kept but tested (the Checkpoint Charlie standoff, 27-28 Oct 1961)" }
    - { year: 1971.67, status: open, controller: RUS, source: "Quadripartite Agreement signed 3 Sep 1971, in force 3 Jun 1972: unimpeded civilian transit guaranteed in writing for the first time" }
    - { year: 1989.86, status: open, controller: DEU, source: "the boundary opens 9 Nov 1989; access ceases to be a four-power question" }

