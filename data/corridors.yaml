- id: tiran
  name: Straits of Tiran / Gulf of Aqaba
  kind: chokepoint
  mode: sea
  status: open
  controller: SAU
  geometry: { point: [34.5, 27.9] }
  transits: [EGY, SAU, ISR, JOR]
  load_bearing_for: { ISR: 0.45, JOR: 0.8 }
  load_bearing_source: estimate
  load_bearing_from: 1949
  notes: "era-1945-1991-r2/corridors-5. The layer had no record for the strait whose closure is the proximate cause of the Six-Day War: the suez record carried `1967.4 closed` sourced to the war, so the model saw a canal closing because a war happened, where the actual sequence is a chokepoint closing on 22 May 1967 and the war starting sixteen days later. It is also the only Israeli and the only Jordanian outlet to the Red Sea, which is why the load-bearing weights are what they are."
  history:
    - { year: 1949.05, status: contested, controller: EGY, source: "Egyptian batteries at Ras Nasrani and on Tiran close the strait to Israeli-flag shipping and to strategic cargo from the 1949 armistices" }
    - { year: 1956.85, status: open, controller: ISR, source: "Sharm el-Sheikh taken 5 Nov 1956 in the Sinai campaign; the strait opens to Israeli shipping" }
    - { year: 1957.22, status: open, controller: EGY, source: "Israeli withdrawal Mar 1957 under a UNEF stationing at Sharm el-Sheikh and a US assurance of free passage — the guarantee whose removal in 1967 is the crisis"  }
    - { year: 1967.39, status: closed, controller: EGY, source: "Nasser closes the strait to Israeli shipping 22 May 1967, three days after UNEF withdraws on 19 May" }
    - { year: 1967.43, status: open, controller: ISR, source: "Sharm el-Sheikh taken 7 Jun 1967; the strait is held by force for eleven years" }
    - { year: 1979.23, status: open, controller: ISR, source: "Egypt-Israel treaty 26 Mar 1979, Art. V: the strait and the Gulf of Aqaba are international waterways open to all, free passage guaranteed by treaty" }
    - { year: 1982.31, status: open, controller: EGY, source: "Sinai withdrawal complete 25 Apr 1982 with the Multinational Force and Observers at Sharm el-Sheikh: the guarantee holds without the guarantor holding the ground" }
    - { year: 2017.45, status: open, controller: SAU, source: "the Egypt-Saudi maritime demarcation agreement of 8 Apr 2016 is ratified by the Egyptian parliament 14 Jun 2017 and cleared by the Supreme Constitutional Court 3 Mar 2018: Tiran and Sanafir pass to Saudi Arabia, which accedes to the free-passage obligations of the 1979 treaty. The islands that command the strait change hands for the first time since 1950 and the record had no row for it (era-1991-2026-r2/corridors-3)" }

