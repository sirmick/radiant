# ---------------------------------------------------------------- historical corridors and chokepoints (1816–1945)
# Added 2026-09-06 for the 1870–1914 turn: every id that data/history/events.yaml fires against now resolves to a record
# (scripts/build-events.mjs fails the build otherwise). `load_bearing_for` on historical records is an estimate —
# a judgement about how much of a state's trade, mobilisation or revenue rode on the link — flagged per record.

