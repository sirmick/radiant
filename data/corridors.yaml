# Corridors and chokepoints — the load-bearing infrastructure that turns transit into alliance.
# kind: chokepoint | corridor.  mode: sea | road | rail | pipeline | hvdc | cable | multimodal.
# status: open | contested | closed | planned | building | built | abandoned.
# history: dated status list — [{ year, status, controller?, capacity?, completion?, source }] — the as-of record.
# exists_from / exists_until (+ _source): the record's own life. A record contributes no year outside it — corridors
#   are the only dated layer that used to have no ending, so a corridor whose thing is gone went on supplying
#   non-event years forever (era-1991-2026-r2/corridors-6, docs/schema.md).
# speculative: true — a record with NO dated instrument behind it, kept as a scenario object. Its only history row is
#   the 2026 snapshot, so it is not a unit at any as-of the model scores; the flag says that is deliberate.
#   `status`/`controller`/`completion` at the top of a record are the 2026 snapshot; `history` is what a backtest reads.
# controller: the state that actually holds it (Suez 1882-1956 is the case the field exists for). sponsor: who is building it.
# load_bearing_for: 0-1 per dependent state (estimate). For planned/building corridors this is the value once built;
# the engine scales it by completion. This number is the corridor-dampener term in the dyadic conflict hazard.
# Geometry is rough lon/lat; chokepoints are points, corridors are polylines through the cities they connect.
# Snapshot: 2026-09-06.

# ---------------------------------------------------------------- sea chokepoints
- id: hormuz
  name: Strait of Hormuz
  kind: chokepoint
  mode: sea
  status: closed
  geometry: { point: [56.3, 26.5] }
  transits: [IRN, OMN, ARE]
  load_bearing_for: { QAT: 0.95, IRQ: 0.9, IRN: 0.85, KWT: 0.9, ARE: 0.6, SAU: 0.55, IND: 0.5, JPN: 0.7, KOR: 0.65, CHN: 0.35, TWN: 0.4, THA: 0.4 }
  hazard: hormuz_reopens
  notes: "The record's state is its dated history below; the 2026.2 closure is the hand event in data/history/events.yaml. era-modern-2000-2025/engine-8: this field used to carry a scenario sentence from the retired conversation-era layer (\"the transcript's modal path is a Hormuz-for-blockade swap\"), which docs/system.md says was retired to docs/origin/ — a hand-typed future on the world's most consequential chokepoint. How long the closure lasts is the `record_reopen` hazard's business, and that hazard is now fitted on 1869-2025 rather than on pre-1946 straits alone (era-modern-2000-2025/corridors-2)."
  history:
    - { year: 1892.0, status: open, controller: GBR, source: "the Trucial exclusive agreements of 1892 formalise a British Gulf that had been de facto since the 1850s: the strait is open and its littoral bound to one power (era-1870-1914-r2/corridors-1)" }
    - { year: 1971.91, status: contested, source: "Iran seizes Abu Musa and the Greater and Lesser Tunbs 30 Nov 1971, the day before the British withdrawal completes — the islands that command the approach lanes (data/territories.yaml abu_musa_tunbs)" }
    - { year: 1971.92, status: open, controller: OMN, source: "the British Gulf ends: the exclusive agreements are terminated and the last forces leave by 1 Dec 1971 (Bahrain independent 15 Aug, Qatar 3 Sep, the UAE 2 Dec 1971). The controller passes to the littoral state whose territorial waters the traffic separation scheme runs through — the record carried GBR forward to 1984 and so put every British war of the era on the strait's adjacent_war covariate (era-1945-1991-r2/corridors-3)" }
    - { year: 1984.0, status: contested, source: "Iran-Iraq tanker war" }
    - { year: 1988.6, status: open, source: "ceasefire Aug 1988" }
    - { year: 2019.36, status: contested, source: "Gulf of Oman tanker attacks 12 May and 13 Jun 2019; the Stena Impero is seized 19 Jul 2019 and war-risk premiums multiply" }
    - { year: 2019.74, status: open, controller: OMN, source: "the Stena Impero is released 27 Sep 2019 and the insurance market normalises" }
    - { year: 2024.28, status: contested, source: "the MSC Aries is seized at the strait 13 Apr 2024 during the Iran-Israel exchange" }
    - { year: 2026.2, status: closed, source: "2026 tanker war (data/history/events.yaml)" }

