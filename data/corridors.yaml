    - { year: 2022.16, status: contested, controller: TUR, source: "Turkey invokes Montreux Art. 19 on 28 Feb 2022 and closes the Straits to belligerent warships of both sides; Ukraine's Black Sea ports are blockaded and its grain exports stop. The record declares UKR 0.8 load-bearing and had no row for the year that dependence was cut (era-1991-2026-r2/corridors-3)" }
    - { year: 2023.54, status: open, controller: TUR, source: "Russia terminates the Black Sea Grain Initiative 17 Jul 2023; the Straits revert to the peacetime regime for a corridor that no longer runs" }

