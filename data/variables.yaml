    label: GDP per capita (PPP)
    unit: USD
    kind: series
    scope: actor
    source: { fetch: wb, field: gdp_pc_ppp }
    dynamics: slow
    equation: gdp_pc
    display: { fan: true, map: true, format: ".3s", log: true }

  - id: productivity
    group: macro
