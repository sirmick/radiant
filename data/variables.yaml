    unit: fraction/yr
    kind: derived
    scope: actor
    source: { compute: true }
    dynamics: slow
    equation: productivity             # ← rd_gdp, stem_immigration, ai_compute access, energy price, convergence gap
    drives: [gdp_ppp]

  - id: gov_debt_gdp
    group: macro
    label: Government debt / GDP
    unit: fraction
    kind: series
    scope: actor
    source: { fetch: wb, field: gov_debt_gdp, transform: pct }
    fallback: { estimate: region_median }
    dynamics: slow
    equation: debt
    drives: [fiscal_stress]
    display: { fan: true, map: true, format: ".0%" }

  - id: fiscal_balance
    group: macro
    label: Fiscal balance / GDP
    unit: fraction
    kind: derived
    scope: actor
    source: { compute: true }
    dynamics: slow
    equation: fiscal_balance           # ← resource rents × price, old-age share, milex, debt service
    drives: [gov_debt_gdp, fiscal_stress]
    display: { fan: true, map: true, format: "+.1%" }

  - id: trade_gdp
