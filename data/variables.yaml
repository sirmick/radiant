    scope: actor
    source: { estimate: { SAU: 0.6, ARE: 0.9, QAT: 0.99, KWT: 0.9, BHR: 0.9, ISR: 0.8, SGP: 0.3, EGY: 0.02, AUS: 0.1, IRN: 0.02 } }
    fallback: { estimate: 0.0 }
    dynamics: static
    display: { map: true, format: ".0%" }

