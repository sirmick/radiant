    drives: [productivity, tech_diffusion]
    display: { map: true, format: ".1%" }

  - id: stem_immigration
    group: human_capital
    label: Net inflow of STEM researchers
    unit: index (2025 = 100 for USA)
    kind: state
    scope: actor
    source: { estimate: { USA: 100, CAN: 18, GBR: 22, AUS: 10, DEU: 14, CHE: 8, NLD: 6, FRA: 8, SGP: 5, CHN: 12, JPN: 4, KOR: 3, ARE: 4, ISR: 3 } }   # NSF SED stay-rates + CSET talent flows, indexed; estimate
    fallback: { estimate: 1 }
    dynamics: slow
    equation: stem_immigration         # ← openness state, relative wages, us_reliability latent; redistributes within the pool
    drives: [productivity, tech_diffusion]
    display: { fan: true, map: true, format: ".0f" }

  - id: openness
    group: human_capital
    label: Openness to migrants (policy)
    unit: index 0–1
    kind: state
    scope: actor
    source: { estimate: { USA: 0.35, CAN: 0.85, GBR: 0.6, AUS: 0.75, NZL: 0.7, DEU: 0.6, FRA: 0.5, NLD: 0.5, SWE: 0.5, JPN: 0.3, KOR: 0.3, SGP: 0.7, ARE: 0.6, CHN: 0.1, RUS: 0.1, IND: 0.2, ISR: 0.3, TUR: 0.3 } }   # MIPEX-informed + 2025 policy; estimate
