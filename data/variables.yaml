    display: { map: true, format: ".0%" }

  - id: oil_rents_gdp
    group: macro
    label: Oil rents / GDP
    unit: fraction
    kind: series
    scope: actor
    source: { fetch: wb, field: oil_rents_gdp, transform: pct }
    dynamics: static
    drives: [fiscal_balance, fiscal_breakeven]
    display: { map: true, format: ".0%" }

  - id: fiscal_breakeven
    group: macro
    label: Fiscal breakeven oil price
    unit: USD/bbl
    kind: state
    scope: actor
    source: { estimate: { SAU: 90, ARE: 55, QAT: 45, IRQ: 95, IRN: 120, RUS: 75, NGA: 130, KAZ: 100, AZE: 75 } }   # IMF REO Oct 2025, rounded
    dynamics: static
    drives: [fiscal_stress]

  - id: fiscal_stress
    group: macro
    label: Fiscal stress index
    unit: index 0–1
    kind: derived
    scope: actor
    source: { compute: true }
    dynamics: quarterly
    equation: fiscal_stress            # rentiers: (breakeven − brent)/breakeven clipped; others: debt & deficit pressure
    display: { fan: true, map: true, format: ".2f" }

