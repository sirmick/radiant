# Variable registry — the single source of truth for what the model tracks.
# Build, engine and UI all read this. Nothing else hardcodes a variable id.
#
# kind:     series  = history from data, projected forward by an equation
#           state   = discrete/slow snapshot that hazards and rules rewrite
#           derived = computed each step from other variables, never an input
#           latent  = one shared draw per run (correlation structure)
#           param   = a distribution the equations read
# scope:    actor | dyad | world
# dynamics: slow (annual difference eq.) | quarterly | static (only hazards change it)
# source:   { fetch: <fetcher id>, field, transform? } | { hand: <file>, field } | { estimate: <value or map> } | { compute: true }
# panel:    the data/panel.json column this variable lands in (default: the variable id). The modern fold in
#           scripts/build-panel.mjs adds columns only — a variable whose column already exists fails the build, and
#           declaring `panel:` is how a modern measurement sits beside a historical series of the same name.
# equation: name of an exported function in src/engine/equations.js (required when dynamics != static)
# display:  { fan, map, format, log }  — drives the UI picker; omit to hide

groups:
  demographics: Demographics
  macro: Macro
  energy: Energy & resources
  human_capital: Human capital & tech
  capability: Critical capabilities
  regime: State & regime
  external: External & alignment
  military: Military
  world: World

variables:
  # ---------------------------------------------------------------- demographics
  - id: population
    group: demographics
    label: Population
    unit: persons
    kind: series
    scope: actor
    source: { fetch: wpp, field: TPopulation1July, transform: thousands }
    panel: population_wpp             # the panel's `population` is the OWID/Maddison historical series and a fitted covariate; the UN WPP measurement lands beside it, it does not overwrite it
    dynamics: slow
    equation: from_projection          # WPP medium already projects to 2100; equation only perturbs by latent fertility/migration shocks
    display: { fan: true, map: true, format: ".3s" }

  - id: working_age_share
    group: demographics
    label: Working-age share (15–64)
    unit: fraction
    kind: series
    scope: actor
    source: { fetch: wpp_age5, transform: working_age_share }
    dynamics: slow
    equation: from_projection
    drives: [productivity, fiscal_balance]
    display: { fan: true, map: true, format: ".0%" }

  - id: old_age_share
    group: demographics
    label: Share 65+
    unit: fraction
    kind: series
    scope: actor
    source: { fetch: wpp_age5, transform: old_age_share }
    dynamics: slow
    equation: from_projection
    drives: [fiscal_balance]
    display: { fan: true, map: true, format: ".0%" }

  - id: median_age
    group: demographics
    label: Median age
    unit: years
    kind: series
    scope: actor
    source: { fetch: wpp, field: MedianAgePop }
    dynamics: slow
    equation: from_projection
    display: { fan: true, map: true, format: ".1f" }

  - id: fertility
    group: demographics
    label: Total fertility rate
    unit: births/woman
    kind: series
    scope: actor
    source: { fetch: wpp, field: TFR }
    dynamics: slow
    equation: fertility                # WPP path × latent demographic shock; feeds population deviation from projection
    drives: [population]
    display: { fan: true, map: true, format: ".2f" }

  - id: net_migration
    group: demographics
    label: Net migration
    unit: persons/yr
    kind: series
    scope: actor
    source: { fetch: wpp, field: NetMigrations, transform: thousands }
    dynamics: slow
    equation: net_migration            # responds to openness state and relative income
    drives: [population, stem_immigration]
    display: { fan: true, map: true, format: ".3s" }

  # ---------------------------------------------------------------- macro
  - id: gdp_ppp
    group: macro
    label: GDP (PPP)
    unit: USD (current intl)
    kind: series
    scope: actor
    source: { fetch: wb, field: gdp_ppp }
    dynamics: slow
    equation: gdp                      # growth = productivity growth + working-age growth, convergence toward frontier
    drives: [milex_abs, fiscal_balance, trade_weight]
    display: { fan: true, map: true, format: ".3s", log: true }

  - id: gdp_pc_ppp
