    dynamics: quarterly
    equation: leader_age
    drives: [hazard.leadership_transition]

  - id: leader_tenure
    group: regime
    label: Leader tenure
    unit: years
    kind: derived
    scope: actor
    source: { hand: actors.yaml, field: regime.leader_since }
    dynamics: quarterly
    equation: leader_tenure

  - id: nuclear_status
    group: regime
    label: Nuclear status
    kind: state
    scope: actor
    source: { hand: actors.yaml, field: nuclear.status }
    dynamics: static
    display: { map: true, categorical: [none, latent, weapon] }

  - id: war_losses
    group: regime
    label: Cumulative war losses index
    unit: index 0–1
    kind: state
    scope: actor
    source: { estimate: { RUS: 0.6, UKR: 0.7, IRN: 0.5, ISR: 0.2, SYR: 0.8, IRQ: 0.3 } }
    fallback: { estimate: 0.0 }
    dynamics: quarterly
    equation: war_losses               # accrues while in active conflict, decays otherwise
    drives: [hazard.leadership_transition]
    display: { map: true, format: ".2f" }

  # ---------------------------------------------------------------- external
  - id: milex_gdp
    group: military
    label: Military spending / GDP
    unit: fraction
    kind: series
    scope: actor
    source: { fetch: wb, field: milex_gdp, transform: pct }
    fallback: { estimate: region_median }
    dynamics: slow
    equation: milex                    # rises with threat, bloc pressure
    drives: [fiscal_balance, tech_diffusion]
    display: { fan: true, map: true, format: ".1%" }

  - id: chokepoint_exposure
    group: external
    label: Trade share through chokepoints
    unit: fraction per chokepoint
    kind: state
    scope: actor
    source: { hand: actors.yaml, field: chokepoints }
    dynamics: slow
    equation: chokepoint_exposure      # falls as corridors get built
    drives: [fiscal_stress]

  - id: alignment
    group: external
    label: Alignment (dyadic)
    unit: −1…1
    kind: state
    scope: dyad
    source: { fetch: un_ideal_points, transform: ideal_point_similarity }   # M2: fetcher not yet written; build uses estimate matrix in data/alignment.yaml
    fallback: { hand: alignment.yaml }
    dynamics: quarterly
    equation: alliance_gravity
    display: { graph: true }

  # ---------------------------------------------------------------- world
  - id: brent
    group: world
    label: Oil price (Brent)
    unit: USD/bbl
    kind: derived
    scope: world
    source: { compute: true }
    dynamics: quarterly
    equation: brent                    # supply-curve price from world oil_demand vs. producer cost stack
    drives: [fiscal_stress, oil_production]
    display: { fan: true, format: ".0f" }

  - id: launch_cost
    group: world
    label: Cost to LEO
    unit: USD/kg
    kind: derived
    scope: world
    source: { estimate: 1500 }
    dynamics: slow
    equation: launch_cost              # exponential decline, rate from latent
    drives: [tech_diffusion]
    display: { fan: true, format: ".0f", log: true }

  - id: exit_door
    group: world
    label: Visible exit for Iran (deal on offer)
    unit: 0–1
    kind: state
    scope: world
    source: { estimate: 0.15 }
    dynamics: static
    drives: [hazard.iran_consolidation, hazard.iran_bomb, hazard.heu_removed]
    display: { fan: true, format: ".2f" }

  - id: nato_hollow
    group: world
    label: NATO Article 5 publicly hollowed
    kind: state
    scope: world
    source: { estimate: 0 }
    dynamics: static

  - id: taiwan_crisis
    group: world
    label: Taiwan crisis active
    kind: state
    scope: world
    source: { estimate: 0 }
    dynamics: static

  - id: crypto_reset
    group: world
    label: Public-key crypto broken (CRQC exists)
    kind: state
    scope: world
    source: { estimate: 0 }
    dynamics: static

  - id: shock_gdp
    group: world
    label: Global GDP shock (accumulated)
    unit: fraction
    kind: state
    scope: world
    source: { estimate: 0 }
    dynamics: quarterly
    equation: shock_decay

  - id: oil_demand
    group: world
    label: World oil consumption
    unit: TWh/yr
    kind: derived
    scope: world
    source: { compute: true }
    dynamics: slow
    equation: world_sum
    of: oil_demand
    display: { fan: true, format: ".3s" }

  - id: year
    group: world
    label: Calendar year
    kind: derived
    scope: world
    source: { compute: true }
    dynamics: quarterly
    equation: year

# ---------------------------------------------------------------- latents
# One draw per run. Anything referencing a latent id reads the same value, so correlated beliefs move together.
latents:
  - id: us_reliability
    label: US reliability as ally/supplier
    prior: { mean: 0.45, sd: 0.2, clip: [0, 1] }
    drives: [openness.USA, alliance_gravity, export_control_enforcement, stem_immigration]
  - id: electrification_speed
    label: Speed of global electrification
    prior: { mean: 1.0, sd: 0.3, clip: [0.4, 2.0] }
    drives: [ev_share, renewables_share, oil_demand]
  - id: china_export_push
    label: China doubles down on renewables/EV export
    prior: { mean: 1.0, sd: 0.25, clip: [0.5, 1.8] }
    drives: [ev_share, mineral_refining]
  - id: ai_factory
    label: AI-designed automated factories become routine
    prior: { mean: 0.5, sd: 0.25, clip: [0, 1] }
    drives: [productivity, tech_diffusion, mineral_refining]
  - id: drone_commoditization
    label: Autonomous strike/USV become commodity tech
    prior: { mean: 0.6, sd: 0.2, clip: [0, 1] }
    drives: [tech_diffusion, conflict]
  - id: demographic_shock
    label: Fertility deviation from WPP medium
    prior: { mean: 0.0, sd: 0.15, clip: [-0.4, 0.4] }
    drives: [fertility]
  - id: launch_cost_decline
    label: Annual decline in launch cost
    prior: { mean: 0.10, sd: 0.04, clip: [0.02, 0.2] }
    drives: [launch_cost]
