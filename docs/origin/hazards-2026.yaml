- id: climate_shock
  name: Catastrophic climate event in a load-bearing region
  once: false
  outcomes: [shock]
  base_q: 0.02
  covariates:
    - { var: world.year, beta: 0.04, center: 2026 }     # rising hazard over the horizon
  fires:
    shock: { add: { actors.IND.fiscal_stress: 0.1, actors.EGY.fiscal_stress: 0.1, actors.PAK.fiscal_stress: 0.15 } }
  source: estimate
