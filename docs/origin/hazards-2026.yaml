    japan: { set: { actors.JPN.nuclear.status: weapon, actors.JPN.nuclear.warheads: 20, actors.JPN.tech.nukes: S } }
    both:  { set: { actors.KOR.nuclear.status: weapon, actors.KOR.nuclear.warheads: 20, actors.KOR.tech.nukes: S, actors.JPN.nuclear.status: weapon, actors.JPN.nuclear.warheads: 20, actors.JPN.tech.nukes: S } }
  source: estimate

- id: china_transition
  name: Chinese leadership transition (post-Xi)
  once: true
  outcomes: [technocrat, nationalist]
  outcome_weights: [0.65, 0.35]
  base_q: 0.008                                   # ~27% by 2036, ~55% by 2046; Xi is 73
  covariates:
    - { var: actors.CHN.leader_age, beta: 0.08, center: 73 }
    - { var: actors.CHN.fiscal_stress, beta: 0.8, center: 0.3 }
  reference_class: "PRC has no post-Deng precedent for a non-rule-bound transition; Mao→Hua→Deng is the only one"
  fires:
    technocrat:  { set: { actors.CHN.regime.personalism: 0.5, actors.CHN.regime.succession: 0.4, actors.CHN.regime.leader_born: 1968, actors.CHN.regime.leader_since: now }, mult: { taiwan_blockade: 0.5 } }
    nationalist: { set: { actors.CHN.regime.personalism: 0.75, actors.CHN.regime.leader_born: 1966, actors.CHN.regime.leader_since: now }, mult: { taiwan_blockade: 2.5, scs_incident: 1.8 } }
  source: estimate

- id: taiwan_blockade
  name: Chinese blockade/quarantine of Taiwan
  once: true
  outcomes: [blockade]
  base_q: 0.005                                   # ~18% by 2036
  covariates:
    - { var: actors.CHN.regime.personalism, beta: 1.5, center: 0.8 }
    - { var: latent.us_reliability, beta: -1.5, center: 0.45 }
    - { var: actors.CHN.working_age_share, beta: -8.0, center: 0.68 }   # closing-window logic: shrinking workforce raises pressure to act
    - { var: latent.drone_commoditization, beta: 1.0, center: 0.6 }
  reference_class: "Cuba 1962, Berlin 1948, Taiwan 1996 — great-power quarantines short of invasion"
  fires:
    blockade: { set: { corridors.taiwan_strait.status: closed, world.taiwan_crisis: 1 }, add: { actors.TWN.war_losses: 0.3, actors.CHN.war_losses: 0.1 }, mult: { taiwan_control: 20.0, us_reliability_reversal_up: 2.0, japan_korea_weaponize: 3.0, export_control_collapse: 0.3 } }
  source: estimate

- id: taiwan_control
  name: Taiwan changes controller
  once: true
  outcomes: [prc_control]
  base_q: 0.0005                                  # ~2% by 2036 unconditioned; ×20 under blockade
  covariates:
    - { var: latent.us_reliability, beta: -2.0, center: 0.45 }
  fires:
    prc_control: { set: { territories.taiwan.controller: CHN, territories.taiwan.status: occupied, actors.TWN.regime.type: closed_autocracy, actors.CHN.tech.logic: S }, mult: { japan_korea_weaponize: 4.0 } }
  source: estimate

