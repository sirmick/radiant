  fires:
    collapse: { set: { actors.CHN.tech.ai_compute: S, actors.CHN.tech.euv: I }, mult: { taiwan_blockade: 0.7 } }
  source: estimate
  notes: "'Presence was the product.' Fires when the US stops coordinating; China buys in bulk, minus the pretense."

- id: us_reliability_reversal_down
  name: US reliability shock (down)
  once: false
  outcomes: [shock]
  base_q: 0.02
  covariates:
    - { var: latent.us_reliability, beta: -2.0, center: 0.45 }
  fires:
    shock: { add: { latent.us_reliability: -0.15, actors.USA.openness: -0.1 }, mult: { export_control_collapse: 1.5, saudi_bomb: 1.3, japan_korea_weaponize: 1.3 } }
  source: estimate

- id: us_reliability_reversal_up
  name: US course correction (alliances as assets, immigration reopened)
  once: false
  outcomes: [correction]
  base_q: 0.015                                   # ~45% by 2036; the transcript's "one election" reversal
  covariates:
    - { var: actors.USA.fiscal_stress, beta: 2.0, center: 0.2 }     # depression as tuition
    - { var: latent.us_reliability, beta: -1.0, center: 0.45 }
  fires:
    correction: { add: { latent.us_reliability: 0.25, actors.USA.openness: 0.3 }, mult: { export_control_collapse: 0.5, us_reliability_reversal_down: 0.6 } }
  source: estimate

- id: us_depression
  name: US depression-class downturn
  once: true
  outcomes: [depression]
  base_q: 0.006                                   # ~21% by 2036
  covariates:
    - { var: actors.USA.reserve_currency_share, beta: -8.0, center: 0.57 }
    - { var: actors.USA.gov_debt_gdp, beta: 2.0, center: 1.2 }
    - { var: latent.electrification_speed, beta: 1.0, center: 1.0 }   # shale dies first
  fires:
    depression: { add: { actors.USA.fiscal_stress: 0.4, actors.USA.war_losses: 0 }, mult: { us_reliability_reversal_up: 3.0 } }
  source: estimate

- id: crqc
  name: Cryptographically relevant quantum computer
  once: true
  outcomes: [allied_first, china_first]
  outcome_weights: [0.65, 0.35]
  base_q: 0.012                                   # ~38% by 2036, ~62% by 2046 (transcript: ~50% inside the window, 2032-40 modal)
  covariates:
    - { var: actors.USA.stem_immigration, beta: 0.01, center: 100, outcome: allied_first }
  fires:
    allied_first: { set: { actors.USA.tech.quantum: S, actors.GBR.tech.quantum: S, world.crypto_reset: 1 } }
    china_first:  { set: { actors.CHN.tech.quantum: S, world.crypto_reset: 1 } }
