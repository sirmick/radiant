  base_q: 0.08                                    # each firing advances one random not-yet-built corridor by ~0.2
  covariates:
    - { var: latent.china_export_push, beta: 1.0, center: 1.0 }
  fires:
    advance: { corridor_advance: 0.2 }
  source: estimate
  notes: "Pooled hazard; the engine picks a corridor weighted by (1 − completion) and honours `requires`. Each corridor's own hazard id points here."

