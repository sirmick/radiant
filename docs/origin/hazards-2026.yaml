  outcomes: [weapon]
  base_q: 0.001
  covariates:
    - { var: latent.us_reliability, beta: -2.0, center: 0.45 }
    - { var: world.nato_hollow, beta: 1.5, center: 0 }
  fires:
    weapon: { set: { actors.TUR.nuclear.status: weapon, actors.TUR.nuclear.warheads: 10, actors.TUR.tech.nukes: S } }
  source: estimate

- id: japan_korea_weaponize
  name: Japan and/or Korea weaponize
  once: true
