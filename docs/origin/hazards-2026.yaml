# Hazards — unknown-time events as competing risks, evaluated every quarter.
#   λ_t = base_q × exp(Σ beta·(x − center)) × Π(active multipliers);  P(fire this quarter) = 1 − exp(−λ_t)
# base_q is a QUARTERLY rate. The build prints the implied 10-year cumulative probability next to each so nobody sets 0.05 by feel.
# Covariate vars are paths into the sampled world: actors.<ISO>.<var>, latent.<id>, world.<var>, corridors.<id>.completion, territories.<id>.controller
# fires.<outcome>: set = state rewrites, mult = multipliers on other hazards (persist for the run), add = additive state changes
# once: true = can fire at most once per run. Snapshot: 2026-09-06. All numbers are estimates unless sourced.

- id: russia_transition
  name: Russian leadership transition
  once: true
  outcomes: [managed, hardliner, fragmentation]
  outcome_weights: [0.5, 0.3, 0.2]
  base_q: 0.012                                   # ~38% by 2036 at baseline covariates
  covariates:
    - { var: actors.RUS.leader_age, beta: 0.07, center: 74 }
    - { var: actors.RUS.fiscal_stress, beta: 1.2, center: 0.3 }
    - { var: actors.RUS.war_losses, beta: 0.8, center: 0.6 }
    - { var: actors.RUS.refining_coverage, beta: -0.8, center: 1.3 }
  reference_class: "personalist autocracies, leader >70, stalemated war, high fiscal stress: 1905, 1917, 1953, 1991 (n≈4, all Russian) + Franco/Tito/Mao for the age term"
  fires:
    managed:       { set: { actors.RUS.regime.personalism: 0.55, actors.RUS.regime.leader_born: 1965, actors.RUS.regime.leader_since: now }, mult: { ukraine_freeze: 3.0 } }
    hardliner:     { set: { actors.RUS.regime.leader_born: 1968, actors.RUS.regime.leader_since: now }, mult: { ukraine_freeze: 0.5, baltic_incident: 2.5 } }
    fragmentation: { set: { actors.RUS.regime.type: state_failure, actors.RUS.regime.personalism: 0.3, territories.transnistria.controller: MDA, territories.abkhazia.status: contested_active }, mult: { ukraine_freeze: 5.0, siberia_china_lease: 4.0 } }
  source: estimate

- id: ukraine_freeze
  name: Ukraine armistice on the current line
  once: true
  outcomes: [armistice]
  base_q: 0.05                                    # ~87% by 2036; the transcript said "a year or two, not five" driven by refinery numbers
  covariates:
    - { var: actors.RUS.fiscal_stress, beta: 1.5, center: 0.3 }
    - { var: actors.RUS.refining_coverage, beta: -1.5, center: 1.3 }
    - { var: latent.us_reliability, beta: -0.8, center: 0.45 }    # a reliable US keeps Kyiv fighting longer
  reference_class: "Korea 1953, Transnistria 1992, Karabakh 1994: stalemate + exhaustion → line freeze without treaty"
  fires:
    armistice: { set: { territories.donbas.status: frozen, territories.ukraine_south_occupied.status: frozen, actors.UKR.war_losses: 0.3 }, mult: { ukraine_territory: 0.15, baltic_incident: 0.7 } }
  source: estimate

- id: ukraine_territory
  name: Control change on the Ukrainian front
  outcomes: [rus_gain, ukr_gain]
  outcome_weights: [0.55, 0.45]
  base_q: 0.02                                    # per quarter, either direction, while contested_active
  covariates:
    - { var: actors.RUS.fiscal_stress, beta: -1.0, center: 0.3, outcome: rus_gain }
    - { var: latent.drone_commoditization, beta: 1.0, center: 0.6, outcome: ukr_gain }
  fires:
    rus_gain: { add: { actors.UKR.war_losses: 0.05 } }
    ukr_gain: { add: { actors.RUS.war_losses: 0.05 } }
  source: estimate
  notes: "Territory geometry doesn't move in M1; this only accrues war_losses and feeds the transition hazards. M2 shifts the sketch."

- id: baltic_incident
  name: Russia–NATO militarized incident (Baltics/Suwałki)
  once: false
  outcomes: [incident]
  base_q: 0.004                                   # ~15% by 2036
  covariates:
    - { var: latent.us_reliability, beta: -1.5, center: 0.45 }
    - { var: actors.RUS.regime.personalism, beta: 1.0, center: 0.85 }
  fires:
    incident: { add: { actors.POL.milex_gdp: 0.005, actors.DEU.milex_gdp: 0.003 }, mult: { us_reliability_reversal_up: 1.5 } }
  source: estimate

- id: iran_consolidation
  name: Iranian post-Khamenei consolidation
  once: true
  outcomes: [pragmatic, junta, state_failure]
  outcome_weights: [0.35, 0.45, 0.20]
  base_q: 0.06                                    # ~91% by 2036 — the factional fight resolves one way or another within a decade
  covariates:
    - { var: world.exit_door, beta: 1.5, center: 0.3, outcome: pragmatic }         # visible exit raises the pragmatic split
    - { var: corridors.china_iran_turkey.completion, beta: 1.2, center: 0.5, outcome: pragmatic }
    - { var: actors.IRN.fiscal_stress, beta: 1.0, center: 0.6, outcome: state_failure }
    - { var: actors.IRN.war_losses, beta: 1.0, center: 0.5, outcome: junta }
  reference_class: "Iran 1988 (poison chalice), Iran 2013-15 (JCPOA under sanctions) for pragmatic; Egypt 2013, Myanmar 2021 for junta; Libya, Syria 2011 for failure"
  fires:
    pragmatic:     { set: { actors.IRN.regime.personalism: 0.45, actors.IRN.regime.succession: 0.4, actors.IRN.regime.leader_born: 1965, actors.IRN.regime.leader_since: now, actors.IRN.openness: 0.3 }, mult: { iran_bomb: 0.3, hormuz_reopens: 3.0, corridor_build: 1.8, israel_iran_round: 0.5 } }
    junta:         { set: { actors.IRN.regime.personalism: 0.8, actors.IRN.regime.succession: 0.15, actors.IRN.regime.leader_born: 1962, actors.IRN.regime.leader_since: now }, mult: { iran_bomb: 2.5, hormuz_reopens: 0.6, israel_iran_round: 1.8 } }
    state_failure: { set: { actors.IRN.regime.type: state_failure, actors.IRN.regime.personalism: 0.3 }, mult: { iran_bomb: 0.8, heu_unaccounted: 6.0, corridor_build: 0.3, saudi_bomb: 1.5 } }
  source: estimate

- id: iran_bomb
  name: Iran tests or is assessed to possess a nuclear weapon
  once: true
  outcomes: [weapon]
  base_q: 0.008                                   # ~27% by 2036 unconditioned; consolidation multipliers move it 0.3×–2.5×
  covariates:
    - { var: actors.IRN.war_losses, beta: 1.0, center: 0.5 }
    - { var: world.exit_door, beta: -1.5, center: 0.3 }
  reference_class: "nuclear-latent states attacked or decapitated: Iraq 1981 (pursued, failed), Syria 2007 (abandoned), Libya 2003 (abandoned pre-attack), North Korea (bomb). n≈4, base rate ~25% → bomb"
  fires:
    weapon: { set: { actors.IRN.nuclear.status: weapon, actors.IRN.nuclear.warheads: 5, actors.IRN.tech.nukes: S }, mult: { saudi_bomb: 6.0, turkey_bomb: 2.5, israel_iran_round: 2.0, corridor_build: 0.5 } }
  source: estimate

- id: heu_removed
  name: Verified removal/downblending of Iran's 60% HEU
  once: true
  outcomes: [removed]
  base_q: 0.02                                    # ~55% by 2036
  covariates:
    - { var: world.exit_door, beta: 2.0, center: 0.3 }
    - { var: actors.IRN.regime.personalism, beta: -1.5, center: 0.6 }
  fires:
    removed: { mult: { iran_bomb: 0.25, israel_iran_round: 0.5, saudi_bomb: 0.6 } }
  source: estimate

- id: heu_unaccounted
  name: HEU stockpile leaves state custody
  once: true
  outcomes: [loose]
  base_q: 0.001
  fires:
    loose: { mult: { saudi_bomb: 2.0, israel_iran_round: 3.0 } }
  source: estimate
  notes: "Only meaningful after state_failure; the multiplier there makes it ~6× more likely."

- id: hormuz_reopens
  name: Hormuz reopens to commercial traffic
  once: false
  outcomes: [reopen]
  base_q: 0.10                                    # ~98% by 2036; expected within ~2 years at baseline
  covariates:
    - { var: actors.IRN.fiscal_stress, beta: 1.0, center: 0.6 }
    - { var: actors.USA.fiscal_stress, beta: 0.5, center: 0.2 }
  fires:
    reopen: { set: { corridors.hormuz.status: open, world.exit_door: 0.45 }, mult: { israel_iran_round: 0.8 } }
  source: estimate

- id: israel_iran_round
  name: Another Israel–Iran strike round
  once: false
  outcomes: [round]
  base_q: 0.06                                    # recurring; ~1 round per 4 years at baseline
  covariates:
    - { var: actors.IRN.war_losses, beta: -0.5, center: 0.5 }
    - { var: latent.drone_commoditization, beta: 0.5, center: 0.6 }
  fires:
    round: { add: { actors.IRN.war_losses: 0.15, actors.ISR.war_losses: 0.08, actors.IRN.refining_coverage: -0.1 }, set: { world.exit_door: 0.15 }, mult: { hormuz_reopens: 0.5, corridor_build: 0.7 } }
  source: estimate
  notes: "Each round slams the exit door and delays corridors. This is the mechanism by which 'the policy pursued to prevent the bomb produces it'."

- id: israel_syria_treaty
  name: Israel–Syria security agreement
  once: true
  outcomes: [treaty]
  base_q: 0.03                                    # ~70% by 2036
  covariates:
    - { var: latent.us_reliability, beta: 1.0, center: 0.45 }     # needs a US guarantor for the south
    - { var: actors.ISR.regime.personalism, beta: -1.0, center: 0.55 }
    - { var: actors.SYR.war_losses, beta: -1.0, center: 0.8 }     # a fragmenting Syria can't sign
  reference_class: "1974 disengagement; Egypt 1979; Jordan 1994 — dominance converted to treaty before it expires"
  fires:
    treaty: { set: { territories.syria_buffer.controller: UN, territories.syria_buffer.status: buffer, territories.syria_buffer.stakes.ISR: 0.3 }, mult: { turkey_israel_clash: 0.3, syria_zones: 0.5, corridor_build: 1.3 } }
  source: estimate

- id: syria_buffer_control
  name: Change of control in the southern Syria buffer
  outcomes: [israel_expands, syria_recovers]
  outcome_weights: [0.5, 0.5]
  base_q: 0.01
  covariates:
    - { var: actors.SYR.war_losses, beta: 1.0, center: 0.8, outcome: israel_expands }
  fires:
    israel_expands: { set: { territories.syria_buffer.status: occupied }, mult: { israel_syria_treaty: 0.5 } }
    syria_recovers: { set: { territories.syria_buffer.controller: SYR, territories.syria_buffer.status: buffer } }
  source: estimate

- id: syria_zones
  name: Syrian state fragmentation event (Druze / Alawite / Kurdish / ISIS)
  once: false
  outcomes: [fragment]
  base_q: 0.03
  covariates:
    - { var: actors.SYR.fiscal_stress, beta: 1.0, center: 0.7 }
  fires:
    fragment: { add: { actors.SYR.war_losses: 0.1 }, set: { territories.syria_northeast_sdf.status: contested_active }, mult: { corridor_build: 0.6, israel_syria_treaty: 0.6 } }
  source: estimate

- id: turkey_israel_clash
  name: Turkey–Israel direct exchange of fire in Syria
  once: true
  outcomes: [clash]
  base_q: 0.003                                   # ~11% by 2036 (transcript: ~10% over five years)
  covariates:
    - { var: territories.syria_north_turkish.status, beta: 0, center: 0 }
    - { var: actors.TUR.regime.personalism, beta: 1.0, center: 0.75 }
  reference_class: "accident-driven: Turkish crew arrives early, Syrian-manned Turkish system fires. Not a decision."
  fires:
    clash: { add: { actors.TUR.war_losses: 0.1, actors.ISR.war_losses: 0.05 }, set: { world.nato_hollow: 1 }, mult: { us_reliability_reversal_down: 1.5, israel_syria_treaty: 0.3 } }
  source: estimate

- id: saudi_normalization
  name: Saudi–Israel normalization
  once: true
  outcomes: [normalize]
  base_q: 0.015                                   # ~45% by 2036
  covariates:
    - { var: latent.us_reliability, beta: 1.2, center: 0.45 }
    - { var: actors.ISR.regime.personalism, beta: -1.0, center: 0.55 }
  fires:
    normalize: { mult: { corridor_build: 1.5, saudi_bomb: 0.6 } }
  source: estimate

- id: saudi_bomb
  name: Saudi Arabia acquires nuclear weapons (Pakistan option)
  once: true
  outcomes: [weapon]
  base_q: 0.002                                   # ~8% by 2036 unconditioned; iran_bomb ×6
  covariates:
    - { var: latent.us_reliability, beta: -2.0, center: 0.45 }
  fires:
    weapon: { set: { actors.SAU.nuclear.status: weapon, actors.SAU.nuclear.warheads: 10, actors.SAU.tech.nukes: S }, mult: { turkey_bomb: 2.0 } }
  source: estimate

- id: turkey_bomb
  name: Turkey weaponizes
